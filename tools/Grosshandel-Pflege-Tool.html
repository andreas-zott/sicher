}

function protokoll(neu, L, dateien, seitenNeu) {
    const z = [];
    const linie = '='.repeat(70);
    z.push('Großhandel Begehung – Pflege von Prüfkatalog, Texten und Quellen');
    z.push(linie);
    z.push(`Ausgabestand: ${S.an.build} → ${S.neuBuild}`);
    z.push(`Erstellt: ${new Date().toLocaleString('de-DE')} mit dem Pflege-Tool Rev. ${TOOL.revision}`);
    z.push(`Pakete: ${S.pakete.map(p => p.pk.name).join(', ')}`);
    if (neu.gbo) z.push(`Gefährdungsbeurteilung: ${gboFragenZahl(neu.gbo)} Fragen in den Katalogen (vorher ${gboFragenZahl(S.alt.gbo)}), ${neu.gbo.ghMod.length} Großhandel-Module`);
    z.push(`Prüfkatalog: ${neu.kats.length} Kategorien, ${neu.kats.reduce((a, k) => a + k.items.length, 0)} Fragen (vorher ${S.alt.kats.length} / ${S.alt.kats.reduce((a, k) => a + k.items.length, 0)})`);
    const abschnitt = (t, a) => { z.push(''); z.push(t); z.push('-'.repeat(70)); z.push(a.length ? a.join('\n') : '(keine)'); };
    abschnitt('PRÜFKATALOG (js/audit-data.js)', L.katalog);
    abschnitt('MASSNAHMENTEXTE (js/text.js)', L.texte);
    abschnitt('QUELLENVERZEICHNIS IM PDF (js/text.js)', L.quellen);
    abschnitt('AUSSTATTUNG / BETRIEBSPROFIL (js/audit-data.js, js/gbo-gh-daten.js)', L.ausstattung);
    if (neu.gbo) {
        const G2 = KGBO.aenderungen(S.an.gbo, S.alt.gbo, neu.gbo);
        abschnitt('GEFÄHRDUNGSBEURTEILUNG – GROSSHANDEL-MODULE (js/gbo-gh-daten.js)', G2.module);
        abschnitt('GEFÄHRDUNGSBEURTEILUNG – FRAGEN (js/gbo-data.js, js/gbo-struktur.js, js/gbo-gh-*.js)', G2.fragen);
        abschnitt('GEFÄHRDUNGSBEURTEILUNG – HINWEISE UND MASSNAHMEN (js/gbo-quellen.js, js/gbo-struktur.js, js/gbo.js, js/gbo-gh-*.js)', G2.hinweise);
        abschnitt('GEFÄHRDUNGSBEURTEILUNG – REGELWERKE (js/gbo-quellen.js, js/gbo-gh-daten.js)', G2.regelwerke);
    }
    if (dateien) dateien.forEach(d => abschnitt('GEÄNDERTE DATEIEN – ' + d.name, d.liste.concat(d.hinweise.map(h => 'Hinweis: ' + h))));
    const hand = handStellenJetzt(neu, seitenNeu);
    abschnitt('BITTE VON HAND PRÜFEN (Freitext, den das Tool nicht ändert)', hand);
    abschnitt('DANACH', [
        '1. Neues Paket entpacken und die App im Browser öffnen: geänderte Fragen im Prüfkatalog,',
        '   Maßnahmentexte in allen drei Sprachstilen, das PDF mit Quellenverzeichnis und die',
        '   Gefährdungsbeurteilung (geänderte Module, Hinweise, Maßnahmen) ansehen.',
        '2. Auf den Server kopieren. config.php NICHT überschreiben (sie ist nicht im Paket).',
        '3. Die Geräte laden den neuen Stand beim nächsten Öffnen mit Verbindung automatisch.',
        '4. Diese Liste zusammen mit dem Paket aufbewahren (Nachweis der fachlichen Änderung).'
    ]);
    return z.join('\n') + '\n';
}
function handStellenJetzt(neu, seitenNeu) {
    const seiten = {};
    if (S.hilfeText) seiten['hilfe.html'] = S.hilfeText;
    Object.assign(seiten, S.seitenText || {});
    if (S.an.roh.doku) seiten['dokumentation.html'] = S.an.roh.doku;
    Object.assign(seiten, seitenNeu || {});
    return K.handStellen(S.alt, neu, seiten);
}
async function exportiere() {
    const dl = $('#dl');
    dl.innerHTML = '<div class="meldung h">Pakete werden erzeugt …</div>';
    try {
        const neu = bereinigt(S.cur);
        const datum = K.deDatum();
        const ergebnisse = [];
        for (const p of S.pakete) {
            const r = await K.baue(p.pk, p.an, S.alt, neu, { build: S.neuBuild, datum, tool: TOOL.revision, zaehle: zaehleGbo });
            ergebnisse.push({ p, r });
        }
        const L = K.aenderungen(S.alt, neu);
        const R = S.an.root, d0 = ergebnisse[0].r.dateien, seitenNeu = {};
        HAND_SEITEN.forEach(f => { if (d0.has(R + f)) seitenNeu[f] = d0.get(R + f); });
        const log = protokoll(neu, L, ergebnisse.map(e => ({ name: e.p.pk.name, liste: [...e.r.dateien.keys()].map(x => '~ ' + x), hinweise: e.r.hinweise })), seitenNeu);
        const logName = 'PFLEGE-AENDERUNGEN_' + S.neuBuild + '.txt';
        const links = [];
        const ausgelassen = new Set();
        for (const { p, r } of ergebnisse) {
            const zip = new JSZip();
            for (const path of p.pk.paths) {
                if (/(^|\/)(\.DS_Store|Thumbs\.db)$/.test(path) || path.includes('__MACOSX/')) continue;
                // Zugangsdaten und Serverdaten nie ins Paket
                const rel = path.slice(p.an.root.length);
                if (path.startsWith(p.an.root)) {
                    if (/^config\.php$/i.test(rel)) { ausgelassen.add('config.php'); continue; }
                    // im Datenordner nur die Schutzdateien (web.config, .htaccess, index.*) – keine Begehungen, Konten, Protokolle
                    if (/^daten\//i.test(rel) && !/^daten\/(web\.config|\.htaccess|index\.[a-z]+)$/i.test(rel)) { ausgelassen.add('Inhalte des Ordners daten/'); continue; }
                }
                const opt = { date: p.pk.datum(path) };
                if (r.dateien.has(path)) zip.file(path, r.dateien.get(path), { date: new Date() });
                else zip.file(path, await p.pk.bytes(path), opt);
            }
            if (p.an.root) zip.file(logName, log);
            const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 }, mimeType: 'application/zip' });
            let name = p.pk.name.replace(/ \(Ordner\)$/, '');
            name = name.includes(S.an.build) ? name.split(S.an.build).join(S.neuBuild) : name.replace(/\.zip$/i, '') + '-' + S.neuBuild;
            if (!/\.zip$/i.test(name)) name += '.zip';
            links.push({ name, url: URL.createObjectURL(blob), groesse: blob.size });
        }
        links.push({ name: logName, url: URL.createObjectURL(new Blob([log], { type: 'text/plain;charset=utf-8' })), groesse: log.length });
        S.ergebnis = { links, log };
        dl.innerHTML = `<div class="meldung ok">✓ Fertig. Bitte herunterladen:</div>` +
            links.map(l => `<a class="btn" href="${l.url}" download="${esc(l.name)}">⬇ ${esc(l.name)} <span class="muted klein">(${Math.round(l.groesse / 1024)} KB)</span></a>`).join('') +
            (ausgelassen.size ? `<div class="meldung h">Nicht ins Paket übernommen: ${esc([...ausgelassen].join(', '))} (Zugangsschlüssel bzw. Serverdaten bleiben auf dem Server).</div>` : '') +
            `<p class="klein muted">Die Änderungsliste liegt auch in jedem ZIP neben dem App-Ordner. Nach dem Herunterladen kann die Bearbeitung hier verworfen werden („Paket laden“ → „Alles verwerfen“).</p>`;
        $('.log').textContent = log;
        try { localStorage.removeItem(ENTWURF()); } catch (e) { /* egal */ }
    } catch (e) {
        console.error(e);
        dl.innerHTML = '<div class="meldung f">Fehler beim Erzeugen: ' + esc(e.message || e) + '</div>';
    }
}

function setze(pfad, wert, el) {
    const t = pfad.split('.');
    const k = S.cur.kats[S.kat];
    if (t[0] === 'k') {
        if (t[1] === 'name' && (k.neu || !S.altKat[k.id]) && !k.idManuell) {
            k.id = K.slug(wert);
            const idEl = document.querySelector('[data-b="k.id"]'); if (idEl) idEl.value = k.id;
        }
        if (t[1] === 'id') k.idManuell = true;
        k[t[1]] = wert;
        const a = S.altKat[k.id];
        if (el && a && !k.neu && (t[1] === 'name' || t[1] === 'naLabel' || t[1] === 'bereich')) el.classList.toggle('geaendert', n(a[t[1]], wert));
        if (t[1] === 'name') { const b = document.querySelector('.katliste .kat.akt span:nth-child(2)'); if (b) b.textContent = wert || '(ohne Name)'; }
    } else if (t[0] === 'i') {
        const it = k.items[+t[1]];
        const a = it.neu ? null : S.altIdx[it.id];
        if (t[2] === 'm') { it.m[t[3]] = wert; if (el && a) el.classList.toggle('geaendert', n(a.m[t[3]], wert)); }
        else if (t[2] === 'group') { it.group = wert; if (el && a) el.classList.toggle('geaendert', n(a.group || '', wert)); }
        else if (t[2] === 'pruef') { const v = wert.trim(); it.pruef = v === '' ? undefined : (/^\d+$/.test(v) ? parseInt(v, 10) : v); if (el && a) el.classList.toggle('geaendert', String(a.pruef == null ? '' : a.pruef) !== v); }
        else { it[t[2]] = wert; if (el && a && t[2] === 'text') el.classList.toggle('geaendert', n(a.text, wert)); }
    } else if (t[0] === 's') {
        S.cur.standard[t[1]] = wert;
        if (el) el.classList.toggle('geaendert', n(S.alt.standard[t[1]], wert));
    } else if (t[0] === 'q') {
        S.cur.quellen[t[1]][+t[2]] = wert;
        if (el) el.classList.toggle('geaendert', !S.alt.quellen[t[1]].includes(K.normText(wert)));
    } else if (t[0] === 'a') {
        const e = S.cur.ausstattung[+t[1]];
        const a = S.alt.ausstattung.find(x => x.key === e.key);
        if (t[2] === 'kategorien' || t[2] === 'module') {
            e[t[2]] = String(wert).split(',').map(x => x.trim()).filter(Boolean);
            const info = $((t[2] === 'kategorien' ? '#ak-' : '#am-') + t[1]);
            if (info) info.textContent = e[t[2]].map(t[2] === 'kategorien' ? S._katName : S._modName).join(' · ') || '–';
            if (el && a) el.classList.toggle('geaendert', !K.gleich(a[t[2]], e[t[2]]));
        } else {
            e[t[2]] = wert;
            if (el && a && t[2] === 'label') el.classList.toggle('geaendert', n(a.label, wert));
        }
    }
    merkeEntwurf();
}

main.addEventListener('click', e => {

      <div class="zeile"><input type="text" id="gb-srcfilter" placeholder="Suchen …" value="${esc(S.gsrcFilter)}" style="max-width:320px"><span class="klein muted">${zeilen.length} von ${c.src.length}</span><div class="sp"></div><button class="btn klein" data-act="gb-src-neu">+ Regelwerk</button></div></div>
      <div class="card"><table class="t"><tr><th style="width:170px">Schlüssel</th><th>Fundstelle</th><th>Worum es geht</th><th style="width:70px">geprüft</th><th style="width:150px">genutzt in</th><th style="width:40px"></th></tr>
      ${zeilen.map(({ s, i }) => {
          const a = S.alt.gbo.src.find(x => x.key === s.key);

          return `<tr><td>${neu ? `<input type="text" data-gb="s.${i}.key" value="${esc(s.key)}">` : `<code>${esc(s.key)}</code>`}${s.gh ? ' <span class="pill gh" style="font-size:11px">GH</span>' : ''}</td>
          <td><input type="text" data-gb="s.${i}.norm" value="${esc(s.norm)}" class="${kl(a && n(a.norm, s.norm))}"></td>
          <td><input type="text" data-gb="s.${i}.gloss" value="${esc(s.gloss)}" class="${kl(a && n(a.gloss, s.gloss))}"></td>
          <td style="text-align:center"><input type="checkbox" data-gb="s.${i}.ok" ${s.ok ? 'checked' : ''}></td>

    const c = S.cur.gbo;
    if (!c.seite) { main.innerHTML = `<div class="card"><div class="meldung h">${esc(S.an.gbo.seiteFehler || 'quellen.html ist nicht im Paket.')}</div></div>`; return; }
    main.innerHTML = `<div class="card"><h2>Quellenübersicht (quellen.html)</h2></div>` +
        c.seite.map((g, gi) => `<div class="card"><h3 style="margin-top:0">${esc(g.titel)} <span class="pill">${g.zeilen.length}</span></h3>
        ${g.zeilen.map((r, zi) => `<div style="display:grid;grid-template-columns:150px 1fr 1fr 1fr 150px 106px;gap:6px;margin-top:5px">
          <input type="text" data-gb="p.${gi}.${zi}.kurz" value="${esc(r.kurz)}"><input type="text" data-gb="p.${gi}.${zi}.titel" value="${esc(r.titel)}">
          <input type="text" data-gb="p.${gi}.${zi}.hinweis" value="${esc(r.hinweis)}"><input type="text" data-gb="p.${gi}.${zi}.url" value="${esc(r.url)}">
          <input type="text" data-gb="p.${gi}.${zi}.apps" value="${esc(r.apps.join(', '))}">
          <span><button class="btn icon gefahr" data-act="gb-p-weg" data-g="${gi}" data-i="${zi}">✕</button></span></div>`).join('')}
        <div style="margin-top:8px"><button class="btn klein" data-act="gb-p-neu" data-g="${gi}">+ Zeile</button></div></div>`).join('');
}

// ---- Klicks ----
function gboKlick(act, b, i) {
    const c = S.cur && S.cur.gbo;
    switch (act) {
        case 'gb-mod': S.gmod = b.dataset.m; renderGbo(); window.scrollTo(0, 0); return true;
        case 'gb-modul-neu': {
            const art = prompt('Art des neuen Moduls:\n1 = Bereich\n2 = Maschine/Anlage\n3 = Einrichtung/Tätigkeit', '1');
            if (art == null) return true;
            const a2 = { 1: 'bereich', 2: 'maschine', 3: 'thema' }[String(art).trim()];
            if (!a2) { alert('Bitte 1, 2 oder 3 eingeben.'); return true; }
            const titel = (prompt('Titel des neuen Moduls (wie in der Auswahlliste der GBO):', '') || '').trim();
            if (!titel) return true;
            S.gmod = GB.neuesModul(S.an.gbo, S.alt.gbo, c, a2, titel);
            gboModuleAbgleichen();
            merkeEntwurf(); renderGbo(); window.scrollTo(0, 0); return true;
        }
        case 'gb-modul-weg': {
            const g = c.ghMod.find(x => x.id === S.gmod);
            if (!confirm(`Großhandel-Modul „${g.titel}“ entfernen?`)) return true;
            c.ghMod.splice(c.ghMod.indexOf(g), 1); delete c.fragen[S.gmod];
            S.cur.ausstattung.forEach(e => { e.module = e.module.filter(x => x !== S.gmod); });
            S.gmod = null; merkeEntwurf(); renderGbo(); return true;
        }
        case 'gb-frage-neu': {
            const id = GB.naechsteId(S.an.gbo, S.alt.gbo, c, S.gmod);
            const l = c.fragen[S.gmod];
            const letzte = l[l.length - 1];
            const q = { id, thema: letzte ? letzte.thema : '', text: '', neu: true };
            if (istGh(S.gmod)) Object.assign(q, { cat: letzte ? letzte.cat : (c.cat.find(x => x.gh) || c.cat[0]).key, law: '', u: false, massn: [] });
            l.push(q);
            merkeEntwurf(); renderGbo();
            const f = document.querySelector(`#gfrage-${l.length - 1} input`); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); f.select(); }
            return true;
        }
        case 'gb-hoch': if (tausch(c.fragen[S.gmod], i, i - 1)) { merkeEntwurf(); renderGbo(); } return true;
        case 'gb-runter': if (tausch(c.fragen[S.gmod], i, i + 1)) { merkeEntwurf(); renderGbo(); } return true;
        case 'gb-weg': {
            const q = c.fragen[S.gmod][i];
            if (!confirm(q.neu ? `Neue Frage ${q.id} wieder entfernen?` : `GBO-Frage ${q.id} entfernen?\n\n„${GB.effektiv(c, q).text}“\n\nDie ID wird stillgelegt und nie wieder vergeben. Vorhandene Bewertungen zu dieser Frage werden in der App nicht mehr angezeigt.`)) return true;
            c.fragen[S.gmod].splice(i, 1); merkeEntwurf(); renderGbo(); return true;
        }
        case 'gb-x-neu': c.f11.push({ id: GB.naechsteF11(S.an.gbo, S.alt.gbo, c), thema: '', text: '', law: '', u: false, massn: [], neu: true }); merkeEntwurf(); renderGbo(); return true;
        case 'gb-x-hoch': if (tausch(c.f11, i, i - 1)) { merkeEntwurf(); renderGbo(); } return true;
        case 'gb-x-runter': if (tausch(c.f11, i, i + 1)) { merkeEntwurf(); renderGbo(); } return true;
        case 'gb-x-weg': if (confirm(`Frage ${c.f11[i].id} entfernen?` + (c.f11[i].neu ? '' : '\n\nDie ID wird stillgelegt.'))) { c.f11.splice(i, 1); merkeEntwurf(); renderGbo(); } return true;
        case 'gb-feld-zeigen': {
            const k = b.dataset.k; let idx = c.cat.findIndex(x => x.key === k && x.gh); if (idx < 0) idx = c.cat.findIndex(x => x.key === k);
            S.tab = 'gbofeld'; S.gfeld = idx; render(); window.scrollTo(0, 0); return true;
        }
        case 'gb-feld': S.gfeld = i; renderGboFeld(); window.scrollTo(0, 0); return true;
        case 'gb-feld-neu': {
            let k = 'NEU', z = 1; while (c.cat.some(x => x.key === k)) k = 'NEU' + (++z);
            c.cat.push({ key: k, src: [], gh: true, faktor: 1, explain: '', t: '', o: '', p: '', e: '' });
            S.gfeld = c.cat.length - 1; merkeEntwurf(); renderGboFeld(); return true;
        }
        case 'gb-feld-weg': if (confirm(`Themenfeld „${c.cat[S.gfeld].key}“ entfernen?`)) { c.cat.splice(S.gfeld, 1); S.gfeld = -1; merkeEntwurf(); renderGboFeld(); } return true;
        case 'gb-fs-hoch': if (tausch(c.cat[S.gfeld].src, i, i - 1)) { merkeEntwurf(); renderGboFeld(); } return true;
        case 'gb-fs-runter': if (tausch(c.cat[S.gfeld].src, i, i + 1)) { merkeEntwurf(); renderGboFeld(); } return true;
        case 'gb-fs-weg': c.cat[S.gfeld].src.splice(i, 1); merkeEntwurf(); renderGboFeld(); return true;
        case 'gb-fs-neu': { const v = $('#gb-fs-neu').value; if (v) { c.cat[S.gfeld].src.push(v); merkeEntwurf(); renderGboFeld(); } return true; }
        case 'gb-src-neu': {
            let k = 'neu1', z = 1; while (c.src.some(s => s.key === k)) k = 'neu' + (++z);
            c.src.push({ key: k, norm: '', gloss: '', ok: false, gh: true }); S.gsrcFilter = ''; merkeEntwurf(); renderGboSrc();
            const t = document.querySelectorAll('[data-gb$=".key"]'); if (t.length) { t[t.length - 1].scrollIntoView({ block: 'center' }); t[t.length - 1].focus(); t[t.length - 1].select(); }
            return true;
        }
        case 'gb-src-weg': if (confirm(`Regelwerk „${c.src[i].norm || c.src[i].key}“ entfernen?`)) { c.src.splice(i, 1); merkeEntwurf(); renderGboSrc(); } return true;
        case 'gb-p-neu': c.seite[+b.dataset.g].zeilen.push({ kurz: '', url: '', titel: '', hinweis: '', apps: [] }); merkeEntwurf(); renderQSeite(); return true;
        case 'gb-p-weg': if (confirm('Zeile entfernen?')) { c.seite[+b.dataset.g].zeilen.splice(i, 1); merkeEntwurf(); renderQSeite(); } return true;
    }
    return false;
}
main.addEventListener('input', e => { const el = e.target; if (el.dataset.gb && el.type !== 'checkbox' && el.tagName !== 'SELECT') gboSetze(el.dataset.gb, el.value, el); });
main.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset.gb) return;
    if (el.type === 'checkbox') gboSetze(el.dataset.gb, el.checked, el);
    else if (el.tagName === 'SELECT') gboSetze(el.dataset.gb, el.value, el);
});

// Normalisieren vor Prüfung/Export
function gboBereinigt(c) {
    const T = K.normText;
    const tx = o => { o.thema = T(o.thema); o.text = T(o.text); };
    const ml = a => (a || []).map(T).filter(Boolean);
    Object.keys(c.fragen).forEach(m => c.fragen[m].forEach(q => { tx(q); if (q.massn) { q.massn = ml(q.massn); q.law = T(q.law); q.cat = T(q.cat); } }));
    ['ov', 'ghov', 'ghovNach'].forEach(t => Object.keys(c[t]).forEach(id => tx(c[t][id])));
    c.f11.forEach(x => { tx(x); x.law = T(x.law); x.massn = ml(x.massn); });
    c.ghMod.forEach(g => { g.titel = T(g.titel); if (g.beschr != null) g.beschr = T(g.beschr); delete g.neu; });
    c.neu.forEach(x => { ['thema', 'text', 'gruppe', 'law'].forEach(k => x[k] = T(x[k])); x.massn = ml(x.massn); });
    Object.keys(c.grund).forEach(g => tx(c.grund[g]));
    Object.keys(c.cfg).forEach(id => { c.cfg[id].law = T(c.cfg[id].law); c.cfg[id].massn = ml(c.cfg[id].massn); });
    c.src.forEach(s => { s.key = T(s.key); s.norm = T(s.norm); s.gloss = T(s.gloss); });
    c.cat.forEach(x => { x.key = T(x.key); GB.FELDER.forEach(f => x[f] = T(x[f])); });
    GB.FELDER.forEach(f => c.def[f] = T(c.def[f]));
    if (c.seite) c.seite.forEach(g => g.zeilen.forEach(r => { ['kurz', 'url', 'titel', 'hinweis'].forEach(k => r[k] = T(r[k])); r.apps = r.apps.map(T).filter(Boolean); }));
    // entfernte IDs stilllegen – Basis in gbo-data.js, Großhandel in gbo-gh-daten.js
    const jetzt = new Set(); Object.values(c.fragen).forEach(l => l.forEach(q => jetzt.add(q.id))); c.f11.forEach(x => jetzt.add(x.id));
    const wegB = [], wegG = [];
    Object.keys(S.alt.gbo.fragen).forEach(m => S.alt.gbo.fragen[m].forEach(q => { if (!jetzt.has(q.id)) (istGh(m) ? wegG : wegB).push(q.id); }));
    S.alt.gbo.f11.forEach(x => { if (!jetzt.has(x.id)) wegG.push(x.id); });
    c.still = [...new Set([...S.alt.gbo.still, ...wegB])].sort();
    c.ghStill = [...new Set([...S.alt.gbo.ghStill, ...wegG])].sort();
    return c;
}

window.addEventListener('beforeunload', e => { if (S.cur && anzahlAenderungen() && !S.ergebnis) { e.preventDefault(); e.returnValue = ''; } });

render();
})();
</script>
