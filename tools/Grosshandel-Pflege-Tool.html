<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Großhandel Begehung – Pflege-Tool</title>
<style>
:root{
  --rot:#0f7280; --rot-d:#0a5560; --tint:#e3f1f3; --ink:#1c2226; --muted:#5f6b73; --line:#dfe3e6;
  --paper:#f5f6f5; --card:#ffffff; --ok:#2e7d4f; --ok-t:#e6f3ec; --warn:#9a6700; --warn-t:#fff6dc;
  --neu:#1f6feb; --neu-t:#e8f0fe; --mod:#b26a00; --mod-t:#fff4e0;
  --radius:10px; --font: "Segoe UI", system-ui, -apple-system, Roboto, "Liberation Sans", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
header.top{background:var(--card);border-bottom:3px solid var(--rot);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:8px;background:var(--rot);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.2px}
header h1{font-size:18px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:13px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill.rot{background:var(--tint);border-color:#b6dadf;color:var(--rot-d)}
.pill.gh{background:#e3f1f3;border-color:#b6dadf;color:#0a5560}
.frist-in{width:112px!important}
.pill.neu{background:var(--neu-t);border-color:#c7d8fb;color:var(--neu)}
.pill.mod{background:var(--mod-t);border-color:#f3d7a6;color:var(--mod)}
.pill.ok{background:var(--ok-t);border-color:#bfe0cc;color:var(--ok)}
nav.schritte{display:flex;align-items:stretch;gap:0;padding:10px 20px 0;background:var(--card);overflow-x:auto}
nav.schritte button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 18px 12px 0;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.schritte button .nr{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:14px;color:var(--muted)}
nav.schritte button .unter{display:block;font-weight:400;font-size:12px;color:var(--muted)}
nav.schritte button.akt{color:var(--ink);border-bottom-color:var(--rot)}
nav.schritte button.akt .nr{background:var(--rot);border-color:var(--rot);color:#fff}
nav.schritte button.fertig .nr{background:#e5f4e4;border-color:#1d6b42;color:#1d6b42}
nav.schritte button:disabled{opacity:.45;cursor:default}
nav.schritte .pfeil{align-self:center;color:var(--line);font-size:20px;padding:0 14px 6px 0}
nav.schritte .sp{flex:1}
nav.schritte .hilfe{font-weight:600;font-size:14px;padding-right:0}
nav.tabs{display:flex;gap:2px;padding:0 20px;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:19;align-items:center}
nav.tabs .titel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-right:10px}
nav.tabs .sp{flex:1}
nav.tabs button.weiter{color:#fff;background:var(--rot);border-radius:8px;padding:7px 14px;border-bottom:0;margin:4px 0}
nav.tabs button.weiter:hover{background:var(--rot-d)}
nav.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.akt{color:var(--rot-d);border-bottom-color:var(--rot)}
nav.tabs button:disabled{opacity:.4;cursor:default}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:16px 0 8px;font-size:15px}
.muted{color:var(--muted)}
.klein{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#c3c9cd}
.btn:disabled{opacity:.4;cursor:default}
.btn.prim{background:var(--rot);border-color:var(--rot);color:#fff}
.btn.prim:hover{background:var(--rot-d)}
.btn.prim:disabled{background:#9cc5cb;border-color:#9cc5cb;cursor:default}
.btn.klein{padding:3px 9px;font-size:13px}
.btn.icon{padding:3px 8px;min-width:30px}
.btn.gefahr{color:var(--rot-d)}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
textarea{resize:vertical;min-height:58px}
input:focus,textarea:focus{outline:2px solid #8cc6cd;border-color:var(--rot)}
.geaendert{background:var(--mod-t)!important;border-color:#e9c27f!important}
.drop{border:2px dashed #c9cfd3;border-radius:var(--radius);padding:28px;text-align:center;background:#fff}
.drop.over{border-color:var(--rot);background:var(--tint)}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}.katliste{position:static;max-height:none}}
@media (max-width:700px){header.top,nav.tabs{position:static}main{padding:12px}}
.katliste{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto;padding:10px}
.katliste button.kat{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer}
.katliste button.kat:hover{background:var(--paper)}
.katliste button.kat.akt{background:var(--tint);color:var(--rot-d);font-weight:700}
.katliste .nr{min-width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.katliste .anz{margin-left:auto;color:var(--muted);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.neu{background:var(--neu)} .dot.mod{background:var(--mod)}
.frage{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;background:#fff}
.frage.neu{border-left:4px solid var(--neu)}
.frage.frei{background:var(--paper);border-style:dashed}
.frage.mod{border-left:4px solid var(--mod)}
.frage-kopf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fid{font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
.fid-in{width:80px!important;font-weight:700}
.gruppe-in{max-width:280px}
details.m{margin-top:8px}
details.m summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.stil{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:8px;align-items:start}
.stil span{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:8px}
.liste-zeile{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.liste-zeile .nr{min-width:26px;color:var(--muted);padding-top:8px;font-size:13px;text-align:right}
.liste-zeile textarea{min-height:38px}
.meldung{border-radius:8px;padding:9px 12px;margin:6px 0;font-size:14px}
.meldung.f{background:#fbe9eb;color:#a30517;border:1px solid #f2c4ca}
.meldung.h{background:var(--warn-t);color:#5c4300;border:1px solid #f0dc9c}
.meldung.ok{background:var(--ok-t);color:var(--ok);border:1px solid #bfe0cc}
pre.log{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 Consolas,"Liberation Mono",monospace;max-height:460px;overflow:auto}
.treffer{border-bottom:1px solid var(--line);padding:7px 2px;font-size:14px;cursor:pointer}
.treffer:hover{background:var(--paper)}
.treffer mark{background:#ffe08a}
.treffer .wo{font-size:12px;color:var(--muted);font-weight:700}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.banner{background:var(--warn-t);border:1px solid #f0dc9c;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.anleitung h3{color:var(--rot-d)}
.anleitung li{margin:3px 0}
code{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.92em}
.hidden{display:none!important}
.dl a{display:inline-block;margin:4px 8px 4px 0}
</style>
</head>
<body>
<header class="top">
  <div class="logo">GH</div>
  <div><h1>Großhandel Begehung – Pflege-Tool</h1><div class="sub">Prüfkatalog, Maßnahmentexte, Quellen, Ausstattung und Gefährdungsbeurteilung · arbeitet nur in diesem Browser, nichts wird hochgeladen</div><div class="sub" id="tool-version"></div></div>
  <div class="sp"></div>
  <div id="status" class="zeile"></div>
</header>
<nav class="schritte" id="schritte">
  <button data-schritt="1" data-tab="laden" class="akt"><span class="nr">1</span><span>Paket laden<span class="unter">ZIP-Datei der App wählen</span></span></button>
  <span class="pfeil" aria-hidden="true">›</span>
  <button data-schritt="2" data-tab="bearbeiten" disabled><span class="nr">2</span><span>Bearbeiten<span class="unter">Begehung, Ausstattung, GBO</span></span></button>
  <span class="pfeil" aria-hidden="true">›</span>
  <button data-schritt="3" data-tab="export" disabled><span class="nr">3</span><span>Prüfen &amp; Paket erzeugen<span class="unter">neue ZIP-Datei für die IT</span></span></button>
  <span class="sp"></span>
  <button class="hilfe" data-tab="anleitung">Anleitung</button>
</nav>
<nav class="tabs hidden" id="tabs">
  <span class="titel">Bearbeiten:</span>
  <button data-tab="katalog" disabled>Begehung</button>
  <button data-tab="quellen" disabled>Quellen PDF</button>
  <button data-tab="ausstattung" disabled>Ausstattung</button>
  <button data-tab="gbo" data-v2 class="hidden" disabled>GBO-Fragen</button>
  <button data-tab="gbofeld" data-v2 class="hidden" disabled>GBO-Hinweise</button>
  <button data-tab="gbosrc" data-v2 class="hidden" disabled>GBO-Regelwerke</button>
  <button data-tab="qseite" data-v2 class="hidden" disabled>Quellenseite</button>
  <button data-tab="suche" disabled>Suchen</button>
  <span class="sp"></span>
  <button class="weiter" data-tab="export" disabled>Weiter zu Schritt 3 →</button>
</nav>
<main id="main"></main>

    const cache = (/const CACHE_NAME\s*=\s*'([^']+)'/.exec(roh.sw) || [])[1];
    const revision = (/const APP_REVISION\s*=\s*'([^']+)'/.exec(roh.app) || [])[1];
    const revisionDatum = (/const APP_REVISION_DATE\s*=\s*'([^']+)'/.exec(roh.app) || [])[1];
    if (!build || !cache) throw new Error('BUILD/CACHE_NAME in sw.js nicht gefunden.');
    if (!cache.endsWith(build)) hinweise.push('CACHE_NAME (' + cache + ') endet nicht auf BUILD (' + build + ').');

    // Prüfkatalog
    const a = findeLiteral(roh.audit, 'AUDIT_CATEGORIES');
    if (!a) throw new Error('AUDIT_CATEGORIES in js/audit-data.js nicht gefunden.');
    // Alles nach dem Katalog (AUSSTATTUNG, FREIE_PUNKT_IDS) bleibt erhalten; AUSSTATTUNG wird gezielt ersetzt
    const auditRest = roh.audit.slice(a.end).replace(/^\s*;/, '').trim();
    const au = findeLiteral(auditRest, 'AUSSTATTUNG');
    if (!au) throw new Error('AUSSTATTUNG in js/audit-data.js nicht gefunden.');
    const still = [];
    const sm = /Stillgelegte Frage-IDs[^:\n]*:([^\n]*)/.exec(roh.audit);
    if (sm) sm[1].split(/[,\s]+/).filter(x => ID_RE.test(x)).forEach(x => still.push(x));

    const t = findeLiteral(roh.text, 'MEASURES_TEXT');
    const q = findeLiteral(roh.text, 'MEASURE_SOURCES');
    if (!t || !q) throw new Error('MEASURES_TEXT / MEASURE_SOURCES in js/text.js nicht gefunden.');

    // Maßnahmentexte flach (wie MEASURES_BY_ID in der App: letzter gewinnt)
    const flach = {}, herkunft = {};
    reihenfolge(t.value).forEach(k => {
        if (k === 'default') return;
        const v = t.value[k];
        if (!v || typeof v !== 'object') return;
        reihenfolge(v).forEach(id => {
            if (flach[id]) hinweise.push('Maßnahmentext ' + id + ' steht in js/text.js doppelt (unter „' + herkunft[id] + '“ und „' + k + '“). Es gilt der zweite.');
            flach[id] = v[id]; herkunft[id] = k;
        });
    });
    const doppelt = [];
    t.dups.forEach(d => {
        const id = d.pfad.split('.').pop();
        if (STILE.includes(d.schluessel)) doppelt.push({ id, stil: d.schluessel, verworfen: d.verworfen, gilt: d.gilt });
        else hinweise.push('In js/text.js ist „' + d.schluessel + '“ unter ' + (d.pfad || 'oberster Ebene') + ' doppelt.');
    });
    a.dups.forEach(d => hinweise.push('In js/audit-data.js ist „' + d.schluessel + '“ unter ' + d.pfad + ' doppelt.'));

    const def = t.value.default || {};
    const kats = a.value.map(k => {
        const items = (k.items || []).map(it => {
            const m = flach[it.id] || {};
            const e = { id: String(it.id), text: String(it.text || ''), m: {} };
            if (it.group) e.group = String(it.group);
            if (it.pruef != null) e.pruef = Number(it.pruef);
            if (it.frei) e.frei = true;   // freier Prüfpunkt (Kategorie „Sonstiges“): Text trägt der Prüfer in der App ein
            STILE.forEach(s => e.m[s] = String(m[s] || ''));
            return e;
        });
        const nr = k.nr != null ? Number(k.nr) : (items.length ? parseInt(items[0].id, 10) : null);
        const kat = { id: String(k.id), name: String(k.name), nr, bereich: String(k.bereich || ''), naLabel: String(k.naLabel || ''), items };
        if (k.instanzen) kat.instanzen = k.instanzen.map(String);
        if (k.profilFeld) kat.profilFeld = String(k.profilFeld);
        const bekannt = ['id', 'name', 'nr', 'bereich', 'naLabel', 'instanzen', 'profilFeld', 'items'];
        Object.keys(k).filter(x => !bekannt.includes(x)).forEach(x => hinweise.push('Kategorie „' + k.name + '“: unbekanntes Feld „' + x + '“ – es geht beim Speichern verloren.'));
        return kat;
    });
    const ausstattung = au.value.map(e => ({ key: String(e.key), label: String(e.label), kategorien: (e.kategorien || []).map(String), module: [] }));

    const gbo = await G.analysiere(pk, root);
    if (!gbo) throw new Error('js/gbo-data.js nicht gefunden.');
    gbo.hinweise.forEach(h => hinweise.push(h));
    const ghA = gbo.modell.ghAusst || {};
    ausstattung.forEach(e => { e.module = (ghA[e.key] || []).slice(); });
    Object.keys(ghA).forEach(k => { if (!ausstattung.some(e => e.key === k)) hinweise.push('js/gbo-gh-daten.js ordnet „' + k + '“ GBO-Module zu – diesen Ausstattungs-Eintrag gibt es nicht.'); });
    delete gbo.modell.ghAusst;

    const modell = {
        kats,
        standard: { einfach: String(def.einfach || ''), bghw: String(def.bghw || ''), rechtlich: String(def.rechtlich || '') },
        quellen: { bghw: (q.value.bghw || []).map(String), rechtsquellen: (q.value.rechtsquellen || []).map(String) },
        ausstattung,
        doku: null,
        still,
        gbo: gbo.modell
    };
    return { root, roh, build, cache, appVersion, revision, revisionDatum, version: 2, gbo, modell, hinweise, doppelt, dokuFehler: null, auditRest, ausstAlt: ghA };
}

// Fingerabdruck der Inhalte, die das Tool bearbeitet (für Mehrfach-Pakete)
function fingerabdruck(an) {
    const r = an.roh;
    const g = an.gbo ? Object.values(an.gbo.roh).map(x => x || '').join('\u0000') : '';
    return hash(r.audit + '\u0000' + r.text + '\u0000' + an.build + '\u0000' + g);
}
function hash(s) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 + c, 2246822519) ^ (h2 >>> 13); }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}

// ---------- Dateien erzeugen ----------
function genAudit(m, datum, opt) {
    const kopf = [
        '// Großhandel Begehung – Prüfkatalog, zuletzt gepflegt mit dem Pflege-Tool' + (opt && opt.tool ? ' Rev. ' + opt.tool : '') + ' am ' + datum + '.',
        '// Jede Kategorie hat einen Schalter "nicht zutreffend" (Text: naLabel). Optionale Unterbereiche über "group",',
        '// Gliederung in Bereiche über "bereich", Prüffrist in Monaten über "pruef" (0 = nur Datum).',
        '// Pflege ab jetzt mit dem Pflege-Tool (Grosshandel-Begehung_Pflege-Tool.html) – tools/erzeuge.py nicht mehr ausführen.'
    ];
    if (m.still.length) kopf.push('// Stillgelegte Frage-IDs (nie wiederverwenden): ' + sortiereIds(m.still).join(', '));
    const kat = m.kats.map(k =>
        '    {\n' +
        '        id: ' + jsStr2(k.id) + ',\n' +
        '        nr: ' + k.nr + ',\n' +
        '        name: ' + jsStr2(k.name) + ',\n' +
        '        bereich: ' + jsStr2(k.bereich) + ',\n' +
        '        naLabel: ' + jsStr2(k.naLabel) + ',\n' +
        (k.instanzen ? '        instanzen: [' + k.instanzen.map(jsStr2).join(', ') + '],\n' : '') +
        (k.profilFeld ? '        profilFeld: ' + jsStr2(k.profilFeld) + ',\n' : '') +
        '        items: [\n' +
        k.items.map(it => '            { id: ' + jsStr2(it.id) + (it.group ? ', group: ' + jsStr2(it.group) : '') +
            (it.pruef != null ? ', pruef: ' + it.pruef : '') +
            (it.frei ? ', frei: true, text: ""' : ', text: ' + jsStr2(it.text)) + ' }').join(',\n') + '\n' +
        '        ]\n' +
        '    }').join(',\n');
    let rest = opt && opt.rest ? opt.rest : '';
    if (rest) rest = ersetzeLiteral(rest, 'AUSSTATTUNG', genAusstLit(m.ausstattung));
    return kopf.join('\n') + '\nconst AUDIT_CATEGORIES = [\n' + kat + '\n];\n' + (rest ? '\n' + rest + '\n' : '');
}

function genAusstLit(liste) {
    return '[\n' + liste.map(e => '    { key: ' + jsStr2(e.key) + ', label: ' + jsStr2(e.label) + ', kategorien: [' + e.kategorien.map(jsStr2).join(', ') + '] }').join(',\n') + '\n]';
}

function genTexteLit(m) {
    const stile = (o, ein) => STILE.map(s => ein + s + ': ' + jsStr2(o[s] || '')).join(',\n');
    // Freie Prüfpunkte haben keinen Maßnahmenvorschlag
    const teile = m.kats.filter(k => k.items.some(it => !it.frei)).map(k =>
        '    ' + jsStr2(k.name) + ': {\n' +
        k.items.filter(it => !it.frei).map(it => '        ' + jsStr2(it.id) + ': {\n' + stile(it.m, '            ') + '\n        }').join(',\n') + '\n    }');
    teile.push('    default: {\n' + STILE.map(s => '        ' + s + ': ' + jsStr1(m.standard[s] || '')).join(',\n') + '\n    }');
    return '{\n' + teile.join(',\n') + '\n}';
}

function genQuellenLit(q) {
    const liste = a => '[\n' + a.map(x => '        ' + jsStr1(x)).join(',\n') + '\n    ]';
    return '{\n    bghw: ' + liste(q.bghw) + ',\n    rechtsquellen: ' + liste(q.rechtsquellen) + '\n}';
}

function ersetzeLiteral(src, name, neu) {
    const l = findeLiteral(src, name);
    if (!l) throw new Error(name + ' nicht gefunden.');
    return src.slice(0, l.start) + neu + src.slice(l.end);
}

function sortiereIds(ids) {
    const s = [...new Set(ids)];
    return s.sort((a, b) => {
        const x = a.split('.').map(Number), y = b.split('.').map(Number);
        for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; }
        return 0;
    });
}

// Katalog-Teile vergleichen
const katalogSicht = m => m.kats.map(k => ({ id: k.id, nr: k.nr, name: k.name, bereich: k.bereich, naLabel: k.naLabel, instanzen: k.instanzen || null, profilFeld: k.profilFeld || null,
    items: k.items.map(i => ({ id: i.id, group: i.group || '', pruef: i.pruef == null ? null : i.pruef, text: i.text, frei: !!i.frei })) }));
const texteSicht = m => ({ k: m.kats.map(k => [k.name, k.items.filter(i => !i.frei).map(i => [i.id, i.m])]), s: m.standard });
const ausstSicht = m => m.ausstattung.map(e => ({ key: e.key, label: e.label, kategorien: e.kategorien }));
const ausstModule = m => { const o = {}; m.ausstattung.forEach(e => { if (e.module.length) o[e.key] = e.module.slice(); }); return o; };

// Kurztitel einer Quelle (vor „ – “)
function kurztitel(q) {
    let k = String(q).split(' – ')[0];
    if (k.length > 60) k = k.split(',')[0];
    return k.trim();
}
const norm = s => String(s).toLowerCase().replace(/\s+/g, ' ');

// ---------- Dokumentation: Zahlen und Tabellen (wie tools/doku-zahlen.py) ----------
function bereicheVon(kats) { const b = []; kats.forEach(k => { if (k.bereich && !b.includes(k.bereich)) b.push(k.bereich); }); return b; }

function tabKatalog(kats) {
    const out = [];
    bereicheVon(kats).forEach(b => {
        out.push(`                <tr class="doku-bereich"><td colspan="4"><strong>${htmlEsc(b)}</strong></td></tr>\n`);
        kats.filter(c => c.bereich === b).forEach(c => {
            const n = c.items.length;
            const frist = c.items.filter(i => i.pruef != null).length;
            const extra = [];
            if (c.instanzen && c.instanzen.length) extra.push('je ' + htmlEsc(c.instanzen[0].replace(/ \S+$/, '')) + ' (bis ' + c.instanzen.length + ')');
            const g = new Set(c.items.map(i => i.group).filter(Boolean));
            if (g.size) extra.push(g.size + ' Unterbereiche');
            if (c.items.some(i => i.frei)) extra.push('freie Prüfpunkte');
            out.push(`                <tr>\n                    <td class="zahl">${c.nr}</td>\n` +
                `                    <td>${htmlEsc(c.name)}${extra.length ? ' <small>· ' + extra.join(', ') + '</small>' : ''}</td>\n` +
                `                    <td class="zahl">${n}</td>\n` +
                `                    <td class="zahl">${frist || '–'}</td>\n                </tr>\n`);
        });
    });
    return out.join('');
}

function tabQuellen(q) {
    const out = [];
    [['Regelwerk der Unfallversicherung, Normen und technische Grundlagen', 'bghw'], ['Gesetze und Verordnungen', 'rechtsquellen']].forEach(([titel, l]) => {
        out.push(`                <tr class="doku-bereich"><td colspan="2"><strong>${htmlEsc(titel)}</strong></td></tr>\n`);
        q[l].forEach(x => {
            const i = x.indexOf(' – ');
            const a = i < 0 ? x : x.slice(0, i), b = i < 0 ? '' : x.slice(i + 3);
            out.push(`                <tr><td>${htmlEsc(a)}</td><td>${htmlEsc(b)}</td></tr>\n`);
        });
    });
    return out.join('');
}

function tabGbo(g, ghIds) {
    const namen = { kern: 'Kernbeurteilung (für jeden Standort)', einrichtung: 'Besondere Einrichtungen und Tätigkeiten', bereich: 'Arbeitsbereiche', maschine: 'Maschinen und Anlagen' };
    const out = [];
    let art = null;
    g.module.forEach(([a, mid, titel, n]) => {
        if (a !== art) { art = a; out.push(`                <tr class="doku-bereich"><td colspan="3"><strong>${htmlEsc(namen[a])}</strong></td></tr>\n`); }
        out.push(`                <tr><td>${htmlEsc(titel)}</td><td class="zahl">${n}</td><td>${ghIds.has(mid) ? 'neu für den Großhandel' : ''}</td></tr>\n`);
    });
    return out.join('');
}

function htmlEscQ(s) { return htmlEsc(s).replace(/"/g, '&quot;').replace(/'/g, '&#x27;'); }

function ersetzeBlock(text, name, inhalt) {
    const s = `<!-- ${name}:START -->`, e = `<!-- ${name}:ENDE -->`;
    if (inhalt == null) return text;
    const a0 = text.indexOf(s), b = text.indexOf(e);
    if (a0 < 0 || b < a0) return text;
    const a = a0 + s.length;
    return text.slice(0, a) + '\n' + inhalt + '                ' + text.slice(b);
}

// ---------- Pakete bauen ----------
// pk: Paket, an: Analyse dieses Pakets, alt/neu: Modelle, opt: { build, datum, tool, zaehle(texte) -> Promise }
async function baue(pk, an, alt, neu, opt) {
    const out = new Map();
    const hinweise = [];
    const R = an.root;
    const lies = async p => out.has(p) ? out.get(p) : await pk.text(p);
    const setze = (p, s) => out.set(p, s);

    const katalogGeaendert = !gleich(katalogSicht(alt), katalogSicht(neu)) || !gleich(alt.still, neu.still) || !gleich(ausstSicht(alt), ausstSicht(neu));
    const texteGeaendert = !gleich(texteSicht(alt), texteSicht(neu)) || an.doppelt.length > 0;
    const quellenGeaendert = !gleich(alt.quellen, neu.quellen);

    // 1) js/audit-data.js
    if (katalogGeaendert) setze(R + 'js/audit-data.js', genAudit(neu, opt.datum, Object.assign({}, opt, { rest: an.auditRest })));

    // 2) js/text.js
    if (texteGeaendert || quellenGeaendert) {
        let s = an.roh.text;
        if (texteGeaendert) s = ersetzeLiteral(s, 'MEASURES_TEXT', genTexteLit(neu));
        if (quellenGeaendert) s = ersetzeLiteral(s, 'MEASURE_SOURCES', genQuellenLit(neu.quellen));
        if (/^\/\/ Zuletzt gepflegt mit dem Pflege-Tool am /m.test(s)) s = s.replace(/^(\/\/ Zuletzt gepflegt mit dem Pflege-Tool am )[^\n]*/m, '$1' + opt.datum + '.');
        else s = s.replace(/^(\/\/ Erstfassung[^\n]*)$/m, '$1\n// Zuletzt gepflegt mit dem Pflege-Tool am ' + opt.datum + '.');
        if (s !== an.roh.text) setze(R + 'js/text.js', s);
    }

    // 3) Gefährdungsbeurteilung
    const g = G.baue(an.gbo, alt.gbo, neu.gbo, Object.assign({}, opt, { ausst: { alt: an.ausstAlt, neu: ausstModule(neu) } }));
    Object.keys(g.dateien).forEach(rel => setze(R + rel, g.dateien[rel]));
    g.hinweise.forEach(h => hinweise.push(h));

    // 4) Ausgabestand
    const altB = an.build, neuB = opt.build;
    const cacheNeu = an.cache.slice(0, an.cache.length - altB.length) + neuB;
    let sw = an.roh.sw
        .replace(/(const BUILD\s*=\s*')[^']+(')/, '$1' + neuB + '$2')
        .replace(/(const CACHE_NAME\s*=\s*')[^']+(')/, '$1' + cacheNeu + '$2');
    // Merker für die Python-Erzeuger in tools/: ab jetzt ist das Paket der maßgebliche Stand
    const merker = '// PFLEGE-TOOL: Ausgabestand ' + neuB + ' am ' + opt.datum + ' mit dem Pflege-Tool gepflegt – tools/erzeuge.py, tools/gbo_gh_katalog.py und tools/gbo_uebernahme.py nicht mehr ausführen.';
    sw = /^\/\/ PFLEGE-TOOL:[^\n]*$/m.test(sw) ? sw.replace(/^\/\/ PFLEGE-TOOL:[^\n]*$/m, merker) : sw.replace(/^(const BUILD\s*=)/m, merker + '\n$1');
    setze(R + 'sw.js', sw);
    const htmlDateien = pk.paths.filter(p => p.startsWith(R) && /\.html?$/i.test(p) && !p.slice(R.length).includes('/'));
    const vRe = new RegExp('\\?v=' + escRe(altB) + '(?![\\w.-])', 'g');
    for (const p of htmlDateien) {
        let h = await lies(p);
        const vorher = h;
        h = h.replace(vRe, '?v=' + neuB);
        const fremd = [...h.matchAll(/\?v=([0-9][\w.-]*)/g)].map(x => x[1]).filter(v => v !== neuB);
        if (fremd.length) hinweise.push(p.slice(R.length) + ': Einbindungen mit abweichendem ?v= (' + [...new Set(fremd)].join(', ') + ') – bitte prüfen.');
        if (h !== vorher) setze(p, h);
    }
    for (const p of pk.paths.filter(p => /\.txt$/i.test(p) && !p.startsWith(R))) {
        const s = await lies(p);
        let n = s.split('Ausgabestand ' + altB).join('Ausgabestand ' + neuB)
                 .replace(new RegExp('^(Großhandel Begehung )' + escRe(altB) + '(\\s)', 'm'), '$1' + neuB + '$2');
        if (/INSTALLATION\.txt$/i.test(p)) n = n.replace(/^(.*Ausgabestand [^)]*\)\s*·\s*Stand\s*)\d\d\.\d\d\.\d{4}/m, '$1' + opt.datum);
        if (n !== s) setze(p, n);
    }

    // 5) Zahlen, Katalog-, Quellen-, GBO- und Dateitabellen in Dokumentation und Hilfe
    let gz = null;
    if (opt.zaehle) {
        const texte = {};
        for (const f of ['gbo-data.js', 'gbo-gh-daten.js', 'gbo-gh-vor.js', 'gbo-quellen.js', 'gbo-struktur.js', 'gbo-gh-nach.js']) {
            const p = R + 'js/' + f;
            if (pk.paths.includes(p) || out.has(p)) texte[f] = await lies(p);
        }
        try { gz = await opt.zaehle(texte); }
        catch (e) { hinweise.push('Die Gefährdungsbeurteilung ließ sich zum Zählen nicht aufbauen (' + (e.message || e) + '). Die GBO-Zahlen in der Dokumentation bitte prüfen.'); }
        if (gz && gz.doppelt) hinweise.push('Die Gefährdungsbeurteilung enthält ' + gz.doppelt + ' doppelte Fragen-IDs.');
    }
    let dCfg = null;
    try { dCfg = an.roh.dateien ? JSON.parse(an.roh.dateien) : null; } catch (e) { hinweise.push('tools/doku-dateien.json ist kein gültiges JSON – Dateiübersicht nicht aktualisiert.'); }
    const zeilenVon = async rel => { const p = R + rel; if (!pk.paths.includes(p) && !out.has(p)) return 0; return zeilen(await lies(p)); };
    const groesse = async rel => { const p = R + rel; if (!pk.paths.includes(p)) return 0; return (await pk.bytes(p)).length; };
    const ghIds = new Set(G.ghModulIds(neu.gbo));
    const ids = []; neu.kats.forEach(k => k.items.forEach(i => ids.push(i.id)));
    const w = {
        kategorien: String(neu.kats.length), bereiche: String(bereicheVon(neu.kats).length), fragen: String(ids.length),
        pruefpunkte_frist: String(ids.length && neu.kats.reduce((s, k) => s + k.items.filter(i => i.pruef != null).length, 0)),
        ausstattung: String(neu.ausstattung.length),
        build: neuB, cache: cacheNeu, cache_version: 'v' + neuB, stand: opt.datum, zeilen_stand: opt.datum
    };
    if (an.revision) w.revision = an.revision;
    if (an.revisionDatum) { const d = an.revisionDatum.split('-'); w.revision_datum = d[2] + '.' + d[1] + '.' + d[0]; }
    if (gz) Object.assign(w, {
        gbo_faktoren: String(gz.kern_faktoren), gbo_kernfragen: String(gz.kern_fragen), gbo_module: String(gz.vertiefung_module),
        gbo_vertiefungsfragen: String(gz.vertiefung_fragen), gbo_fragen: String(gz.fragen), gbo_themen: String(gz.themen),
        gbo_bereiche: String(gz.bereiche), gbo_maschinen: String(gz.maschinen), gbo_gh_module: String(gz.gh_module), gbo_gh_fragen: String(gz.gh_fragen)
    });
    const swTxt = out.get(R + 'sw.js');
    w.sw_dateien = String((swTxt.match(/^\s+'\.\/[^']*',?\s*$/gm) || []).length);
    const bloecke = { KATALOG: tabKatalog(neu.kats), QUELLEN: tabQuellen(neu.quellen), GBOMODULE: gz ? tabGbo(gz, ghIds) : null };
    for (let runde = 0; runde < 6; runde++) {
        if (dCfg) {
            let summe = 0;
            const z = [];
            for (const e of dCfg.dateien) {
                const art = e.art || '';
                let sp;
                if (art === 'binaer') sp = ((await groesse(e.datei)) / 1024).toFixed(1).replace('.', ',') + ' KB';
                else if (art === 'bibliothek') sp = deZahl(await zeilenVon(e.datei)) + ' (minifiziert)';
                else { const n = await zeilenVon(e.datei); summe += n; sp = deZahl(n); }
                let zweck = e.zweck;
                Object.keys(w).forEach(k => { zweck = zweck.split('{' + k + '}').join(w[k]); });
                z.push(`                <tr>\n                    <td>${htmlEsc(e.datei)}</td>\n                    <td class="zahl">${htmlEsc(sp)}</td>\n                    <td>${htmlEsc(zweck)}</td>\n                </tr>\n`);
            }
            w.zeilen_gesamt = deZahl(summe);
            bloecke.DATEITABELLE = z.join('');
        }
        let geaendert = false;
        for (const ziel of ZIELE) {
            const p = R + ziel;
            if (!pk.paths.includes(p)) continue;
            const vorher = await lies(p);
            let h = vorher.replace(/(<span data-zahl="([a-z_]+)">)([\s\S]*?)(<\/span>)/g, (x, a, k, mitte, e) => w[k] != null ? a + w[k] + e : x);
            Object.keys(bloecke).forEach(n => { h = ersetzeBlock(h, n, bloecke[n]); });
            if (h !== vorher) { setze(p, h); geaendert = true; }
        }
        if (!geaendert) break;
    }

    // 6) Zeilenenden wie im Original
    for (const [p, s] of out) {
        if (!pk.paths.includes(p)) continue;
        const orig = await pk.text(p);
        if (orig.includes('\r\n')) out.set(p, s.replace(/\r?\n/g, '\r\n'));
        if (out.get(p) === orig) out.delete(p);
    }
    return { dateien: out, hinweise, werte: w };
}

// ---------- Prüfungen ----------
function pruefe(alt, neu, extra) {
    const F = [], H = [];
    const altIds = new Set(); const altMax = {};
    alt.kats.forEach(k => k.items.forEach(i => { altIds.add(i.id); const [a, b] = i.id.split('.').map(Number); altMax[a] = Math.max(altMax[a] || 0, b); }));
    const still = new Set(alt.still);
    const namen = {}, kids = {}, ids = {}, nrn = {};
    if (!neu.kats.length) F.push('Der Katalog enthält keine Kategorie.');
    neu.kats.forEach(k => {
        const wo = 'Kategorie ' + (k.nr != null ? k.nr : '?') + ' „' + (k.name || '–') + '“';
        if (!k.name.trim()) F.push(wo + ': Name fehlt.');
        if (k.name.trim() === 'default') F.push(wo + ': Der Name „default“ ist reserviert.');
        if (namen[k.name]) F.push(wo + ': Der Name kommt doppelt vor (Maßnahmentexte würden sich überschreiben).');
        namen[k.name] = 1;
        if (!KAT_ID_RE.test(k.id)) F.push(wo + ': Kategorie-ID „' + k.id + '“ ungültig (nur Kleinbuchstaben, Ziffern und Bindestrich).');
        if (kids[k.id]) F.push(wo + ': Kategorie-ID „' + k.id + '“ doppelt.');
        kids[k.id] = 1;
        if (nrn[k.nr]) F.push(wo + ': Kategorienummer ' + k.nr + ' doppelt.');
        nrn[k.nr] = 1;
        if (!k.bereich.trim()) F.push(wo + ': Bereich fehlt.');
        if (!k.naLabel.trim()) F.push(wo + ': Text für den Schalter „nicht zutreffend“ fehlt.');
        if (!k.items.length) F.push(wo + ': enthält keine Frage.');
        const mitGruppe = k.items.filter(i => i.group).length;
        if (mitGruppe && mitGruppe < k.items.length) H.push(wo + ': ' + (k.items.length - mitGruppe) + ' Frage(n) ohne Unterbereich – sie erscheinen unter „Weitere Prüfpunkte“.');
        if (k.instanzen) {
            const fremd = k.items.filter(i => !k.instanzen.includes(i.group || ''));
            if (fremd.length) F.push(wo + ': Diese Kategorie gibt es je ' + k.instanzen[0].replace(/ \S+$/, '') + '. Jede Frage braucht als Unterbereich eine der Instanzen (' + k.instanzen.join(', ') + ') – betroffen: ' + fremd.map(i => i.id).join(', ') + '.');
            const proInst = k.instanzen.map(n => k.items.filter(i => i.group === n).length);
            if (new Set(proInst).size > 1) H.push(wo + ': Die Instanzen haben unterschiedlich viele Fragen (' + k.instanzen.map((n, x) => n + ': ' + proInst[x]).join(', ') + ').');
        }
        k.items.forEach(i => {
            const fw = 'Frage ' + (i.id || '?') + ' (' + k.name + ')';
            if (!ID_RE.test(i.id)) F.push(fw + ': Frage-ID ungültig (Form „Kategorienummer.laufende Nummer“, z. B. 1.15).');
            else {
                if (ids[i.id]) F.push(fw + ': Frage-ID kommt doppelt vor.');
                ids[i.id] = 1;
                if (i.neu) {
                    const [a, b] = i.id.split('.').map(Number);
                    if (k.nr != null && a !== k.nr) F.push(fw + ': Die ID muss mit der Kategorienummer ' + k.nr + ' beginnen.');
                    if (altIds.has(i.id) || still.has(i.id)) F.push(fw + ': Diese ID war bereits vergeben. Neue Fragen brauchen eine noch nie verwendete ID.');
                    else if (altMax[a] && b <= altMax[a]) F.push(fw + ': Lücken nicht auffüllen – die ID muss größer sein als ' + a + '.' + altMax[a] + ' (früher vergebene IDs könnten in alten Begehungen stehen).');
                }
            }
            if (i.pruef != null && !(Number.isInteger(i.pruef) && i.pruef >= 0 && i.pruef <= 120)) F.push(fw + ': Prüffrist muss eine ganze Zahl von 0 bis 120 Monaten sein (0 = nur Datum).');
            if (i.frei) return;   // freier Prüfpunkt: kein Fragetext, kein Maßnahmentext
            if (!i.text.trim()) F.push(fw + ': Fragetext fehlt.');
            STILE.forEach(s => { if (!i.m[s].trim()) F.push(fw + ': Maßnahmentext „' + STIL_NAME[s] + '“ fehlt.'); });
        });
    });
    STILE.forEach(s => { if (!neu.standard[s].trim()) F.push('Standardtext „' + STIL_NAME[s] + '“ fehlt.'); });
    ['bghw', 'rechtsquellen'].forEach(l => neu.quellen[l].forEach((q, n) => { if (!q.trim()) F.push('Quellenverzeichnis (PDF), ' + (l === 'bghw' ? 'Regelwerke' : 'Rechtsquellen') + ' Eintrag ' + (n + 1) + ': leer.'); }));

    // Ausstattung
    const keys = {};
    const modIds = new Set(extra && extra.gbo ? G.alleModulIds(extra.gbo, neu.gbo) : []);
    neu.ausstattung.forEach((e, n) => {
        const wo = 'Ausstattung „' + (e.label || e.key || (n + 1)) + '“';
        if (!/^[a-z0-9][a-z0-9-]*$/.test(e.key)) F.push(wo + ': Schlüssel ungültig (Kleinbuchstaben, Ziffern, Bindestrich).');
        if (keys[e.key]) F.push(wo + ': Schlüssel doppelt.');
        keys[e.key] = 1;
        if (!e.label.trim()) F.push(wo + ': Bezeichnung fehlt.');
        if (!e.kategorien.length) F.push(wo + ': keine Kategorie zugeordnet.');
        e.kategorien.forEach(id => { if (!kids[id]) F.push(wo + ': Kategorie „' + id + '“ gibt es nicht.'); });
        e.module.forEach(id => { if (!modIds.has(id)) F.push(wo + ': GBO-Modul „' + id + '“ gibt es nicht.'); });
    });
    neu.kats.forEach(k => { if (!neu.ausstattung.some(e => e.kategorien.includes(k.id)) && !alt.kats.some(a => a.id === k.id)) H.push('Neue Kategorie „' + k.name + '“ ist keiner Ausstattung zugeordnet – sie erscheint immer (Schalter „nicht zutreffend“ bleibt von Hand möglich).'); });

    // Hinweise
    const neuIds = new Set(); neu.kats.forEach(k => k.items.forEach(i => neuIds.add(i.id)));
    const weg = [...altIds].filter(id => !neuIds.has(id));
    if (weg.length) H.push('Entfernte Fragen: ' + sortiereIds(weg).join(', ') + '. Die IDs werden in js/audit-data.js als stillgelegt vermerkt; alte Begehungen zeigen sie als „nicht mehr im aktuellen Katalog“.');
    if (extra && extra.doppelt && extra.doppelt.length)
        H.push('js/text.js enthielt doppelte Einträge (' + extra.doppelt.map(d => d.id + ' ' + STIL_NAME[d.stil]).join(', ') + '). Beim Export wird nur der gültige Text geschrieben.');

    // Quellen-Abgleich
    const altQ = new Set([...alt.quellen.bghw, ...alt.quellen.rechtsquellen]);
    const neuQ = [...neu.quellen.bghw, ...neu.quellen.rechtsquellen];
    const texte = alleTexte(neu).map(norm).join('\n');
    [...altQ].filter(q => !neuQ.includes(q)).forEach(q => {
        const k = kurztitel(q);
        if (k.length >= 4 && !neuQ.some(n => kurztitel(n) === k)) {
            const n = texte.split(norm(k)).length - 1;
            if (n) H.push('Entfernte Quelle „' + k + '“ wird noch ' + n + '× in Fragen oder Maßnahmentexten genannt – „Suchen & Ersetzen“ nutzen.');
        }
    });
    if (extra && extra.gbo && neu.gbo) {
        const g = G.pruefe(extra.gbo, alt.gbo, neu.gbo);
        g.fehler.forEach(x => F.push(x)); g.hinweise.forEach(x => H.push(x));
    }
    return { fehler: F, hinweise: H };
}

function alleTexte(m) {
    const a = [];
    m.kats.forEach(k => k.items.forEach(i => { a.push(i.text); STILE.forEach(s => a.push(i.m[s])); }));
    STILE.forEach(s => a.push(m.standard[s]));
    return a;
}

// ---------- Änderungsliste ----------
function aenderungen(alt, neu) {
    const L = { katalog: [], texte: [], quellen: [], ausstattung: [] };
    const altK = {}; alt.kats.forEach(k => altK[k.id] = k);
    const altI = {}; alt.kats.forEach(k => k.items.forEach(i => altI[i.id] = { i, k }));
    const neuI = {}; neu.kats.forEach(k => k.items.forEach(i => neuI[i.id] = { i, k }));
    const neuK = {}; neu.kats.forEach(k => neuK[k.id] = k);
    const frist = p => p == null ? 'keine' : p === 0 ? 'nur Datum' : p + ' Monate';

    neu.kats.forEach(k => {
        const a = altK[k.id];
        if (!a) { L.katalog.push(`+ Neue Kategorie ${k.nr} „${k.name}“ (ID ${k.id}, Bereich „${k.bereich}“) mit ${k.items.length} Frage(n)`); return; }
        if (a.name !== k.name) L.katalog.push(`~ Kategorie umbenannt: „${a.name}“ → „${k.name}“`);
        if (a.bereich !== k.bereich) L.katalog.push(`~ ${k.name}: Bereich „${a.bereich}“ → „${k.bereich}“`);
        if (a.naLabel !== k.naLabel) L.katalog.push(`~ ${k.name}: Schalter „nicht zutreffend“ – „${a.naLabel}“ → „${k.naLabel}“`);
        const altOrd = a.items.map(i => i.id).filter(id => k.items.some(j => j.id === id));
        const neuOrd = k.items.map(i => i.id).filter(id => a.items.some(j => j.id === id));
        if (!gleich(altOrd, neuOrd)) L.katalog.push(`~ ${k.name}: Reihenfolge der Fragen geändert`);
    });
    alt.kats.forEach(k => { if (!neuK[k.id]) L.katalog.push(`- Kategorie entfernt: ${k.nr} „${k.name}“ (${k.items.length} Frage(n))`); });
    const altKo = alt.kats.map(k => k.id).filter(id => neuK[id]), neuKo = neu.kats.map(k => k.id).filter(id => altK[id]);
    if (!gleich(altKo, neuKo)) L.katalog.push('~ Reihenfolge der Kategorien geändert');

    neu.kats.forEach(k => k.items.forEach(i => {
        const a = altI[i.id];
        if (!a || i.neu) {
            L.katalog.push(`+ Neue Frage ${i.id} (${k.name}${i.group ? ' / ' + i.group : ''}${i.pruef != null ? ', Prüffrist ' + frist(i.pruef) : ''}): ${i.text}`);
            STILE.forEach(s => L.texte.push(`+ ${i.id} ${STIL_NAME[s]}: ${i.m[s]}`));
            return;
        }
        if (a.i.text !== i.text) L.katalog.push(`~ Fragetext ${i.id}:\n    alt: ${a.i.text}\n    neu: ${i.text}`);
        if ((a.i.group || '') !== (i.group || '')) L.katalog.push(`~ Unterbereich ${i.id}: „${a.i.group || '–'}“ → „${i.group || '–'}“`);
        if ((a.i.pruef == null ? null : a.i.pruef) !== (i.pruef == null ? null : i.pruef)) L.katalog.push(`~ Prüffrist ${i.id}: ${frist(a.i.pruef)} → ${frist(i.pruef)}`);
        STILE.forEach(s => { if (a.i.m[s] !== i.m[s]) L.texte.push(`~ ${i.id} ${STIL_NAME[s]}:\n    alt: ${a.i.m[s]}\n    neu: ${i.m[s]}`); });
    }));
    alt.kats.forEach(k => k.items.forEach(i => { if (!neuI[i.id]) L.katalog.push(`- Frage entfernt ${i.id} (${k.name}): ${i.text || '(freier Prüfpunkt)'} – ID stillgelegt`); }));
    STILE.forEach(s => { if (alt.standard[s] !== neu.standard[s]) L.texte.push(`~ Standardtext ${STIL_NAME[s]}:\n    alt: ${alt.standard[s]}\n    neu: ${neu.standard[s]}`); });

    [['bghw', 'Regelwerke'], ['rechtsquellen', 'Rechtsquellen']].forEach(([l, n]) => {
        const a = alt.quellen[l], b = neu.quellen[l];
        b.filter(x => !a.includes(x)).forEach(x => L.quellen.push(`+ ${n}: ${x}`));
        a.filter(x => !b.includes(x)).forEach(x => L.quellen.push(`- ${n}: ${x}`));
        const aa = a.filter(x => b.includes(x)), bb = b.filter(x => a.includes(x));
        if (!gleich(aa, bb)) L.quellen.push(`~ ${n}: Reihenfolge geändert`);
    });

    const altA = {}; alt.ausstattung.forEach(e => altA[e.key] = e);
    neu.ausstattung.forEach(e => {
        const a = altA[e.key];
        if (!a) { L.ausstattung.push(`+ ${e.key}: „${e.label}“ – Kategorien ${e.kategorien.join(', ') || '–'}; GBO-Module ${e.module.join(', ') || '–'}`); return; }
        if (a.label !== e.label) L.ausstattung.push(`~ ${e.key}: Bezeichnung „${a.label}“ → „${e.label}“`);
        if (!gleich(a.kategorien, e.kategorien)) L.ausstattung.push(`~ ${e.key}: Kategorien ${a.kategorien.join(', ') || '–'} → ${e.kategorien.join(', ') || '–'}`);
        if (!gleich(a.module, e.module)) L.ausstattung.push(`~ ${e.key}: GBO-Module ${a.module.join(', ') || '–'} → ${e.module.join(', ') || '–'}`);
    });
    alt.ausstattung.forEach(e => { if (!neu.ausstattung.some(x => x.key === e.key)) L.ausstattung.push(`- ${e.key}: „${e.label}“`); });
    const ao = alt.ausstattung.map(e => e.key).filter(k => neu.ausstattung.some(x => x.key === k)), no = neu.ausstattung.map(e => e.key).filter(k => altA[k]);
    if (!gleich(ao, no)) L.ausstattung.push('~ Reihenfolge der Ausstattung geändert');
    return L;
}

// Stellen, die von Hand geprüft werden sollten (Freitext in Hilfe, Anleitungen, Dokumentation)
function handStellen(alt, neu, seiten) {
    const out = [];
    const such = (wort, warum) => {
        if (!wort || wort.length < 4) return;
        for (const [datei, html] of Object.entries(seiten)) {
            html.split('\n').forEach((l, n) => {
                if (l.includes(wort) && !/data-zahl|<td>|doku-bereich/.test(l)) out.push(`${datei}, Zeile ${n + 1}: „${wort}“ (${warum})`);
            });
        }
    };
    const neuK = {}; neu.kats.forEach(k => neuK[k.id] = k);
    alt.kats.forEach(k => {
        const n = neuK[k.id];
        if (!n) such(k.name, 'Kategorie entfernt');
        else if (n.name !== k.name) such(k.name, 'Kategorie umbenannt in „' + n.name + '“');
    });
    alt.ausstattung.forEach(e => {
        const n = neu.ausstattung.find(x => x.key === e.key);
        if (!n) such(e.label, 'Ausstattung entfernt');
        else if (n.label !== e.label) such(e.label, 'Ausstattung umbenannt in „' + n.label + '“');
    });
    const neuQ = [...neu.quellen.bghw, ...neu.quellen.rechtsquellen];
    [...alt.quellen.bghw, ...alt.quellen.rechtsquellen].filter(q => !neuQ.includes(q)).forEach(q => {
        const k = kurztitel(q);
        if (k.length >= 6 && !neuQ.some(x => kurztitel(x) === k)) such(k, 'Quelle aus dem Verzeichnis entfernt');
    });
    return [...new Set(out)];
}

function naechsteId(kat, alt, neu) {
    let max = 0;
    const nr = kat.nr;
    const alle = [...alt.still];
    alt.kats.forEach(k => k.items.forEach(i => alle.push(i.id)));
    neu.kats.forEach(k => k.items.forEach(i => alle.push(i.id)));
    alle.forEach(id => { const [a, b] = id.split('.').map(Number); if (a === nr && b > max) max = b; });
    return nr + '.' + (max + 1);
}
function naechsteKatNr(alt, neu) {
    let max = 0;
    [...alt.kats, ...neu.kats].forEach(k => { if (k.nr > max) max = k.nr; });
    alt.still.forEach(id => { const a = parseInt(id, 10); if (a > max) max = a; });
    return max + 1;
}
function slug(s) {
    return String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function naechsterBuild(b) {
    const m = /^(.*-)(\d+)$/.exec(b);
    return m ? m[1] + (parseInt(m[2], 10) + 1) : b + '-2';
}
function pruefeBuild(alt, neu) {
    const ar = alt.replace(/-\d+$/, ''), an = /-(\d+)$/.test(alt) ? parseInt(/-(\d+)$/.exec(alt)[1], 10) : 1;
    const m = /^(\d+(?:\.\d+)+)-(\d+)$/.exec(neu);
    if (!m) return 'Ausgabestand im Format „' + ar + '-' + (an + 1) + '“ angeben.';
    if (m[1] !== ar) return 'Die Revision (' + ar + ') bleibt gleich – eine neue Revision bitte von Hand (Technische Dokumentation, Abschnitt „Pflege von Prüfkatalog, Texten und Quellen“).';
    if (parseInt(m[2], 10) <= an) return 'Der neue Ausgabestand muss größer sein als ' + alt + '.';
    return null;
}

function setzeGbo(g) { G = g; }

return {
    setzeGbo, reihenfolge, APP_KENNUNG,
    STILE, STIL_NAME, ID_RE, kopie, gleich, deDatum, zeilen, htmlEsc, htmlDec, normText, findeLiteral, parseLit, jsStr1, jsStr2,
    analysiere, fingerabdruck, genAudit, genTexteLit, genQuellenLit, baue, pruefe, bereicheVon,
    aenderungen, handStellen, naechsteId, naechsteKatNr, slug, naechsterBuild, pruefeBuild, kurztitel, sortiereIds, alleTexte,
    katalogSicht, texteSicht, ausstSicht
};
})();

if (typeof module !== 'undefined') module.exports = KERN;

<script>
// ===================================================================
// Großhandel Begehung – Pflege-Tool: Gefährdungsbeurteilung (GBO)
// Grundlage: GBO aus ASiC Handel 2.x plus Großhandel-Schicht
// (js/gbo-gh-daten.js, js/gbo-gh-vor.js, js/gbo-gh-nach.js).

// gezielt an die betroffenen Stellen zurück (Kommentare bleiben erhalten).
// ===================================================================
'use strict';

const KGBO = (() => {
const K = (typeof KERN !== 'undefined') ? KERN : require('./kern.js');

const DATEIEN = {
    data: 'js/gbo-data.js', quellen: 'js/gbo-quellen.js', struktur: 'js/gbo-struktur.js',
    migrate: 'js/gbo-migrate.js', v2: 'js/gbo-v2.js', gbo: 'js/gbo.js', seite: 'quellen.html',
    ghdaten: 'js/gbo-gh-daten.js', ghvor: 'js/gbo-gh-vor.js', ghnach: 'js/gbo-gh-nach.js'
};
const GH_FELDER = ['explain', 't', 'o', 'p'];   // die App übernimmt bei Großhandel-Themenfeldern nur diese Texte
const F11_ID_RE = /^GH-11-\d{2,}$/;
const MOD_ID_RE = /^[a-z][a-z0-9_]*$/;
const CAT_KEY_RE = /^[A-Z][A-Z0-9_]*$/;
// JSON wie Python json.dumps(indent=0, ensure_ascii=False)
const jsonFlach = v => JSON.stringify(v, null, 1).replace(/^ +/gm, '').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');

const FELD_NAME = { explain: 'Erläuterung', t: 'Technisch (T)', o: 'Organisatorisch (O)', p: 'Personenbezogen (P)', e: 'Wirksamkeit (E)' };
const GBO_ID_RE = /^[A-Z][A-Z0-9]*-\d{2,}$/;

const q1 = s => "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ')
    .replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029') + "'";

};
const rein = v => JSON.parse(JSON.stringify(v, (k, x) => x instanceof Set ? [...x] : x instanceof RegExp ? String(x) : x));

function patche(src, edits) {
    edits.sort((a, b) => b.a - a.a);

}
const zeilenStart = (s, i) => s.lastIndexOf('\n', i - 1) + 1;

// ---------------- Themenfeld wie js/gbo-quellen.js (catFor) ----------------
function catFor(R, mod, topic) {
    const t = String(topic || '');
    for (const e of R.MOD_TOPICS) { const [m, rx, c] = e; if (m === mod && rx.test(t)) return c; }
    const common = () => { for (const e of R.COMMON_TOPICS) { const [rx, c] = e.length === 3 ? [e[1], e[2]] : e; if ((e.length < 3 || e[0] === mod) && rx.test(t)) return c; } return null; };
    if (R.MACHINE.has(mod) && !R.SINGLE.has(mod)) for (const [rx, c] of R.MACHINE_TOPICS) if (rx.test(t)) return c;
    if (R.SINGLE.has(mod)) return R.MOD[mod] || 'AREA';
    if (R.AREA_MODS.has(mod)) {
        if (mod === 'kt' && /^organisation/i.test(t)) return 'UNTERW';
        const c = common(); if (c) return c;
        for (const [rx, c2] of R.AREA_TOPICS) if (rx.test(t)) return c2;
        return R.MOD[mod] || 'AREA';
    }
    if (R.MACHINE.has(mod)) return R.MOD[mod] || 'M_BEST';
    return common() || R.MOD[mod] || 'AREA';
}

// ---------------- Analyse ----------------
async function analysiere(pk, root) {
    const hat = r => pk.paths.includes(root + r);
    if (!hat(DATEIEN.data)) return null;
    for (const k of ['quellen', 'struktur', 'ghdaten', 'ghvor', 'ghnach']) if (!hat(DATEIEN[k])) throw new Error('In „' + pk.name + '“ fehlt ' + DATEIEN[k] + '.');
    const roh = {};
    for (const [k, f] of Object.entries(DATEIEN)) roh[k] = hat(f) ? await pk.text(root + f) : null;
    const L = (k, n, pflicht = true) => {
        if (roh[k] == null) { if (pflicht) throw new Error(DATEIEN[k] + ' fehlt.'); return null; }
        const l = K.findeLiteral(roh[k], n);
        if (!l && pflicht) throw new Error(n + ' in ' + DATEIEN[k] + ' nicht gefunden.');
        return l;
    };
    const hinweise = [];
    const D = L('data', 'window.GBO_DATA').value;

        SRC: L('quellen', 'SRC'), DEF: L('quellen', 'DEF'), CAT: L('quellen', 'CAT'),
        TEXT: L('struktur', 'TEXT'), NEU: L('struktur', 'NEU'), GRUND: L('struktur', 'GRUND'),
        EXTRA: L('struktur', 'CONFIG_EXTRA', false), PSY: L('gbo', 'PSY_CONFIG', false)
    };
    const R = {};
    for (const n of ['MOD', 'MACHINE', 'MACHINE_TOPICS', 'COMMON_TOPICS', 'AREA_MODS', 'AREA_TOPICS', 'MOD_TOPICS', 'SINGLE']) R[n] = L('quellen', n).value;
    for (const n of ['C2F', 'MOD_FAKTOR', 'FAKTOREN', 'INV_TOPICS', 'KERN_AREAS', 'MERGE', 'RENAME', 'ALIAS', 'TOPIC_PREFIX', 'GRUND_ADD', 'NEU_LINKS', 'LINKS']) R[n] = L('struktur', n).value;
    const mig = L('migrate', 'ALIAS', false);
    const qmap = L('v2', 'QUESTION_MAP', false);

    // Module
    // Großhandel-Schicht
    const zm = /window\.GBO_GH_DATEN\s*=\s*(\{[\s\S]*\})\s*;\s*$/.exec(roh.ghdaten);
    if (!zm) throw new Error('window.GBO_GH_DATEN in ' + DATEIEN.ghdaten + ' nicht gefunden.');
    let Z;
    try { Z = JSON.parse(zm[1]); } catch (e) { throw new Error(DATEIEN.ghdaten + ' ist kein reines Datenformat (JSON) mehr: ' + e.message); }
    const gh = {
        ENTFERNEN: L('ghvor', 'ENTFERNEN').value, FRAGEN_WEG: L('ghvor', 'FRAGEN_WEG').value,
        TEXTvor: L('ghvor', 'TEXT'), TITELvor: L('ghvor', 'TITEL').value,
        WEG: L('ghnach', 'WEG').value, F11: L('ghnach', 'F11'), TEXTnach: L('ghnach', 'TEXT'),
        TITELnach: L('ghnach', 'TITEL').value, C2F: L('ghnach', 'C2F').value
    };
    const ghWeg = new Set(gh.ENTFERNEN);
    const ausgeblendet = new Set([...gh.FRAGEN_WEG, ...Object.keys(gh.WEG)]);
    const ghTitel = Object.assign({}, gh.TITELvor, gh.TITELnach);

    const module = [];
    const art = { generalTopics: 'thema', areas: 'bereich', machines: 'maschine' };
    const zahlIdx = a => a.findIndex((x, i) => i > 1 && /^\d+ \S*[fF]ragen$/.test(x));
    for (const liste of ['generalTopics', 'areas', 'machines']) (D[liste] || []).forEach(a => {
        module.push({ id: a[0], name: (ghTitel[a[0]] || [])[0] || (R.RENAME[a[0]] || [])[0] || a[1], nameDatei: a[1], art: art[liste], zahlIndex: zahlIdx(a), weg: ghWeg.has(a[0]) });
    });
    const ghArt = { general: 'thema', areas: 'bereich', machines: 'maschine' };
    const ghMod = [];
    for (const liste of ['general', 'areas', 'machines']) (Z[liste] || []).forEach(a => {
        const zi = zahlIdx(a);
        const m = { id: a[0], name: a[1], nameDatei: a[1], art: ghArt[liste], zahlIndex: zi, gh: true };
        module.push(m);
        ghMod.push({ id: a[0], art: ghArt[liste], titel: a[1], beschr: liste === 'machines' ? null : String(a[2] || ''), zahlText: zi >= 0 ? a[zi] : '' });
    });
    // gepaarte Module (PAIR in gbo-struktur.js)
    const paar = {};
    if (/var PAIR\s*=\s*\{\s*leihpresse/.test(roh.struktur)) paar.leihpresse = 'dixi';
    if (/ofen_fleisch:\s*\['ofen_brot'/.test(roh.struktur)) paar.ofen_fleisch = 'ofen_brot';

    // Zusammengelegte Fragen (ALIAS + PAIR)
    const alias = Object.assign({}, R.ALIAS);
    (D.questions.leihpresse || []).forEach(q => { const n = +q[0].slice(3); if (paar.leihpresse && n >= 3) alias[q[0]] = 'DX-' + String(n - 2).padStart(2, '0'); });
    (D.questions.ofen_fleisch || []).forEach(q => { if (paar.ofen_fleisch) alias[q[0]] = 'OFENBROT-' + q[0].split('-')[1]; });

    const stillVon = t => { const o = []; const sm = /Stillgelegte GBO-Frage-IDs[^:\n]*:([^\n]*)/.exec(t); if (sm) sm[1].split(/[,\s]+/).filter(x => GBO_ID_RE.test(x) || F11_ID_RE.test(x)).forEach(x => o.push(x)); return o; };
    const still = stillVon(roh.data), ghStill = stillVon(roh.ghdaten);

    // Fragen
    const fragen = {};
    K.reihenfolge(D.questions).forEach(m => { fragen[m] = D.questions[m].map(q => ({ id: q[0], thema: q[1], text: q[2] })); });
    ghMod.forEach(gm => {
        fragen[gm.id] = (Z.questions[gm.id] || []).map(q => {
            const c = Z.config[q[0]] || ['', '', false, []];
            return { id: q[0], thema: q[1], text: q[2], cat: c[0] || '', law: c[1] || '', u: !!c[2], massn: (c[3] || []).slice() };
        });
    });
    const ghov = {};
    const ovAus = (lit2, datei) => K.reihenfolge(lit2.value).forEach(id => { ghov[id] = { thema: lit2.value[id][0], text: lit2.value[id][1], datei }; });
    ovAus(gh.TEXTvor, 'ghvor');
    const ghovNach = {};
    K.reihenfolge(gh.TEXTnach.value).forEach(id => { ghovNach[id] = { thema: gh.TEXTnach.value[id][0], text: gh.TEXTnach.value[id][1], datei: 'ghnach' }; });
    const f11 = gh.F11.value.map(n => ({ id: n[0], thema: n[1], text: n[2], law: n[3], u: !!n[4], massn: (n[5] || []).slice() }));
    const ov = {};
    K.reihenfolge(lit.TEXT.value).forEach(id => { ov[id] = { thema: lit.TEXT.value[id][0], text: lit.TEXT.value[id][1] }; });
    const neu = lit.NEU.value.map(n => ({ id: n[0], thema: n[1], text: n[2], faktor: n[3], gruppe: n[4], feld: n[5], u: !!n[6], law: n[7], massn: (n[8] || []).slice() }));
    const grund = {};
    K.reihenfolge(lit.GRUND.value).forEach(g => grund[g] = { thema: lit.GRUND.value[g][0], text: lit.GRUND.value[g][1] });
    const cfg = {};
    if (lit.PSY) K.reihenfolge(lit.PSY.value).forEach(id => { const c = lit.PSY.value[id]; cfg[id] = { law: c.law || '', u: !!c.u, massn: (c.measures || []).slice(), quelle: 'psy' }; });
    if (lit.EXTRA) K.reihenfolge(lit.EXTRA.value).forEach(id => { const c = lit.EXTRA.value[id]; cfg[id] = { law: c[0] || '', u: !!c[1], massn: (c[2] || []).slice(), quelle: 'extra' }; });

    // Quellen und Themenfelder
    const src = K.reihenfolge(lit.SRC.value).map(k => { const v = lit.SRC.value[k]; return { key: k, norm: v[0], gloss: v[1], ok: !!v[2] }; });
    Object.keys(Z.src || {}).forEach(k => {
        if (src.some(s => s.key === k)) { hinweise.push('GBO-Regelwerk „' + k + '“ steht in js/gbo-quellen.js und in js/gbo-gh-daten.js – es gilt der Eintrag aus js/gbo-quellen.js.'); return; }
        const v = Z.src[k]; src.push({ key: k, norm: v[0], gloss: v[1], ok: !!v[2], gh: true });
    });
    const def = {}; FELDER.forEach(f => def[f] = String(lit.DEF.value[f] || ''));
    const cat = K.reihenfolge(lit.CAT.value).map(k => {
        const v = lit.CAT.value[k];
        const e = { key: k, src: (v.src || []).slice() };
        FELDER.forEach(f => e[f] = v[f] != null ? String(v[f]) : '');
        return e;
    });
    Object.keys(Z.cat || {}).forEach(k => {
        const v = Z.cat[k];
        const e = { key: k, src: (v.src || []).slice(), gh: true, faktor: v.faktor != null ? v.faktor : 1 };
        FELDER.forEach(f => e[f] = v[f] != null ? String(v[f]) : '');
        const i = cat.findIndex(c => c.key === k);
        if (i >= 0) { hinweise.push('Themenfeld „' + k + '“ wird von js/gbo-gh-daten.js ersetzt – es wird dort gepflegt.'); cat[i].ersetzt = true; }
        cat.push(e);
    });

    // quellen.html
    let seite = null, seiteFehler = null;
    if (roh.seite) { const s = parseSeite(roh.seite); if (s.fehler) seiteFehler = s.fehler; else seite = s.gruppen; }

    // Referenzen (für das Löschen)
    const refs = {}, modRefs = {};
    const merkeRef = (id, wo) => { (refs[id] = refs[id] || new Set()).add(wo); };
    const merkeModRef = (id, wo) => { (modRefs[id] = modRefs[id] || new Set()).add(wo); };
    Object.keys(R.ALIAS).forEach(a => { merkeRef(a, 'gbo-struktur.js (ALIAS)'); merkeRef(R.ALIAS[a], 'gbo-struktur.js (ALIAS)'); });
    Object.keys(lit.TEXT.value).forEach(a => merkeRef(a, 'gbo-struktur.js (TEXT)'));
    Object.keys(R.TOPIC_PREFIX).forEach(a => merkeRef(a, 'gbo-struktur.js (TOPIC_PREFIX)'));
    Object.keys(R.NEU_LINKS).forEach(a => merkeRef(a, 'gbo-struktur.js (NEU_LINKS)'));
    Object.keys(cfg).forEach(a => merkeRef(a, cfg[a].quelle === 'psy' ? 'gbo.js (PSY_CONFIG)' : 'gbo-struktur.js (CONFIG_EXTRA)'));
    if (mig) Object.keys(mig.value).forEach(a => { merkeRef(a, 'gbo-migrate.js'); merkeRef(mig.value[a], 'gbo-migrate.js'); });
    const begehungMap = {};
    if (qmap) Object.keys(qmap.value).forEach(b => { const v = qmap.value[b]; if (v && v[1]) { merkeRef(v[1], 'gbo-v2.js (Begehung ' + b + ')'); begehungMap[b] = v; } });
    Object.values(alias).forEach(a => merkeRef(a, 'gbo-struktur.js (PAIR)'));
    const migIds = mig ? Object.keys(mig.value) : [];

    Object.keys(ghov).forEach(a => merkeRef(a, 'gbo-gh-vor.js (TEXT)'));
    Object.keys(ghovNach).forEach(a => merkeRef(a, 'gbo-gh-nach.js (TEXT)'));
    Object.keys(Z.ausstattung || {}).forEach(k => (Z.ausstattung[k] || []).forEach(m => merkeModRef(m, 'Ausstattung „' + k + '“')));

    const ghAusst = {}; Object.keys(Z.ausstattung || {}).forEach(k => ghAusst[k] = (Z.ausstattung[k] || []).slice());
    const modell = { fragen, ov, neu, grund, cfg, src, def, cat, seite, still, ghStill, ghov, ghovNach, f11, ghMod, ghAusst };
    return { roh, lit, R, D, Z, gh, module, paar, alias, refs, migIds, begehungMap, modell, hinweise, seiteFehler, ausgeblendet, modRefs };
}

function parseSeite(html) {
    const gruppen = [];
    const secRe = /<section class="q-gruppe" id="([^"]+)">([\s\S]*?)<\/section>/g;
    let m;
    while ((m = secRe.exec(html))) {
        const inh = m[2];
        const h = /<h2>([\s\S]*?)\s*<span class="q-anzahl">(\d+)<\/span><\/h2>/.exec(inh);
        const tb = /<tbody>([\s\S]*?)<\/tbody>/.exec(inh);
        if (!h || !tb) return { fehler: 'quellen.html: Abschnitt „' + m[1] + '“ hat einen unerwarteten Aufbau.' };
        const rows = [];
        const rr = /<tr>([\s\S]*?)<\/tr>/g;
        let z;
        while ((z = rr.exec(tb[1]))) {
            const t = /^<td class="q-kurz">(?:<a href="([^"]*)" target="_blank" rel="noopener">([\s\S]*?)<\/a>|([\s\S]*?))<\/td><td>([\s\S]*?)<\/td><td class="q-apps">([\s\S]*?)<\/td>$/.exec(z[1].trim());
            if (!t) return { fehler: 'quellen.html: Zeile im Abschnitt „' + m[1] + '“ hat einen unerwarteten Aufbau.' };
            const kurz = t[2] != null ? t[2] : t[3];
            const ti = /^([\s\S]*?)(?:<div class="q-hinweis">([\s\S]*?)<\/div>)?$/.exec(t[4]);
            if (/<[a-z]/i.test(kurz + ti[1] + (ti[2] || ''))) return { fehler: 'quellen.html: HTML-Auszeichnung in einer Zelle („' + m[1] + '“).' };
            rows.push({
                kurz: K.htmlDec(kurz), url: t[1] != null ? K.htmlDec(t[1]) : '', titel: K.htmlDec(ti[1]), hinweis: ti[2] != null ? K.htmlDec(ti[2]) : '',
                apps: [...t[5].matchAll(/<span class="q-app">([^<]*)<\/span>/g)].map(a => K.htmlDec(a[1]))
            });
        }
        gruppen.push({ id: m[1], titel: K.htmlDec(h[1].trim()), zeilen: rows });
    }
    if (!gruppen.length) return { fehler: 'quellen.html: keine Abschnitte gefunden.' };
    return { gruppen };
}

const istGhMod = (an, modId) => !Object.prototype.hasOwnProperty.call(an.D.questions, modId) && !/^#/.test(modId);
function info(an, m, modId, q) {

    if (istGhMod(an, modId)) {
        const c = m.cat.find(x => x.key === q.cat);
        const faktor = c && c.gh ? c.faktor : (an.gh.C2F[q.cat] != null ? an.gh.C2F[q.cat] : 1);

    const kernSet = new Set(an.D.generalTopics.map(a => a[0]).filter(id => R.INV_TOPICS.indexOf(id) < 0).concat(R.KERN_AREAS)
        .map(id => ((R.MERGE.find(p => p[0] === id) || [])[1] || id)));
    const faktor = R.MOD_FAKTOR[modId] != null ? R.MOD_FAKTOR[modId] : (R.C2F[feld] != null ? R.C2F[feld] : 1);
    return { feld, faktor, kern: kernSet.has(ziel), ziel, alias: an.alias[q.id] || null };

function alleIds(an, alt) {
    const alle = new Set([...alt.still, ...alt.ghStill, ...an.migIds, ...Object.keys(an.alias)]);
    Object.values(alt.fragen).forEach(l => l.forEach(q => alle.add(q.id)));

function naechsteId(an, alt, neu, modId) {
    const liste = neu.fragen[modId] || [];
    const vorhanden = liste.map(q => q.id).concat((alt.fragen[modId] || []).map(q => q.id));
    const praefix = (vorhanden.find(id => /-\d+$/.test(id)) || (modId.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) + '-01')).replace(/-\d+$/, '');
    const alle = alleIds(an, alt);
    Object.values(neu.fragen).forEach(l => l.forEach(q => alle.add(q.id)));
    let max = 0;
    alle.forEach(id => { if (id.startsWith(praefix + '-')) { const n = parseInt(id.slice(praefix.length + 1), 10); if (n > max) max = n; } });
    return praefix + '-' + String(max + 1).padStart(2, '0');
}
function naechsteF11(an, alt, neu) {
    const alle = alleIds(an, alt); neu.f11.forEach(n => alle.add(n.id));
    let max = 0;
    alle.forEach(id => { const m = /^GH-11-(\d+)$/.exec(id); if (m && +m[1] > max) max = +m[1]; });

function feldNutzung(an, m) {
    const z = {};
    Object.keys(m.fragen).forEach(mod => {
        const x = an.module.find(y => y.id === mod);
        if (x && x.weg) return;
        m.fragen[mod].forEach(q => {
            if (an.alias[q.id] || an.ausgeblendet.has(q.id)) return;
            const f = x && x.gh ? q.cat : catFor(an.R, mod, effektiv(m, q).thema);
            z[f] = (z[f] || 0) + 1;
        });
    });
    m.neu.forEach(x => { z[x.feld] = (z[x.feld] || 0) + 1; });

}
const ghModulIds = m => m.ghMod.map(x => x.id);
const alleModulIds = (an, m) => an.module.filter(x => !x.gh && !x.weg).map(x => x.id).concat(ghModulIds(m));
function neuesModul(an, alt, neu, art, titel) {
    let id = K.slug(titel).replace(/-/g, '_').replace(/^[^a-z]+/, '') || 'modul';
    id = id.slice(0, 24);
    const vergeben = new Set(an.module.map(x => x.id).concat(ghModulIds(neu), ghModulIds(alt)));
    let i = id, n = 1; while (vergeben.has(i)) i = id + '_' + (++n);
    const gm = { id: i, art, titel, beschr: art === 'maschine' ? null : '', zahlText: '0 ' + (art === 'maschine' ? 'Tiefenfragen' : 'Vertiefungsfragen'), neu: true };
    neu.ghMod.push(gm);
    neu.fragen[i] = [];
    an.module.push({ id: i, name: titel, nameDatei: titel, art, zahlIndex: art === 'maschine' ? 2 : 3, gh: true, neu: true });
    return i;
}

const basisFragen = (an, m) => { const o = {}; Object.keys(m.fragen).forEach(k => { if (!istGhMod(an, k)) o[k] = m.fragen[k]; }); return o; };
const ghFragen = (an, m) => { const o = {}; Object.keys(m.fragen).forEach(k => { if (istGhMod(an, k)) o[k] = m.fragen[k]; }); return o; };
const ghTeil = (an, m) => ({ f: ghFragen(an, m), mod: m.ghMod.map(x => [x.id, x.art, x.titel, x.beschr]), src: m.src.filter(s => s.gh), cat: m.cat.filter(c => c.gh), still: m.ghStill });

function geaendert(an, alt, neu, teil) { return !K.gleich(sicht[teil](alt, an), sicht[teil](neu, an)); }
function irgendwas(an, alt, neu) { return Object.keys(sicht).some(t => geaendert(an, alt, neu, t)) || !K.gleich(alt.still, neu.still); }

function patcheTexte(src, T, alt, neu, hinweise, datei) {
    const ed = [];
    Object.keys(neu).forEach(id => {
        if (K.gleich(alt[id], neu[id])) return;

// ---------------- Prüfungen ----------------
function pruefe(an, alt, neu) {
    const F = [], H = [];

    const catKeys = new Set(neu.cat.map(c => c.key));
    Object.keys(neu.fragen).forEach(m => {

        neu.fragen[m].forEach(q => {
            const wo = 'GBO-Frage ' + q.id + ' (' + mod.name + ')';
            if (!GBO_ID_RE.test(q.id)) F.push(wo + ': ID ungültig (Form „KÜRZEL-01“).');
            if (gesehen[q.id]) F.push(wo + ': ID kommt doppelt vor.');
            gesehen[q.id] = 1;
            if (q.neu && alleAlt.has(q.id)) F.push(wo + ': Diese ID war bereits vergeben.');
            const eff = effektiv(neu, q);
            if (!String(eff.thema).trim()) F.push(wo + ': Thema fehlt.');
            if (!String(eff.text).trim()) F.push(wo + ': Fragetext fehlt.');
            if (mod.gh) {
                if (!catKeys.has(q.cat)) F.push(wo + ': Themenfeld „' + (q.cat || '–') + '“ gibt es nicht.');
                if (!q.massn.length) H.push(wo + ': keine Maßnahmen hinterlegt – es erscheinen nur die Hinweise des Themenfelds.');
                if (q.massn.some(x => !String(x).trim())) F.push(wo + ': leere Maßnahme.');
                if (!String(q.law).trim()) H.push(wo + ': kein Rechtsbezug angegeben.');
            }
        });
    });
    neu.f11.forEach(n => {
        const wo = 'Faktor-11-Frage ' + n.id;
        if (!F11_ID_RE.test(n.id)) F.push(wo + ': ID ungültig (Form „GH-11-01“).');
        if (gesehen[n.id]) F.push(wo + ': ID kommt doppelt vor.');
        gesehen[n.id] = 1;
        if (n.neu && alleAlt.has(n.id)) F.push(wo + ': Diese ID war bereits vergeben.');
        if (!n.thema.trim() || !n.text.trim()) F.push(wo + ': Thema oder Fragetext fehlt.');
        if (n.massn.some(x => !x.trim())) F.push(wo + ': leere Maßnahme.');
    });
    neu.neu.forEach(n => {
        const wo = 'Kernfrage ' + n.id;
        if (!n.thema.trim() || !n.text.trim()) F.push(wo + ': Thema oder Fragetext fehlt.');
        if (!catKeys.has(n.feld)) F.push(wo + ': Themenfeld „' + n.feld + '“ gibt es nicht.');
        if (!(n.faktor >= 0 && n.faktor <= 11)) F.push(wo + ': Faktor muss zwischen 0 und 11 liegen.');
    });
    Object.keys(neu.grund).forEach(g => { if (!neu.grund[g].thema.trim() || !neu.grund[g].text.trim()) F.push('Maschinen-Grundfrage ' + g + ': Thema oder Fragetext fehlt.'); });

    // Großhandel-Module
    const modIds = {};
    an.module.filter(x => !x.gh).forEach(x => modIds[x.id] = 1);
    neu.ghMod.forEach(gm => {
        const wo = 'Großhandel-Modul „' + (gm.titel || gm.id) + '“';
        if (!MOD_ID_RE.test(gm.id)) F.push(wo + ': Modul-ID „' + gm.id + '“ ungültig.');
        if (modIds[gm.id]) F.push(wo + ': Modul-ID „' + gm.id + '“ doppelt.');
        modIds[gm.id] = 1;
        if (!gm.titel.trim()) F.push(wo + ': Titel fehlt.');
        if (!(neu.fragen[gm.id] || []).length) H.push(wo + ': enthält keine Frage.');
    });
    alt.ghMod.filter(a => !neu.ghMod.some(x => x.id === a.id)).forEach(a => {
        const r = an.modRefs[a.id];
        H.push('Großhandel-Modul „' + a.titel + '“ entfernt.' + (r && r.size ? ' Es war zugeordnet in: ' + [...r].join(', ') + ' – Zuordnung im Reiter „Ausstattung“ prüfen.' : ''));
    });
    const keys = {};
    neu.src.forEach(s => {
        const wo = 'GBO-Regelwerk „' + s.key + '“';
        if (!/^[a-z][a-zA-Z0-9_]*$/.test(s.key)) F.push(wo + ': Schlüssel ungültig (Kleinbuchstaben, Ziffern, Unterstrich).');
        if (keys[s.key]) F.push(wo + ': Schlüssel doppelt.');
        keys[s.key] = 1;
        if (!s.norm.trim()) F.push(wo + ': Fundstelle fehlt.');
    });
    const ck = {};
    neu.cat.forEach(c => {
        if (c.gh) {
            if (!CAT_KEY_RE.test(c.key)) F.push('Themenfeld „' + c.key + '“: Schlüssel ungültig (Großbuchstaben, Ziffern, Unterstrich).');
            if (ck[c.key] && !neu.cat.some(x => x.key === c.key && x.ersetzt)) F.push('Themenfeld „' + c.key + '“: Schlüssel doppelt.');
            if (!(Number.isInteger(c.faktor) && c.faktor >= 0 && c.faktor <= 11)) F.push('Themenfeld ' + c.key + ': Faktor muss zwischen 0 und 11 liegen.');
        }
        ck[c.key] = 1;
        c.src.forEach(k => { if (!keys[k]) F.push('Themenfeld ' + c.key + ': Regelwerk „' + k + '“ gibt es nicht.'); });
        if (!c.src.length) H.push('Themenfeld ' + c.key + ' nennt kein Regelwerk.');
        if (!c.explain.trim()) F.push('Themenfeld ' + c.key + ': Erläuterung fehlt.');
    });
    FELDER.forEach(f => { if (!neu.def[f].trim()) F.push('Standard-Hinweis „' + FELD_NAME[f] + '“ fehlt.'); });
    const nutz = quellenNutzung(neu);
    neu.src.filter(s => !alt.src.some(x => x.key === s.key) && !nutz[s.key]).forEach(s => H.push('Neues GBO-Regelwerk „' + (s.norm || s.key) + '“ ist noch keinem Themenfeld zugeordnet (Reiter „GBO-Hinweise“).'));
    if (neu.seite) neu.seite.forEach(g => g.zeilen.forEach((r, i) => {
        if (!r.kurz.trim()) F.push('Quellenübersicht „' + g.titel + '“, Zeile ' + (i + 1) + ': Kurzbezeichnung fehlt.');
        if (r.url && !/^https:\/\//.test(r.url)) F.push('Quellenübersicht „' + r.kurz + '“: Link muss mit https:// beginnen.');
    }));
    // Hinweise
    const weg = [];
    Object.keys(alt.fragen).forEach(m => alt.fragen[m].forEach(q => { if (!(neu.fragen[m] || []).some(x => x.id === q.id)) weg.push(q.id); }));
    alt.f11.forEach(n => { if (!neu.f11.some(x => x.id === n.id)) weg.push(n.id); });
    if (weg.length) H.push('Entfernte GBO-Fragen: ' + weg.join(', ') + '. Die IDs werden als stillgelegt vermerkt (js/gbo-data.js bzw. js/gbo-gh-daten.js).');
    Object.keys(neu.fragen).forEach(m => {
        if (istGhMod(an, m)) return;
        neu.fragen[m].forEach(q => {
            const a = (alt.fragen[m] || []).find(x => x.id === q.id);
            const tA = a ? effektiv(alt, a).thema : null, tN = effektiv(neu, q).thema;
            if (a && tA !== tN) {
                const fa = catFor(an.R, m, tA), fn = catFor(an.R, m, tN);
                if (fa !== fn) H.push('GBO-Frage ' + q.id + ': Durch das neue Thema wechselt das Themenfeld von ' + fa + ' zu ' + fn + ' (andere Regelwerke und Hinweise).');
            }
        });
    });
    return { fehler: F, hinweise: H, weg };
}

// ---------------- Änderungsliste ----------------
function massnDiff(wo, a, b, L) {
    b.filter(x => !a.includes(x)).forEach(x => L.push(`+ Maßnahme ${wo}: ${x}`));
    a.filter(x => !b.includes(x)).forEach(x => L.push(`- Maßnahme ${wo}: ${x}`));
    const aa = a.filter(x => b.includes(x)), bb = b.filter(x => a.includes(x));
    if (!K.gleich(aa, bb)) L.push(`~ Maßnahmen ${wo}: Reihenfolge geändert`);
}

    neu.ghMod.forEach(gm => {

        if (!a) { L.module.push(`+ Neues Großhandel-Modul „${gm.titel}“ (${gm.id}, ${{ thema: 'Einrichtung', bereich: 'Bereich', maschine: 'Maschine' }[gm.art]})`); return; }
        if (a.titel !== gm.titel) L.module.push(`~ Modul ${gm.id}: Titel „${a.titel}“ → „${gm.titel}“`);

    });
    alt.ghMod.forEach(a => { if (!neu.ghMod.some(x => x.id === a.id)) L.module.push(`- Großhandel-Modul entfernt: „${a.titel}“ (${a.id})`); });

                if (gh) { L.hinweise.push(`+ Rechtsbezug ${q.id}: ${q.law}${q.u ? ' (Kennzeichen U)' : ''}`); q.massn.forEach(x => L.hinweise.push(`+ Maßnahme ${q.id}: ${x}`)); }
                return;
            }
            if (o.thema !== q.thema) L.fragen.push(`~ Thema ${q.id}: „${o.thema}“ → „${q.thema}“`);
            if (o.text !== q.text) L.fragen.push(`~ Fragetext ${q.id}:\n    alt: ${o.text}\n    neu: ${q.text}`);
            if (gh) {

                if (o.law !== q.law) L.hinweise.push(`~ Rechtsbezug ${q.id}: ${o.law} → ${q.law}`);
                if (o.u !== q.u) L.hinweise.push(`~ Kennzeichen U ${q.id}: ${o.u ? 'ja' : 'nein'} → ${q.u ? 'ja' : 'nein'}`);
                if (!K.gleich(o.massn, q.massn)) massnDiff(q.id, o.massn, q.massn, L.hinweise);
            }
        });
        a.forEach(o => { if (!neu.fragen[m] || !neu.fragen[m].some(x => x.id === o.id)) L.fragen.push(`- Frage entfernt ${o.id} (${modName(m)}): ${o.text} – ID stillgelegt`); });
        if (neu.fragen[m]) {
            const ao = a.map(x => x.id).filter(id => neu.fragen[m].some(y => y.id === id)), no = neu.fragen[m].map(x => x.id).filter(id => a.some(y => y.id === id));
            if (!K.gleich(ao, no)) L.fragen.push(`~ ${modName(m)}: Reihenfolge der Fragen geändert`);

    const drop = $('#drop');

// ---------------- Suchen & Ersetzen ----------------
function felder() {
    const F = [], c = S.cur, b = S.suche.ber;
    c.kats.forEach((k, ki) => k.items.forEach((it, ii) => {
        if (it.frei) return;   // freie Pruefpunkte haben keine Texte
        if (b.fragen) F.push({ wo: `${it.id} · Prüffrage`, ki, ii, get: () => it.text, set: v => it.text = v });
        if (b.texte) K.STILE.forEach(s => F.push({ wo: `${it.id} · Maßnahme ${K.STIL_NAME[s]}`, ki, ii, get: () => it.m[s], set: v => it.m[s] = v }));
    }));
    if (b.texte) K.STILE.forEach(s => F.push({ wo: `Standardtext ${K.STIL_NAME[s]}`, std: true, get: () => c.standard[s], set: v => c.standard[s] = v }));
    if (b.quellen) ['bghw', 'rechtsquellen'].forEach(l => c.quellen[l].forEach((q, i) => F.push({ wo: `Quellen (PDF) · ${l === 'bghw' ? 'Regelwerke' : 'Rechtsquellen'} ${i + 1}`, tab: 'quellen', get: () => c.quellen[l][i], set: v => c.quellen[l][i] = v })));
    if (b.gbo && c.gbo) KGBO.felder(c.gbo, S.an.gbo).forEach(f => F.push(f));
    return F;
}
function sucheRe(global) {
    const q = S.suche.q;
    if (!q) return null;
    return new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), (global ? 'g' : '') + (S.suche.gross ? '' : 'i'));
}
function renderSuche() {
    const s = S.suche;
    main.innerHTML = `<div class="card"><h2>Suchen &amp; Ersetzen</h2>
      <p class="muted">Durchsucht Fragen, alle Maßnahmentexte und die Quellen – z. B. um ein zurückgezogenes Regelwerk überall zu ersetzen.</p>

        <div><label class="f">Ersetzen durch (optional)</label><input type="text" id="s-r" value="${esc(s.r)}"></div>

        ${[['fragen', 'Prüffragen'], ['texte', 'Maßnahmentexte'], ['quellen', 'Quellen (PDF)'], ['gbo', 'Gefährdungsbeurteilung']].map(([k, t]) => `<label class="zeile" style="gap:5px"><input type="checkbox" data-s="${k}" ${s.ber[k] ? 'checked' : ''}>${t}</label>`).join('')}

    </div><div class="card" id="s-erg"></div>`;
    sucheZeigen();
}
function sucheLesen() {
    S.suche.q = $('#s-q').value; S.suche.r = $('#s-r').value; S.suche.gross = $('#s-gross').checked;
    document.querySelectorAll('[data-s]').forEach(c => S.suche.ber[c.dataset.s] = c.checked);
}
function sucheZeigen() {
    const box = $('#s-erg');
    const re = sucheRe(true);
    if (!re) { box.innerHTML = '<p class="muted">Suchbegriff eingeben.</p>'; return; }
    const t = felder().filter(f => { re.lastIndex = 0; return re.test(f.get()); });
    S.sucheTreffer = t;
    const zeig = t.slice(0, 400).map((f, i) => {
        const v = f.get();
        re.lastIndex = 0;
        const m = re.exec(v);
        const a = Math.max(0, m.index - 70), e = Math.min(v.length, m.index + m[0].length + 90);
        const aus = (a ? '… ' : '') + esc(v.slice(a, e)).replace(new RegExp(esc(S.suche.q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), S.suche.gross ? 'g' : 'gi'), x => '<mark>' + x + '</mark>') + (e < v.length ? ' …' : '');
        return `<div class="treffer" data-act="s-geh" data-i="${i}"><div class="wo">${esc(f.wo)}</div>${aus}</div>`;
    }).join('');
    box.innerHTML = `<h3 style="margin-top:0">${t.length} Fundstelle${t.length === 1 ? '' : 'n'}</h3>${zeig || '<p class="muted">Nichts gefunden.</p>'}${t.length > 400 ? '<p class="muted">… nur die ersten 400 angezeigt.</p>' : ''}`;
}
