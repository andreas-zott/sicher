    else if (t[0] === 'k') c.cat[+t[1]][t[2]] = wert;
    else if (t[0] === 'd') c.def[t[1]] = wert;
    else if (t[0] === 's') { const s = c.src[+t[1]]; s[t[2]] = wert; }
    else if (t[0] === 'p') { const r = c.seite[+t[1]].zeilen[+t[2]]; r[t[3]] = t[3] === 'apps' ? String(wert).split(',').map(x => x.trim()).filter(Boolean) : wert; }

        const a = gboAlt(pfad);
        if (a !== undefined) el.classList.toggle('geaendert', n(a, wert));
    }
    merkeEntwurf();
}

        <div style="display:grid;grid-template-columns:150px 1fr 1fr 1fr 150px 106px;gap:6px;font-size:12px;font-weight:700;color:var(--muted)"><span>Kurzbezeichnung</span><span>Titel</span><span>Hinweis</span><span>Link</span><span>Verwendet in</span><span></span></div>
        ${g.zeilen.map((r, zi) => `<div style="display:grid;grid-template-columns:150px 1fr 1fr 1fr 150px 106px;gap:6px;margin-top:5px">
          <input type="text" data-gb="p.${gi}.${zi}.kurz" value="${esc(r.kurz)}"><input type="text" data-gb="p.${gi}.${zi}.titel" value="${esc(r.titel)}">
          <input type="text" data-gb="p.${gi}.${zi}.hinweis" value="${esc(r.hinweis)}"><input type="text" data-gb="p.${gi}.${zi}.url" value="${esc(r.url)}">
          <input type="text" data-gb="p.${gi}.${zi}.apps" value="${esc(r.apps.join(', '))}">
          <span><button class="btn icon" data-act="gb-p-hoch" data-g="${gi}" data-i="${zi}">↑</button><button class="btn icon" data-act="gb-p-runter" data-g="${gi}" data-i="${zi}">↓</button><button class="btn icon gefahr" data-act="gb-p-weg" data-g="${gi}" data-i="${zi}">✕</button></span></div>`).join('')}
        <div style="margin-top:8px"><button class="btn klein" data-act="gb-p-neu" data-g="${gi}">+ Zeile</button></div></div>`).join('');
}

// ---- Klicks ----
function gboKlick(act, b, i) {
    const c = S.cur && S.cur.gbo;
    switch (act) {
        case 'gb-mod': S.gmod = b.dataset.m; renderGbo(); window.scrollTo(0, 0); return true;
        case 'gb-frage-neu': {
            const id = GB.naechsteId(S.an.gbo, S.alt.gbo, c, S.gmod);
            const l = c.fragen[S.gmod];
            l.push({ id, thema: l.length ? l[l.length - 1].thema : '', text: '', neu: true });
            merkeEntwurf(); renderGbo();
            const f = document.querySelector(`#gfrage-${l.length - 1} input`); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); f.select(); }
            return true;
        }
        case 'gb-hoch': if (tausch(c.fragen[S.gmod], i, i - 1)) { merkeEntwurf(); renderGbo(); } return true;
        case 'gb-runter': if (tausch(c.fragen[S.gmod], i, i + 1)) { merkeEntwurf(); renderGbo(); } return true;
        case 'gb-weg': {
            const q = c.fragen[S.gmod][i];
            if (!confirm(q.neu ? `Neue Frage ${q.id} wieder entfernen?` : `GBO-Frage ${q.id} entfernen?\n\n„${q.text}“\n\nDie ID wird stillgelegt und nie wieder vergeben. Vorhandene Bewertungen zu dieser Frage werden in der App nicht mehr angezeigt.`)) return true;
            c.fragen[S.gmod].splice(i, 1); merkeEntwurf(); renderGbo(); return true;
        }
        case 'gb-feld-zeigen': {
            const k = b.dataset.k; const idx = c.cat.findIndex(x => x.key === k);
            S.tab = 'gbofeld'; S.gfeld = idx; render(); window.scrollTo(0, 0); return true;
        }
        case 'gb-feld': S.gfeld = i; renderGboFeld(); window.scrollTo(0, 0); return true;
        case 'gb-fs-hoch': if (tausch(c.cat[S.gfeld].src, i, i - 1)) { merkeEntwurf(); renderGboFeld(); } return true;
        case 'gb-fs-runter': if (tausch(c.cat[S.gfeld].src, i, i + 1)) { merkeEntwurf(); renderGboFeld(); } return true;
        case 'gb-fs-weg': c.cat[S.gfeld].src.splice(i, 1); merkeEntwurf(); renderGboFeld(); return true;
        case 'gb-fs-neu': { const v = $('#gb-fs-neu').value; if (v) { c.cat[S.gfeld].src.push(v); merkeEntwurf(); renderGboFeld(); } return true; }
        case 'gb-src-neu': {
            let k = 'neu1', z = 1; while (c.src.some(s => s.key === k)) k = 'neu' + (++z);
            c.src.push({ key: k, norm: '', gloss: '', ok: false }); S.gsrcFilter = ''; merkeEntwurf(); renderGboSrc();
            const t = document.querySelectorAll('[data-gb$=".key"]'); if (t.length) { t[t.length - 1].scrollIntoView({ block: 'center' }); t[t.length - 1].focus(); t[t.length - 1].select(); }
            return true;
        }
        case 'gb-src-weg': if (confirm(`Regelwerk „${c.src[i].norm || c.src[i].key}“ entfernen?`)) { c.src.splice(i, 1); merkeEntwurf(); renderGboSrc(); } return true;
        case 'gb-p-neu': c.seite[+b.dataset.g].zeilen.push({ kurz: '', url: '', titel: '', hinweis: '', apps: [] }); merkeEntwurf(); renderQSeite(); return true;
        case 'gb-p-hoch': if (tausch(c.seite[+b.dataset.g].zeilen, i, i - 1)) { merkeEntwurf(); renderQSeite(); } return true;
        case 'gb-p-runter': if (tausch(c.seite[+b.dataset.g].zeilen, i, i + 1)) { merkeEntwurf(); renderQSeite(); } return true;
        case 'gb-p-weg': if (confirm('Zeile entfernen?')) { c.seite[+b.dataset.g].zeilen.splice(i, 1); merkeEntwurf(); renderQSeite(); } return true;
    }
    return false;
}
main.addEventListener('input', e => { const el = e.target; if (el.dataset.gb && el.type !== 'checkbox' && el.tagName !== 'SELECT') gboSetze(el.dataset.gb, el.value, el); });
main.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset.gb) return;
    if (el.type === 'checkbox') gboSetze(el.dataset.gb, el.checked, el);
    else if (el.tagName === 'SELECT') gboSetze(el.dataset.gb, el.value, el);
});

// Normalisieren vor Prüfung/Export
function gboBereinigt(c) {
    const T = K.normText;
    Object.keys(c.fragen).forEach(m => c.fragen[m].forEach(q => { q.thema = T(q.thema); q.text = T(q.text); }));
    Object.keys(c.ov).forEach(id => { c.ov[id].thema = T(c.ov[id].thema); c.ov[id].text = T(c.ov[id].text); });
    c.neu.forEach(x => { ['thema', 'text', 'gruppe', 'law'].forEach(k => x[k] = T(x[k])); x.massn = x.massn.map(T).filter(Boolean); });
    Object.keys(c.grund).forEach(g => { c.grund[g].thema = T(c.grund[g].thema); c.grund[g].text = T(c.grund[g].text); });
    Object.keys(c.cfg).forEach(id => { c.cfg[id].law = T(c.cfg[id].law); c.cfg[id].massn = c.cfg[id].massn.map(T).filter(Boolean); });
    c.src.forEach(s => { s.key = T(s.key); s.norm = T(s.norm); s.gloss = T(s.gloss); });
    c.cat.forEach(x => GB.FELDER.forEach(f => x[f] = T(x[f])));
    GB.FELDER.forEach(f => c.def[f] = T(c.def[f]));
    if (c.seite) c.seite.forEach(g => g.zeilen.forEach(r => { ['kurz', 'url', 'titel', 'hinweis'].forEach(k => r[k] = T(r[k])); r.apps = r.apps.map(T).filter(Boolean); }));
    const jetzt = new Set(); Object.values(c.fragen).forEach(l => l.forEach(q => jetzt.add(q.id)));
    const weg = []; Object.values(S.alt.gbo.fragen).forEach(l => l.forEach(q => { if (!jetzt.has(q.id)) weg.push(q.id); }));
    c.still = [...new Set([...S.alt.gbo.still, ...weg])].sort();
    return c;
}

window.addEventListener('beforeunload', e => { if (S.cur && anzahlAenderungen() && !S.ergebnis) { e.preventDefault(); e.returnValue = ''; } });

render();
})();

</script>
