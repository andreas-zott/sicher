<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASiC Pflege-Tool</title>
<style>
:root{
  --rot:#cc071e; --rot-d:#a30517; --tint:#fbe9eb; --ink:#1c2226; --muted:#5f6b73; --line:#dfe3e6;
  --paper:#f5f6f5; --card:#ffffff; --ok:#2e7d4f; --ok-t:#e6f3ec; --warn:#9a6700; --warn-t:#fff6dc;
  --neu:#1f6feb; --neu-t:#e8f0fe; --mod:#b26a00; --mod-t:#fff4e0;
  --radius:10px; --font: "Segoe UI", system-ui, -apple-system, Roboto, "Liberation Sans", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
header.top{background:var(--card);border-bottom:3px solid var(--rot);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:8px;background:var(--rot);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.2px}
header h1{font-size:18px;margin:0;font-weight:700}
header .sub{color:var(--muted);font-size:13px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--paper);border:1px solid var(--line);white-space:nowrap}
.pill.rot{background:var(--tint);border-color:#f2c4ca;color:var(--rot-d)}
.pill.neu{background:var(--neu-t);border-color:#c7d8fb;color:var(--neu)}
.pill.mod{background:var(--mod-t);border-color:#f3d7a6;color:var(--mod)}
.pill.ok{background:var(--ok-t);border-color:#bfe0cc;color:var(--ok)}
nav.tabs{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:19}
nav.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.akt{color:var(--rot-d);border-bottom-color:var(--rot)}
nav.tabs button:disabled{opacity:.4;cursor:default}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:16px 0 8px;font-size:15px}
.muted{color:var(--muted)}
.klein{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:#c3c9cd}
.btn.prim{background:var(--rot);border-color:var(--rot);color:#fff}
.btn.prim:hover{background:var(--rot-d)}
.btn.prim:disabled{background:#d9a1a8;border-color:#d9a1a8;cursor:default}
.btn.klein{padding:3px 9px;font-size:13px}
.btn.icon{padding:3px 8px;min-width:30px}
.btn.gefahr{color:var(--rot-d)}
.zeile{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.3px}
input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
textarea{resize:vertical;min-height:58px}
input:focus,textarea:focus{outline:2px solid #f0a7b0;border-color:var(--rot)}
.geaendert{background:var(--mod-t)!important;border-color:#e9c27f!important}
.drop{border:2px dashed #c9cfd3;border-radius:var(--radius);padding:28px;text-align:center;background:#fff}
.drop.over{border-color:var(--rot);background:var(--tint)}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}.katliste{position:static;max-height:none}}
@media (max-width:700px){header.top,nav.tabs{position:static}main{padding:12px}}
.katliste{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto;padding:10px}
.katliste button.kat{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer}
.katliste button.kat:hover{background:var(--paper)}
.katliste button.kat.akt{background:var(--tint);color:var(--rot-d);font-weight:700}
.katliste .nr{min-width:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.katliste .anz{margin-left:auto;color:var(--muted);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.neu{background:var(--neu)} .dot.mod{background:var(--mod)}
.frage{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;background:#fff}
.frage.neu{border-left:4px solid var(--neu)}
.frage.mod{border-left:4px solid var(--mod)}
.frage-kopf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fid{font-weight:800;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:6px;padding:2px 8px;font-size:13px}
.fid-in{width:80px!important;font-weight:700}
.gruppe-in{max-width:280px}
details.m{margin-top:8px}
details.m summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.stil{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:8px;align-items:start}
.stil span{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:8px}
.liste-zeile{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.liste-zeile .nr{min-width:26px;color:var(--muted);padding-top:8px;font-size:13px;text-align:right}
.liste-zeile textarea{min-height:38px}
.meldung{border-radius:8px;padding:9px 12px;margin:6px 0;font-size:14px}
.meldung.f{background:var(--tint);color:var(--rot-d);border:1px solid #f2c4ca}
.meldung.h{background:var(--warn-t);color:#5c4300;border:1px solid #f0dc9c}
.meldung.ok{background:var(--ok-t);color:var(--ok);border:1px solid #bfe0cc}
pre.log{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.5 Consolas,"Liberation Mono",monospace;max-height:460px;overflow:auto}
.treffer{border-bottom:1px solid var(--line);padding:7px 2px;font-size:14px;cursor:pointer}
.treffer:hover{background:var(--paper)}
.treffer mark{background:#ffe08a}
.treffer .wo{font-size:12px;color:var(--muted);font-weight:700}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.banner{background:var(--warn-t);border:1px solid #f0dc9c;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px}
.anleitung h3{color:var(--rot-d)}
.anleitung li{margin:3px 0}
code{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:.92em}
.hidden{display:none!important}
.dl a{display:inline-block;margin:4px 8px 4px 0}
</style>
</head>
<body>
<header class="top">
  <div class="logo">ASiC</div>
  <div><h1>Pflege-Tool – Fragen, Antworten, Quellen</h1><div class="sub">ASiC Handel 1.54 · arbeitet nur in diesem Browser, nichts wird hochgeladen</div><div class="sub" id="tool-version"></div></div>
  <div class="sp"></div>
  <div id="status" class="zeile"></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="laden" class="akt">1 · Paket laden</button>
  <button data-tab="katalog" disabled>2 · Fragen &amp; Maßnahmen</button>
  <button data-tab="quellen" disabled>3 · Quellen (PDF)</button>
  <button data-tab="doku" disabled>4 · Quellen (Doku)</button>
  <button data-tab="suche" disabled>Suchen &amp; Ersetzen</button>
  <button data-tab="export" disabled>5 · Prüfen &amp; Paket erzeugen</button>
  <button data-tab="anleitung">Anleitung</button>
</nav>
<main id="main"></main>

<script>
// ===================================================================
// ASiC Handel – Pflege-Tool: Kernlogik (ohne Oberfläche)
// Liest die Datendateien der App ohne sie auszuführen, hält ein
// Bearbeitungsmodell und schreibt daraus die geänderten Dateien.
// ===================================================================
'use strict';

const KERN = (() => {

const STILE = ['einfach', 'bghw', 'rechtlich'];
const STIL_NAME = { einfach: 'Einfach', bghw: 'BGHW', rechtlich: 'Rechtlich' };
const ID_RE = /^\d+(\.\d+)+$/;
const KAT_ID_RE = /^[a-z0-9äöüß][a-z0-9äöüß-]*$/;

// ---------- kleine Helfer ----------
const kopie = o => JSON.parse(JSON.stringify(o));
const gleich = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const deZahl = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function deDatum(d) {
    d = d || new Date();
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}
function zeilen(s) {
    if (!s) return 0;
    let n = 0;
    for (let i = 0; i < s.length; i++) if (s.charCodeAt(i) === 10) n++;
    if (!s.endsWith('\n')) n++;
    return n;
}
function zeileVon(src, pos) { return src.slice(0, pos).split('\n').length; }
function htmlEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function htmlDec(s) {
    return String(s).replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos|nbsp);/gi, (m, e) => {
        const l = e.toLowerCase();
        if (l === 'amp') return '&'; if (l === 'lt') return '<'; if (l === 'gt') return '>';
        if (l === 'quot') return '"'; if (l === 'apos') return "'"; if (l === 'nbsp') return ' ';
        if (l[1] === 'x') return String.fromCodePoint(parseInt(l.slice(2), 16));
        return String.fromCodePoint(parseInt(l.slice(1), 10));
    });
}
function jsStr1(s) { // einfach gequoteter JS-Text
    return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r?\n/g, ' ')
        .replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029') + "'";
}
function jsStr2(s) { return JSON.stringify(String(s)).replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029'); }
function normText(s) { return String(s == null ? '' : s).replace(/\s*\r?\n\s*/g, ' ').replace(/[ \t]+$/g, '').trim(); }

// ---------- Parser für JS-Literale (führt keinen Code aus) ----------
function findeLiteral(src, name) {
    const re = new RegExp('(?:const|let|var)\\s+' + escRe(name) + '\\s*=\\s*');
    const m = re.exec(src);
    if (!m) return null;
    const start = m.index + m[0].length;
    const dups = [];
    const r = parseLit(src, start, dups);
    return { start, end: r.end, value: r.value, dups };
}

function parseLit(src, pos, dups) {
    let i = pos;
    const fail = m => { throw new Error(m + ' (Zeile ' + zeileVon(src, i) + ')'); };
    function ws() {
        for (;;) {
            while (i < src.length && /\s/.test(src[i])) i++;
            if (src.startsWith('//', i)) { i = src.indexOf('\n', i); if (i < 0) i = src.length; }
            else if (src.startsWith('/*', i)) { const e = src.indexOf('*/', i + 2); if (e < 0) fail('Kommentar nicht beendet'); i = e + 2; }
            else break;
        }
    }
    function str() {
        const q = src[i++]; let out = '';
        while (i < src.length) {
            const c = src[i++];
            if (c === q) return out;
            if (c === '\\') {
                const d = src[i++];
                if (d === 'n') out += '\n'; else if (d === 't') out += '\t'; else if (d === 'r') out += '\r';
                else if (d === 'b') out += '\b'; else if (d === 'f') out += '\f'; else if (d === 'v') out += '\v';
                else if (d === '0' && !/\d/.test(src[i])) out += '\0';
                else if (d === 'u') {
                    if (src[i] === '{') { const e = src.indexOf('}', i); out += String.fromCodePoint(parseInt(src.slice(i + 1, e), 16)); i = e + 1; }
                    else { out += String.fromCharCode(parseInt(src.substr(i, 4), 16)); i += 4; }
                } else if (d === 'x') { out += String.fromCharCode(parseInt(src.substr(i, 2), 16)); i += 2; }
                else if (d === '\n') { /* Zeilenfortsetzung */ }
                else if (d === '\r') { if (src[i] === '\n') i++; }
                else out += d;
            } else if (c === '\n') fail('Zeilenumbruch innerhalb eines Textes');
            else out += c;
        }
        fail('Text nicht beendet');
    }
    function val(pfad) {
        ws();
        const c = src[i];
        if (c === '"' || c === "'") return str();
        if (c === '`') fail('Vorlagen-Text (`) wird nicht unterstützt');
        if (c === '[') {
            i++; const a = [];
            for (;;) {
                ws();
                if (src[i] === ']') { i++; return a; }
                a.push(val(pfad + '[' + a.length + ']'));
                ws();
                if (src[i] === ',') { i++; continue; }
                if (src[i] === ']') { i++; return a; }
                fail('„,“ oder „]“ erwartet');
            }
        }
        if (c === '{') {
            i++; const o = {}; const keys = [];
            Object.defineProperty(o, '__reihenfolge', { value: keys, enumerable: false });
            for (;;) {
                ws();
                if (src[i] === '}') { i++; return o; }
                let k;
                if (src[i] === '"' || src[i] === "'") k = str();
                else {
                    const m = /^[A-Za-z_$][\w$]*/.exec(src.slice(i, i + 200));
                    if (!m) fail('Schlüssel erwartet');
                    k = m[0]; i += k.length;
                }
                ws();
                if (src[i] !== ':') fail('„:“ erwartet');
                i++;
                const v = val(pfad + '.' + k);
                if (Object.prototype.hasOwnProperty.call(o, k)) dups.push({ pfad, schluessel: k, verworfen: o[k], gilt: v });
                else keys.push(k);
                o[k] = v;
                ws();
                if (src[i] === ',') { i++; continue; }
                if (src[i] === '}') { i++; return o; }
                fail('„,“ oder „}“ erwartet');
            }
        }
        const m = /^(-?\d+(?:\.\d+)?|true|false|null)/.exec(src.slice(i, i + 40));
        if (m) { i += m[0].length; return JSON.parse(m[0]); }
        fail('Unerwarteter Inhalt');
    }
    const value = val('');
    return { value, end: i };
}
const reihenfolge = o => (o && o.__reihenfolge) ? o.__reihenfolge.slice() : Object.keys(o || {});

// ---------- Technische Dokumentation: Quellentabellen ----------
const DOKU_H3 = 'Quellenverzeichnis der Maßnahmentexte';
const GRUPPE_RE = /<p><strong>([\s\S]*?)<\/strong><\/p>(\s*)<div class="doku-table-wrap">(\s*)<table class="doku-table quellen">([\s\S]*?)<\/table>(\s*)<\/div>/g;

function dokuBereich(html) {
    const h = html.indexOf(DOKU_H3);
    if (h < 0) return null;
    let ende = html.length;
    for (const marke of ['<h3', '</section>']) {
        const e = html.indexOf(marke, h + DOKU_H3.length);
        if (e >= 0 && e < ende) ende = e;
    }
    return { von: h, bis: ende };
}

function parseDoku(html) {
    const b = dokuBereich(html);
    if (!b) return { fehler: 'Abschnitt „' + DOKU_H3 + '“ nicht gefunden.' };
    const teil = html.slice(b.von, b.bis);
    const dm = /Stand der fachlichen Vollprüfung:\s*(\d\d\.\d\d\.\d{4})/.exec(teil);
    const gruppen = [];
    let erster = -1, letzter = -1, m;
    GRUPPE_RE.lastIndex = 0;
    while ((m = GRUPPE_RE.exec(teil))) {
        if (erster < 0) erster = m.index;
        letzter = m.index + m[0].length;
        const titelRoh = htmlDec(m[1].trim());
        const titel = titelRoh.replace(/^\d+\.\s*/, '');
        const zeilenHtml = m[4];
        const kopf = /<tr>\s*<th>([\s\S]*?)<\/th>\s*<th>([\s\S]*?)<\/th>\s*<\/tr>/.exec(zeilenHtml);
        const rows = [];
        const rr = /<tr>\s*<td>([\s\S]*?)<\/td>\s*<td>([\s\S]*?)<\/td>\s*<\/tr>/g;
        let z;
        while ((z = rr.exec(zeilenHtml))) {
            if (/<[a-z]/i.test(z[1] + z[2])) return { fehler: 'In den Quellentabellen stehen HTML-Auszeichnungen in einer Zelle (Zeile ' + zeileVon(html, b.von + m.index) + '). Bitte von Hand pflegen.' };
            rows.push([htmlDec(z[1]).trim(), htmlDec(z[2]).trim()]);
        }
        gruppen.push({ titel, spalte1: kopf ? htmlDec(kopf[1]) : 'Quelle', spalte2: kopf ? htmlDec(kopf[2]) : 'Bezug im Maßnahmenkatalog', zeilen: rows });
    }
    if (!gruppen.length) return { fehler: 'Keine Quellentabellen gefunden.' };
    return { datum: dm ? dm[1] : null, gruppen, _von: b.von + erster, _bis: b.von + letzter };
}

function dokuGruppenHtml(gruppen) {
    const I = '            ';
    return gruppen.map((g, n) =>
        `<p><strong>${n + 1}. ${htmlEsc(g.titel)}</strong></p>\n\n${I}<div class="doku-table-wrap">\n${I}<table class="doku-table quellen">\n` +
        `${I}    <tr><th>${htmlEsc(g.spalte1)}</th><th>${htmlEsc(g.spalte2)}</th></tr>\n` +
        g.zeilen.map(r => `${I}    <tr><td>${htmlEsc(r[0])}</td><td>${htmlEsc(r[1])}</td></tr>\n`).join('') +
        `${I}</table>\n${I}</div>`
    ).join('\n\n' + I);
}

// ---------- Paket analysieren ----------
// pk: { name, paths:[...], text(path) -> Promise<string> }
async function analysiere(pk) {
    const kand = pk.paths.filter(p => /(^|\/)js\/audit-data\.js$/.test(p) && !p.includes('__MACOSX'));
    if (!kand.length) throw new Error('In „' + pk.name + '“ fehlt js/audit-data.js – ist das ein Paket der ASiC Handel?');
    kand.sort((a, b) => a.length - b.length);
    const root = kand[0].slice(0, -'js/audit-data.js'.length);
    const pfad = r => root + r;
    const hat = r => pk.paths.includes(pfad(r));
    for (const r of ['js/text.js', 'js/app.js', 'sw.js']) if (!hat(r)) throw new Error('In „' + pk.name + '“ fehlt ' + r + '.');

    const roh = {
        audit: await pk.text(pfad('js/audit-data.js')),
        text: await pk.text(pfad('js/text.js')),
        app: await pk.text(pfad('js/app.js')),
        sw: await pk.text(pfad('sw.js')),
        doku: hat('dokumentation.html') ? await pk.text(pfad('dokumentation.html')) : null
    };
    const hinweise = [];

    // Version
    const appVersion = (/const APP_VERSION\s*=\s*'([^']+)'/.exec(roh.sw) || [])[1];
    const build = (/const BUILD\s*=\s*'([^']+)'/.exec(roh.sw) || [])[1];
    const cache = (/const CACHE_NAME\s*=\s*'([^']+)'/.exec(roh.sw) || [])[1];
    if (!build || !cache) throw new Error('BUILD/CACHE_NAME in sw.js nicht gefunden.');
    if (/^2\./.test(appVersion || '') || pk.paths.some(p => /gbo-/.test(p)))
        throw new Error('„' + pk.name + '“ ist die Version 2 (GBO). Das Pflege-Tool unterstützt bisher nur die Version 1.54.');
    if (!cache.endsWith(build)) hinweise.push('CACHE_NAME (' + cache + ') endet nicht auf BUILD (' + build + ').');

    // Prüfkatalog
    const a = findeLiteral(roh.audit, 'AUDIT_CATEGORIES');
    if (!a) throw new Error('AUDIT_CATEGORIES in js/audit-data.js nicht gefunden.');
    const still = [];
    const sm = /Stillgelegte Frage-IDs[^:\n]*:([^\n]*)/.exec(roh.audit);
    if (sm) sm[1].split(/[,\s]+/).filter(x => ID_RE.test(x)).forEach(x => still.push(x));

    const t = findeLiteral(roh.text, 'MEASURES_TEXT');
    const q = findeLiteral(roh.text, 'MEASURE_SOURCES');
    if (!t || !q) throw new Error('MEASURES_TEXT / MEASURE_SOURCES in js/text.js nicht gefunden.');
    const o = findeLiteral(roh.app, 'OPTIONAL_CATEGORIES');
    if (!o) throw new Error('OPTIONAL_CATEGORIES in js/app.js nicht gefunden.');

    // Maßnahmentexte flach (wie MEASURES_BY_ID in der App: letzter gewinnt)
    const flach = {}, herkunft = {};
    reihenfolge(t.value).forEach(k => {
        if (k === 'default') return;
        const v = t.value[k];
        if (!v || typeof v !== 'object') return;
        reihenfolge(v).forEach(id => {
            if (flach[id]) hinweise.push('Maßnahmentext ' + id + ' steht in js/text.js doppelt (unter „' + herkunft[id] + '“ und „' + k + '“). Es gilt der zweite.');
            flach[id] = v[id]; herkunft[id] = k;
        });
    });
    const doppelt = [];
    t.dups.forEach(d => {
        const id = d.pfad.split('.').pop();
        if (STILE.includes(d.schluessel)) doppelt.push({ id, stil: d.schluessel, verworfen: d.verworfen, gilt: d.gilt });
        else hinweise.push('In js/text.js ist „' + d.schluessel + '“ unter ' + (d.pfad || 'oberster Ebene') + ' doppelt.');
    });
    a.dups.forEach(d => hinweise.push('In js/audit-data.js ist „' + d.schluessel + '“ unter ' + d.pfad + ' doppelt.'));

    const def = t.value.default || {};
    const kats = a.value.map(k => {
        const items = (k.items || []).map(it => {
            const m = flach[it.id] || {};
            const e = { id: String(it.id), text: String(it.text || ''), m: {} };
            if (it.group) e.group = String(it.group);
            STILE.forEach(s => e.m[s] = String(m[s] || ''));
            return e;
        });
        const nr = items.length ? parseInt(items[0].id, 10) : null;
        const opt = o.value[k.id];
        return { id: String(k.id), name: String(k.name), nr, optional: opt != null, optText: opt != null ? String(opt) : '', items };
    });
    Object.keys(o.value).forEach(id => { if (!kats.some(k => k.id === id)) hinweise.push('OPTIONAL_CATEGORIES enthält „' + id + '“, diese Kategorie gibt es nicht.'); });

    let doku = null, dokuFehler = null;
    if (roh.doku != null) {
        const d = parseDoku(roh.doku);
        if (d.fehler) dokuFehler = d.fehler; else doku = { datum: d.datum, gruppen: d.gruppen };
    } else dokuFehler = 'dokumentation.html ist in diesem Paket nicht enthalten.';

    const modell = {
        kats,
        standard: { einfach: String(def.einfach || ''), bghw: String(def.bghw || ''), rechtlich: String(def.rechtlich || '') },
        quellen: { bghw: (q.value.bghw || []).map(String), rechtsquellen: (q.value.rechtsquellen || []).map(String) },
        doku,
        still
    };
    return { root, roh, build, cache, appVersion, modell, hinweise, doppelt, dokuFehler, optReihe: reihenfolge(o.value) };
}

// Fingerabdruck der Inhalte, die das Tool bearbeitet (für Mehrfach-Pakete)
function fingerabdruck(an) {
    const r = an.roh;
    let doku = '';
    if (r.doku) { const b = dokuBereich(r.doku); doku = b ? r.doku.slice(b.von, b.bis) : ''; const p = /<div class="doku-pills">[\s\S]*?<\/div>/.exec(r.doku); if (p) doku += p[0]; }
    const opt = findeLiteral(r.app, 'OPTIONAL_CATEGORIES');
    return hash(r.audit + '\u0000' + r.text + '\u0000' + r.app.slice(opt.start, opt.end) + '\u0000' + doku + '\u0000' + an.build);
}
function hash(s) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 + c, 2246822519) ^ (h2 >>> 13); }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
}

// ---------- Dateien erzeugen ----------
function genAudit(m, datum, opt) {
    const kopf = ['// Prüfkatalog ASiC Handel – zuletzt gepflegt mit dem Pflege-Tool' + (opt && opt.tool ? ' Rev. ' + opt.tool : '') + ' am ' + datum + '.'];
    if (m.still.length) kopf.push('// Stillgelegte Frage-IDs (nie wiederverwenden): ' + sortiereIds(m.still).join(', '));
    const kat = m.kats.map(k =>
        '    {\n' +
        '        id: ' + jsStr2(k.id) + ',\n' +
        '        name: ' + jsStr2(k.name) + ',\n' +
        '        items: [\n' +
        k.items.map(it => '            { id: ' + jsStr2(it.id) + (it.group ? ', group: ' + jsStr2(it.group) : '') + ', text: ' + jsStr2(it.text) + ' }').join(',\n') + '\n' +
        '        ]\n' +
        '    }').join(',\n');
    return kopf.join('\n') + '\nconst AUDIT_CATEGORIES = [\n' + kat + '\n];\n';
}

function genTexteLit(m) {
    const stile = (o, ein) => STILE.map(s => ein + s + ': ' + jsStr1(o[s] || '')).join(',\n');
    const teile = m.kats.map(k =>
        '    ' + jsStr2(k.name) + ': {\n' +
        k.items.map(it => '        ' + jsStr2(it.id) + ': {\n' + stile(it.m, '            ') + '\n        }').join(',\n') + '\n    }');
    teile.push('    default: {\n' + stile(m.standard, '        ') + '\n    }');
    return '{\n\n' + teile.join(',\n\n') + '\n}';
}

function genQuellenLit(q) {
    const liste = a => '[\n' + a.map(x => '        ' + jsStr1(x)).join(',\n') + '\n    ]';
    return '{\n    bghw: ' + liste(q.bghw) + ',\n    rechtsquellen: ' + liste(q.rechtsquellen) + '\n}';
}

function genOptionalLit(kats, reihe) {
    const opt = kats.filter(k => k.optional);
    const pos = id => { const i = (reihe || []).indexOf(id); return i < 0 ? 1e6 + opt.findIndex(k => k.id === id) : i; };
    opt.sort((a, b) => pos(a.id) - pos(b.id));
    const e = opt.map(k => '    ' + jsStr1(k.id) + ':\n        ' + jsStr1(k.optText));
    return '{\n' + e.join(',\n\n') + '\n}';
}

function ersetzeLiteral(src, name, neu) {
    const l = findeLiteral(src, name);
    if (!l) throw new Error(name + ' nicht gefunden.');
    return src.slice(0, l.start) + neu + src.slice(l.end);
}

function sortiereIds(ids) {
    const s = [...new Set(ids)];
    return s.sort((a, b) => {
        const x = a.split('.').map(Number), y = b.split('.').map(Number);
        for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; }
        return 0;
    });
}

// Katalog-Teile vergleichen
const katalogSicht = m => m.kats.map(k => ({ id: k.id, name: k.name, items: k.items.map(i => ({ id: i.id, group: i.group || '', text: i.text })) }));
const texteSicht = m => ({ k: m.kats.map(k => [k.name, k.items.map(i => [i.id, i.m])]), s: m.standard });
const optSicht = m => m.kats.filter(k => k.optional).map(k => [k.id, k.optText]);

// Kategorie-Pillen in der Doku
function pillenNeu(html, alt, neu) {
    const m = /(<div class="doku-pills">)([\s\S]*?)(<\/div>)/.exec(html);
    if (!m) return { html, hinweis: 'Liste der Kategorien („doku-pills“) in dokumentation.html nicht gefunden.' };
    const inner = m[2];
    const spans = [...inner.matchAll(/<span class="doku-pill">([^<]*)<\/span>/g)];
    if (spans.length !== alt.kats.length)
        return { html, hinweis: 'Die Kategorienliste in dokumentation.html (Abschnitt „Fachlicher Funktionsumfang“) hat ' + spans.length + ' Einträge, der Katalog ' + alt.kats.length + '. Liste bitte von Hand anpassen.' };
    const lead = inner.slice(0, spans[0].index);
    const letzte = spans[spans.length - 1];
    const trail = inner.slice(letzte.index + letzte[0].length);
    const sep = spans.length > 1 ? inner.slice(spans[0].index + spans[0][0].length, spans[1].index) : '\n' + (/[ \t]*$/.exec(lead)[0]);
    const proKat = {};
    alt.kats.forEach((k, i) => proKat[k.id] = { text: htmlDec(spans[i][1]), name: k.name });
    const texte = neu.kats.map(k => {
        const n = k.items.length;
        const g = new Set(k.items.map(i => i.group).filter(Boolean)).size;
        const a = proKat[k.id];
        let t;
        if (a) {
            t = a.text;
            if (k.name !== a.name) { const suf = (/\s\([^)]*\)$/.exec(t) || [''])[0]; t = k.name + suf; }
            if (/\(\d+ · \d+ Unterbereiche\)$/.test(t) || (g > 0 && /\(\d+\)$/.test(t)))
                t = t.replace(/\s\([^)]*\)$/, '') + (g > 0 ? ` (${n} · ${g} Unterbereiche)` : ` (${n})`);
            else if (/\(\d+\)$/.test(t)) t = t.replace(/\(\d+\)$/, `(${n})`);
            else if (g > 0) t = t + ` (${n} · ${g} Unterbereiche)`;
        } else t = k.name + (g > 0 ? ` (${n} · ${g} Unterbereiche)` : '');
        return '<span class="doku-pill">' + htmlEsc(t) + '</span>';
    });
    const neuInner = lead + texte.join(sep) + trail;
    return { html: html.slice(0, m.index) + m[1] + neuInner + m[3] + html.slice(m.index + m[0].length) };
}

// Kurztitel einer Quelle (vor „ – “)
function kurztitel(q) {
    let k = String(q).split(' – ')[0];
    if (k.length > 60) k = k.split(',')[0];
    return k.trim();
}
const norm = s => String(s).toLowerCase().replace(/\s+/g, ' ');

// ---------- Pakete bauen ----------
// pk: Paket, an: Analyse dieses Pakets, alt/neu: Modelle, opt: { build, datum, zeit }
async function baue(pk, an, alt, neu, opt) {
    const out = new Map();
    const hinweise = [];
    const R = an.root;
    const lies = async p => out.has(p) ? out.get(p) : await pk.text(p);
    const setze = (p, s) => out.set(p, s);

    const katalogGeaendert = !gleich(katalogSicht(alt), katalogSicht(neu)) || !gleich(alt.still, neu.still);
    const texteGeaendert = !gleich(texteSicht(alt), texteSicht(neu)) || an.doppelt.length > 0;
    const quellenGeaendert = !gleich(alt.quellen, neu.quellen);
    const optGeaendert = !gleich(optSicht(alt), optSicht(neu));
    const dokuGeaendert = alt.doku && neu.doku && !gleich(alt.doku.gruppen, neu.doku.gruppen);
    const datumGeaendert = alt.doku && neu.doku && alt.doku.datum !== neu.doku.datum;

    // 1) js/audit-data.js
    if (katalogGeaendert) setze(R + 'js/audit-data.js', genAudit(neu, opt.datum, opt));

    // 2) js/text.js
    if (texteGeaendert || quellenGeaendert || datumGeaendert) {
        let s = an.roh.text;
        if (texteGeaendert) s = ersetzeLiteral(s, 'MEASURES_TEXT', genTexteLit(neu));
        if (quellenGeaendert) s = ersetzeLiteral(s, 'MEASURE_SOURCES', genQuellenLit(neu.quellen));
        if (datumGeaendert && alt.doku.datum) {
            s = s.replace(new RegExp('(Fachliche Überarbeitung:\\s*)' + escRe(alt.doku.datum)), '$1' + neu.doku.datum)
                 .replace(new RegExp('(Rechts-/Regelwerksstand bei der Überarbeitung:\\s*)' + escRe(alt.doku.datum)), '$1' + neu.doku.datum);
        }
        if (s !== an.roh.text) setze(R + 'js/text.js', s);
    }

    // 3) js/app.js
    if (optGeaendert) setze(R + 'js/app.js', ersetzeLiteral(an.roh.app, 'OPTIONAL_CATEGORIES', genOptionalLit(neu.kats, an.optReihe)));

    // 4) dokumentation.html – Quellen, Datum, Kategorienliste
    const dokuPfad = R + 'dokumentation.html';
    if (an.roh.doku != null) {
        let h = an.roh.doku;
        if (dokuGeaendert) {
            const d = parseDoku(h);
            if (d.fehler) hinweise.push(d.fehler);
            else h = h.slice(0, d._von) + dokuGruppenHtml(neu.doku.gruppen) + h.slice(d._bis);
        }
        if (datumGeaendert && alt.doku.datum) h = h.replace(new RegExp('(Stand der fachlichen Vollprüfung:\\s*)' + escRe(alt.doku.datum)), '$1' + neu.doku.datum);
        if (katalogGeaendert) {
            const p = pillenNeu(h, alt, neu);
            if (p.hinweis) hinweise.push(p.hinweis);
            h = p.html;
        }
        if (h !== an.roh.doku) setze(dokuPfad, h);
    }

    // 5) Ausgabestand
    const altB = an.build, neuB = opt.build;
    const cacheNeu = an.cache.slice(0, an.cache.length - altB.length) + neuB;
    setze(R + 'sw.js', an.roh.sw
        .replace(/(const BUILD\s*=\s*')[^']+(')/, '$1' + neuB + '$2')
        .replace(/(const CACHE_NAME\s*=\s*')[^']+(')/, '$1' + cacheNeu + '$2'));

    const anzFragen = neu.kats.reduce((n, k) => n + k.items.length, 0);
    const werte = { kategorien: String(neu.kats.length), fragen: String(anzFragen), cache: cacheNeu, cache_version: 'v' + neuB };
    const htmlDateien = pk.paths.filter(p => p.startsWith(R) && /\.html?$/i.test(p) && !p.slice(R.length).includes('/'));
    const vRe = new RegExp('\\?v=' + escRe(altB) + '(?![\\w.-])', 'g');
    for (const p of htmlDateien) {
        let h = await lies(p);
        const vorher = h;
        h = h.replace(vRe, '?v=' + neuB);
        const fremd = [...h.matchAll(/\?v=([\w.-]+)/g)].map(x => x[1]).filter(v => v !== neuB);
        if (fremd.length) hinweise.push(p.slice(R.length) + ': Einbindungen mit abweichendem ?v= (' + [...new Set(fremd)].join(', ') + ') – bitte prüfen.');
        h = h.replace(/(<span data-zahl="(kategorien|fragen|cache|cache_version)">)[^<]*(<\/span>)/g, (x, a, k, b) => a + werte[k] + b);
        if (p === dokuPfad) h = h.split('Cache-Version v' + altB).join('Cache-Version v' + neuB);
        if (h !== vorher) setze(p, h);
    }
    if (pk.paths.includes(R + 'pruefen.php')) {
        const s = await lies(R + 'pruefen.php');
        const n = s.split('ASiC Handel ' + altB).join('ASiC Handel ' + neuB);
        if (n !== s) setze(R + 'pruefen.php', n);
    }
    for (const p of pk.paths.filter(p => /\.txt$/i.test(p) && !p.startsWith(R + 'js/'))) {
        const s = await lies(p);
        let n = s.split('Ausgabestand ' + altB).join('Ausgabestand ' + neuB)
                 .replace(new RegExp('^(ASiC Handel )' + escRe(altB) + '( )', 'm'), '$1' + neuB + '$2');
        if (/INSTALLATION\.txt$/i.test(p)) n = n.replace(/^(.*Ausgabestand [^)]*\)\s*·\s*Stand\s*)\d\d\.\d\d\.\d{4}/m, '$1' + opt.datum);
        if (n !== s) setze(p, n);
    }

    // 6) Dateiübersicht (Zeilen) und Gesamtzahl
    if (out.has(dokuPfad) || an.roh.doku != null) {
        let h = await lies(dokuPfad);
        const a = h.indexOf('<!-- DATEITABELLE:START -->'), b = h.indexOf('<!-- DATEITABELLE:ENDE -->');
        if (a >= 0 && b > a) {
            let tab = h.slice(a, b);
            const zeilenRe = /(<td>)([^<]+)(<\/td>\s*<td class="zahl">)([\d.]+)(<\/td>)/g;
            const treffer = [...tab.matchAll(zeilenRe)];
            const neuZahl = {};
            for (const t of treffer) {
                const rel = htmlDec(t[2]).trim();
                const p = R + rel;
                if (pk.paths.includes(p) && p !== dokuPfad) neuZahl[rel] = zeilen(await lies(p));
            }
            // Zeilen der Doku selbst ändern sich durch das Eintragen der Zahlen nicht
            if (treffer.some(t => htmlDec(t[2]).trim() === 'dokumentation.html')) neuZahl['dokumentation.html'] = zeilen(h);
            let summe = 0;
            tab = tab.replace(zeilenRe, (x, td, datei, mitte, zahl, ende) => {
                const rel = htmlDec(datei).trim();
                const n = neuZahl[rel] != null ? neuZahl[rel] : parseInt(zahl.replace(/\./g, ''), 10);
                summe += n;
                return td + datei + mitte + deZahl(n) + ende;
            });
            tab = tab.replace(/\d+ Kategorien \/ \d+ Prüfpunkte/g, neu.kats.length + ' Kategorien / ' + anzFragen + ' Prüfpunkte');
            h = h.slice(0, a) + tab + h.slice(b);
            h = h.replace(/(<span data-zahl="zeilen_gesamt">)[^<]*(<\/span>)/, '$1' + deZahl(summe) + '$2')
                 .replace(/(<span data-zahl="zeilen_stand">)[^<]*(<\/span>)/, '$1' + opt.datum + '$2');
        }
        if (h !== an.roh.doku) setze(dokuPfad, h);
    }

    // 7) Zeilenenden wie im Original
    for (const [p, s] of out) {
        if (!pk.paths.includes(p)) continue;
        const orig = await pk.text(p);
        if (orig.includes('\r\n')) out.set(p, s.replace(/\r?\n/g, '\r\n'));
        if (out.get(p) === orig) out.delete(p);
    }
    return { dateien: out, hinweise };
}

// ---------- Prüfungen ----------
function pruefe(alt, neu, extra) {
    const F = [], H = [];
    const altIds = new Set(); const altMax = {};
    alt.kats.forEach(k => k.items.forEach(i => { altIds.add(i.id); const [a, b] = i.id.split('.').map(Number); altMax[a] = Math.max(altMax[a] || 0, b); }));
    const still = new Set(alt.still);
    const namen = {}, kids = {}, ids = {};
    if (!neu.kats.length) F.push('Der Katalog enthält keine Kategorie.');
    neu.kats.forEach((k, ki) => {
        const wo = 'Kategorie ' + (k.nr != null ? k.nr : '?') + ' „' + (k.name || '–') + '“';
        if (!k.name.trim()) F.push(wo + ': Name fehlt.');
        if (k.name.trim() === 'default') F.push(wo + ': Der Name „default“ ist reserviert.');
        if (namen[k.name]) F.push(wo + ': Der Name kommt doppelt vor (Maßnahmentexte würden sich überschreiben).');
        namen[k.name] = 1;
        if (!KAT_ID_RE.test(k.id)) F.push(wo + ': Kategorie-ID „' + k.id + '“ ungültig (nur Kleinbuchstaben, Ziffern und Bindestrich).');
        if (kids[k.id]) F.push(wo + ': Kategorie-ID „' + k.id + '“ doppelt.');
        kids[k.id] = 1;
        if (!k.items.length) F.push(wo + ': enthält keine Frage.');
        if (k.optional && !k.optText.trim()) F.push(wo + ': Text für den Schalter „nicht vorhanden“ fehlt.');
        const mitGruppe = k.items.filter(i => i.group).length;
        if (mitGruppe && mitGruppe < k.items.length) H.push(wo + ': ' + (k.items.length - mitGruppe) + ' Frage(n) ohne Unterbereich – sie erscheinen unter „Weitere Prüfpunkte“.');
        k.items.forEach(i => {
            const fw = 'Frage ' + (i.id || '?') + ' (' + k.name + ')';
            if (!ID_RE.test(i.id)) F.push(fw + ': Frage-ID ungültig (Form „Kategorienummer.laufende Nummer“, z. B. 1.15).');
            else {
                if (ids[i.id]) F.push(fw + ': Frage-ID kommt doppelt vor.');
                ids[i.id] = 1;
                if (i.neu) {
                    const [a, b] = i.id.split('.').map(Number);
                    if (k.nr != null && a !== k.nr) F.push(fw + ': Die ID muss mit der Kategorienummer ' + k.nr + ' beginnen.');
                    if (altIds.has(i.id) || still.has(i.id)) F.push(fw + ': Diese ID war bereits vergeben. Neue Fragen brauchen eine noch nie verwendete ID.');
                    else if (altMax[a] && b <= altMax[a]) F.push(fw + ': Lücken nicht auffüllen – die ID muss größer sein als ' + a + '.' + altMax[a] + ' (früher vergebene IDs könnten in alten Begehungen stehen).');
                }
            }
            if (!i.text.trim()) F.push(fw + ': Fragetext fehlt.');
            STILE.forEach(s => { if (!i.m[s].trim()) F.push(fw + ': Maßnahmentext „' + STIL_NAME[s] + '“ fehlt.'); });
        });
    });
    STILE.forEach(s => { if (!neu.standard[s].trim()) F.push('Standardtext „' + STIL_NAME[s] + '“ fehlt.'); });
    ['bghw', 'rechtsquellen'].forEach(l => neu.quellen[l].forEach((q, n) => { if (!q.trim()) F.push('Quellenverzeichnis (PDF), ' + (l === 'bghw' ? 'Regelwerke' : 'Rechtsquellen') + ' Eintrag ' + (n + 1) + ': leer.'); }));
    if (neu.doku) {
        if (neu.doku.datum != null && !/^\d\d\.\d\d\.\d{4}$/.test(neu.doku.datum)) F.push('Stand der fachlichen Prüfung: Datum im Format TT.MM.JJJJ angeben.');
        neu.doku.gruppen.forEach((g, n) => {
            const gw = 'Doku-Quellen, Gruppe ' + (n + 1);
            if (!g.titel.trim()) F.push(gw + ': Überschrift fehlt.');
            if (!g.zeilen.length) F.push(gw + ' „' + g.titel + '“: keine Zeile.');
            g.zeilen.forEach((r, z) => { if (!r[0].trim()) F.push(gw + ', Zeile ' + (z + 1) + ': Quelle fehlt.'); });

    // Hinweise
    const neuIds = new Set(); neu.kats.forEach(k => k.items.forEach(i => neuIds.add(i.id)));

    if (weg.length) H.push('Entfernte Fragen: ' + sortiereIds(weg).join(', ') + '. Die IDs werden in js/audit-data.js als stillgelegt vermerkt; alte Begehungen zeigen sie als „nicht mehr im aktuellen Katalog“.');
    if (!gleich(optSicht(alt), optSicht(neu))) H.push('Schalter „nicht vorhanden“ geändert: hilfe.html nennt die betroffenen Kategorien an zwei Stellen namentlich – bitte von Hand anpassen (siehe Änderungsliste).');
    if (extra && extra.doppelt && extra.doppelt.length)
        H.push('js/text.js enthielt doppelte Einträge (' + extra.doppelt.map(d => d.id + ' ' + STIL_NAME[d.stil]).join(', ') + '). Beim Export wird nur der gültige Text geschrieben.');

    // Quellen-Abgleich (nur neue/geänderte)
    const altQ = new Set([...alt.quellen.bghw, ...alt.quellen.rechtsquellen]);
    const neuQ = [...neu.quellen.bghw, ...neu.quellen.rechtsquellen];
    const texte = alleTexte(neu).map(norm).join('\n');
    if (neu.doku) {
        const dokuText = neu.doku.gruppen.map(g => g.zeilen.map(r => r[0]).join('\n')).join('\n');
        neuQ.filter(q => !altQ.has(q)).forEach(q => {
            if (!norm(dokuText).includes(norm(kurztitel(q)))) H.push('Neue Quelle „' + kurztitel(q) + '“ steht noch nicht in den Quellentabellen der Technischen Dokumentation.');
        });
        const altD = alt.doku ? new Set(alt.doku.gruppen.flatMap(g => g.zeilen.map(r => r[0]))) : new Set();
        const pdfText = norm(neuQ.join('\n'));
        neu.doku.gruppen.forEach(g => g.zeilen.forEach(r => {
            if (r[0] && !altD.has(r[0]) && !pdfText.includes(norm(kurztitel(r[0])))) H.push('Neue Doku-Quelle „' + kurztitel(r[0]) + '“ fehlt im Quellenverzeichnis des PDF (js/text.js).');
        }));
    }
    [...altQ].filter(q => !neuQ.includes(q)).forEach(q => {
        const k = kurztitel(q);
        if (k.length >= 4 && !neuQ.some(n => kurztitel(n) === k)) {
            const n = texte.split(norm(k)).length - 1;
            if (n) H.push('Entfernte Quelle „' + k + '“ wird noch ' + n + '× in Fragen oder Maßnahmentexten genannt – „Suchen & Ersetzen“ nutzen.');
        }

}

function alleTexte(m) {
    const a = [];
    m.kats.forEach(k => k.items.forEach(i => { a.push(i.text); STILE.forEach(s => a.push(i.m[s])); }));
    STILE.forEach(s => a.push(m.standard[s]));
    return a;
}

// ---------- Änderungsliste ----------
function aenderungen(alt, neu) {
    const L = { katalog: [], texte: [], quellen: [], doku: [] };
    const altK = {}; alt.kats.forEach(k => altK[k.id] = k);
    const altI = {}; alt.kats.forEach(k => k.items.forEach(i => altI[i.id] = { i, k }));
    const neuI = {}; neu.kats.forEach(k => k.items.forEach(i => neuI[i.id] = { i, k }));
    const neuK = {}; neu.kats.forEach(k => neuK[k.id] = k);

    neu.kats.forEach(k => {
        const a = altK[k.id];
        if (!a) { L.katalog.push(`+ Neue Kategorie ${k.nr} „${k.name}“ (ID ${k.id}) mit ${k.items.length} Frage(n)`); return; }
        if (a.name !== k.name) L.katalog.push(`~ Kategorie umbenannt: „${a.name}“ → „${k.name}“`);
        if (a.optional !== k.optional || a.optText !== k.optText)
            L.katalog.push(k.optional ? `~ ${k.name}: Schalter „nicht vorhanden“ – „${k.optText}“` : `~ ${k.name}: Schalter „nicht vorhanden“ entfernt`);
        const altOrd = a.items.map(i => i.id).filter(id => k.items.some(j => j.id === id));
        const neuOrd = k.items.map(i => i.id).filter(id => a.items.some(j => j.id === id));
        if (!gleich(altOrd, neuOrd)) L.katalog.push(`~ ${k.name}: Reihenfolge der Fragen geändert`);
    });
    alt.kats.forEach(k => { if (!neuK[k.id]) L.katalog.push(`- Kategorie entfernt: ${k.nr} „${k.name}“ (${k.items.length} Frage(n))`); });
    const altKo = alt.kats.map(k => k.id).filter(id => neuK[id]), neuKo = neu.kats.map(k => k.id).filter(id => altK[id]);
    if (!gleich(altKo, neuKo)) L.katalog.push('~ Reihenfolge der Kategorien geändert');

    neu.kats.forEach(k => k.items.forEach(i => {
        const a = altI[i.id];
        if (!a || i.neu) {
            L.katalog.push(`+ Neue Frage ${i.id} (${k.name}${i.group ? ' / ' + i.group : ''}): ${i.text}`);
            STILE.forEach(s => L.texte.push(`+ ${i.id} ${STIL_NAME[s]}: ${i.m[s]}`));
            return;
        }
        if (a.i.text !== i.text) L.katalog.push(`~ Fragetext ${i.id}:\n    alt: ${a.i.text}\n    neu: ${i.text}`);
        if ((a.i.group || '') !== (i.group || '')) L.katalog.push(`~ Unterbereich ${i.id}: „${a.i.group || '–'}“ → „${i.group || '–'}“`);
        STILE.forEach(s => { if (a.i.m[s] !== i.m[s]) L.texte.push(`~ ${i.id} ${STIL_NAME[s]}:\n    alt: ${a.i.m[s]}\n    neu: ${i.m[s]}`); });
    }));
    alt.kats.forEach(k => k.items.forEach(i => { if (!neuI[i.id]) L.katalog.push(`- Frage entfernt ${i.id} (${k.name}): ${i.text} – ID stillgelegt`); }));
    STILE.forEach(s => { if (alt.standard[s] !== neu.standard[s]) L.texte.push(`~ Standardtext ${STIL_NAME[s]}:\n    alt: ${alt.standard[s]}\n    neu: ${neu.standard[s]}`); });

    [['bghw', 'Regelwerke'], ['rechtsquellen', 'Rechtsquellen']].forEach(([l, n]) => {
        const a = alt.quellen[l], b = neu.quellen[l];
        b.filter(x => !a.includes(x)).forEach(x => L.quellen.push(`+ ${n}: ${x}`));
        a.filter(x => !b.includes(x)).forEach(x => L.quellen.push(`- ${n}: ${x}`));
        const aa = a.filter(x => b.includes(x)), bb = b.filter(x => a.includes(x));
        if (!gleich(aa, bb)) L.quellen.push(`~ ${n}: Reihenfolge geändert`);
    });

    if (alt.doku && neu.doku) {
        if (alt.doku.datum !== neu.doku.datum) L.doku.push(`~ Stand der fachlichen Vollprüfung: ${alt.doku.datum} → ${neu.doku.datum}`);
        const zeile = (g, r) => `${g.titel}: ${r[0]} | ${r[1]}`;
        const a = alt.doku.gruppen.flatMap(g => g.zeilen.map(r => zeile(g, r)));
        const b = neu.doku.gruppen.flatMap(g => g.zeilen.map(r => zeile(g, r)));
        const at = alt.doku.gruppen.map(g => g.titel + '|' + g.spalte2), bt = neu.doku.gruppen.map(g => g.titel + '|' + g.spalte2);
        bt.filter(x => !at.includes(x)).forEach(x => L.doku.push(`+ Gruppe: ${x.split('|')[0]}`));
        at.filter(x => !bt.includes(x)).forEach(x => L.doku.push(`- Gruppe: ${x.split('|')[0]}`));
        b.filter(x => !a.includes(x)).forEach(x => L.doku.push(`+ ${x}`));
        a.filter(x => !b.includes(x)).forEach(x => L.doku.push(`- ${x}`));
        if (!L.doku.length && !gleich(alt.doku.gruppen, neu.doku.gruppen)) L.doku.push('~ Reihenfolge der Quellen geändert');
    }
    return L;
}

// Stellen, die von Hand geprüft werden sollten (Freitext in hilfe/dokumentation)
function handStellen(alt, neu, seiten) {
    const out = [];
    const such = (wort, warum) => {
        if (!wort || wort.length < 4) return;
        for (const [datei, html] of Object.entries(seiten)) {
            const z = html.split('\n');
            z.forEach((l, n) => {
                if (l.includes(wort) && !/doku-pill|data-zahl/.test(l)) out.push(`${datei}, Zeile ${n + 1}: „${wort}“ (${warum})`);
            });
        }
    };
    const neuK = {}; neu.kats.forEach(k => neuK[k.id] = k);
    alt.kats.forEach(k => {
        const n = neuK[k.id];
        if (!n) such(k.name, 'Kategorie entfernt');
        else {
            if (n.name !== k.name) such(k.name, 'Kategorie umbenannt in „' + n.name + '“');
            const ga = new Set(k.items.map(i => i.group).filter(Boolean)), gn = new Set(n.items.map(i => i.group).filter(Boolean));
            if (ga.size && (ga.size !== gn.size || k.items.length !== n.items.length)) such(k.name, 'Anzahl Fragen/Unterbereiche geändert');
        }
    });
    if (!gleich(optSicht(alt), optSicht(neu))) {
        for (const [datei, html] of Object.entries(seiten)) {
            html.split('\n').forEach((l, n) => {
                if (/Den Schalter gibt es bei|der Kategorie ist eingeschaltet \(/.test(l)) out.push(`${datei}, Zeile ${n + 1}: Aufzählung der Kategorien mit Schalter „nicht vorhanden“`);
            });
        }
    }
    const neuQ = [...neu.quellen.bghw, ...neu.quellen.rechtsquellen];
    [...alt.quellen.bghw, ...alt.quellen.rechtsquellen].filter(q => !neuQ.includes(q)).forEach(q => {
        const k = kurztitel(q);
        if (k.length >= 6 && !neuQ.some(x => kurztitel(x) === k)) such(k, 'Quelle aus dem Verzeichnis entfernt');
    });
    return [...new Set(out)];
}

function naechsteId(kat, alt, neu) {
    let max = 0;
    const nr = kat.nr;
    const alle = [...alt.still];
    alt.kats.forEach(k => k.items.forEach(i => alle.push(i.id)));
    neu.kats.forEach(k => k.items.forEach(i => alle.push(i.id)));
    alle.forEach(id => { const [a, b] = id.split('.').map(Number); if (a === nr && b > max) max = b; });
    return nr + '.' + (max + 1);
}
function naechsteKatNr(alt, neu) {
    let max = 0;
    [...alt.kats, ...neu.kats].forEach(k => { if (k.nr > max) max = k.nr; });
    alt.still.forEach(id => { const a = parseInt(id, 10); if (a > max) max = a; });
    return max + 1;
}
function slug(s) {
    return String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function naechsterBuild(b) {
    const m = /^(.*-)(\d+)$/.exec(b);
    return m ? m[1] + (parseInt(m[2], 10) + 1) : b + '-1';
}
function pruefeBuild(alt, neu) {
    if (!/^\d+\.\d+-\d+$/.test(neu)) return 'Ausgabestand im Format „1.54-8“ angeben.';
    const [ar, an] = alt.split('-'), [nr, nn] = neu.split('-');
    if (ar !== nr) return 'Die Revision (' + ar + ') bleibt gleich – eine neue Revision bitte von Hand (Technische Dokumentation, Abschnitt 12).';
    if (parseInt(nn, 10) <= parseInt(an, 10)) return 'Der neue Ausgabestand muss größer sein als ' + alt + '.';
    return null;
}

return {
    STILE, STIL_NAME, ID_RE, kopie, gleich, deDatum, zeilen, htmlEsc, htmlDec, normText, findeLiteral, parseDoku,
    dokuGruppenHtml, analysiere, fingerabdruck, genAudit, genTexteLit, genQuellenLit, genOptionalLit, baue, pruefe,
    aenderungen, handStellen, naechsteId, naechsteKatNr, slug, naechsterBuild, pruefeBuild, kurztitel, sortiereIds, alleTexte,
    katalogSicht, texteSicht

})();

<script>

async function zipPaket(file) {
    const zip = await JSZip.loadAsync(file);
    const paths = Object.keys(zip.files).filter(p => !zip.files[p].dir);
    const cache = new Map();
    return {
        name: file.name, art: 'zip', paths,
        text: async p => { if (!cache.has(p)) cache.set(p, await zip.file(p).async('string')); return cache.get(p); },
        bytes: p => zip.file(p).async('uint8array'),
        datum: p => zip.files[p].date
    };
}
function ordnerPaket(files) {
    const map = new Map();
    for (const f of files) map.set(f.webkitRelativePath || f.name, f);

    const cache = new Map();
    return {
        name: erster.split('/')[0] + ' (Ordner)', art: 'ordner', paths: [...map.keys()],

}

// ---------------- Hilfen ----------------

    ['bghw', 'rechtsquellen'].forEach(l => c.quellen[l] = c.quellen[l].map(K.normText));

}
const n = (a, b) => K.normText(a) !== K.normText(b);
const kl = geaendert => geaendert ? ' geaendert' : '';

// ---------------- Status / Tabs ----------------
function renderStatus() {
    const st = $('#status');
    if (!S.cur) { st.innerHTML = ''; return; }
    const z = anzahlAenderungen();
    const fragen = S.cur.kats.reduce((a, k) => a + k.items.length, 0);
    st.innerHTML =
        `<span class="pill">Ausgabestand ${esc(S.an.build)}</span>` +

$('#tabs').addEventListener('click', e => {

}

// ---------------- 1 · Laden ----------------
function renderLaden() {
    const geladen = S.pakete.length ? `
      <div class="card"><h2>Geladen</h2>

        ${S.pakete.map(p => `<tr><td>${esc(p.pk.name)}</td><td>${esc(p.an.build)}</td><td><code>${esc(p.an.root || '(oberste Ebene)')}</code></td><td>${p.pk.paths.length}</td></tr>`).join('')}

        <div class="zeile"><button class="btn prim" data-act="tab" data-tab="katalog">Weiter zu Fragen &amp; Maßnahmen →</button>

        if (b.fragen) F.push({ wo: `${it.id} · Prüffrage`, ki, ii, get: () => it.text, set: v => it.text = v });
        if (b.texte) K.STILE.forEach(s => F.push({ wo: `${it.id} · Maßnahme ${K.STIL_NAME[s]}`, ki, ii, get: () => it.m[s], set: v => it.m[s] = v }));
    }));
    if (b.texte) K.STILE.forEach(s => F.push({ wo: `Standardtext ${K.STIL_NAME[s]}`, std: true, get: () => c.standard[s], set: v => c.standard[s] = v }));
    if (b.quellen) ['bghw', 'rechtsquellen'].forEach(l => c.quellen[l].forEach((q, i) => F.push({ wo: `Quellen (PDF) · ${l === 'bghw' ? 'Regelwerke' : 'Rechtsquellen'} ${i + 1}`, tab: 'quellen', get: () => c.quellen[l][i], set: v => c.quellen[l][i] = v })));
    if (b.doku && c.doku) c.doku.gruppen.forEach((g, gi) => g.zeilen.forEach((r, zi) => [0, 1].forEach(sp =>
        F.push({ wo: `Quellen (Doku) · Gruppe ${gi + 1}, Zeile ${zi + 1}, ${sp ? 'Bezug' : 'Quelle'}`, tab: 'doku', get: () => r[sp], set: v => r[sp] = v }))));
    return F;
}

}

function protokoll(neu, L, dateien, seitenNeu) {
    const z = [];
    const linie = '='.repeat(70);
    z.push('ASiC Handel – Pflege von Fragen, Antworten und Quellen');
    z.push(linie);
    z.push(`Ausgabestand: ${S.an.build} → ${S.neuBuild}`);
    z.push(`Erstellt: ${new Date().toLocaleString('de-DE')} mit dem Pflege-Tool Rev. ${TOOL.revision}`);
    z.push(`Pakete: ${S.pakete.map(p => p.pk.name).join(', ')}`);
    z.push(`Prüfkatalog: ${neu.kats.length} Kategorien, ${neu.kats.reduce((a, k) => a + k.items.length, 0)} Fragen (vorher ${S.alt.kats.length} / ${S.alt.kats.reduce((a, k) => a + k.items.length, 0)})`);
    const abschnitt = (t, a) => { z.push(''); z.push(t); z.push('-'.repeat(70)); z.push(a.length ? a.join('\n') : '(keine)'); };
    abschnitt('PRÜFKATALOG (js/audit-data.js)', L.katalog);
    abschnitt('MASSNAHMENTEXTE (js/text.js)', L.texte);
    abschnitt('QUELLENVERZEICHNIS IM PDF (js/text.js)', L.quellen);
    abschnitt('QUELLEN IN DER TECHNISCHEN DOKUMENTATION (dokumentation.html)', L.doku);
    if (dateien) dateien.forEach(d => abschnitt('GEÄNDERTE DATEIEN – ' + d.name, d.liste.concat(d.hinweise.map(h => 'Hinweis: ' + h))));
    const hand = handStellenJetzt(neu, seitenNeu);
    abschnitt('BITTE VON HAND PRÜFEN (Freitext, den das Tool nicht ändert)', hand);
    abschnitt('DANACH', [
        '1. Neues Paket entpacken und die App im Browser öffnen: geänderte Fragen im Prüfkatalog,',
        '   Maßnahmentexte in allen drei Sprachstilen und das PDF mit Quellenverzeichnis ansehen.',
        '2. Auf den Server kopieren. config.php und eine eigene zugang-config.js NICHT überschreiben.',
        '3. Die Geräte laden den neuen Stand beim nächsten Öffnen mit Verbindung automatisch.',
        '4. Diese Liste zusammen mit dem Paket aufbewahren (Nachweis der fachlichen Änderung).'
    ]);
    return z.join('\n') + '\n';
}
function handStellenJetzt(neu, seitenNeu) {
    const seiten = {};
    if (S.hilfeText) seiten['hilfe.html'] = S.hilfeText;
    if (S.an.roh.doku) seiten['dokumentation.html'] = S.an.roh.doku;
    Object.assign(seiten, seitenNeu || {});
    return K.handStellen(S.alt, neu, seiten);
}
async function exportiere() {
    const dl = $('#dl');
    dl.innerHTML = '<div class="meldung h">Pakete werden erzeugt …</div>';
    try {
        const neu = bereinigt(S.cur);
        const datum = K.deDatum();
        const ergebnisse = [];
        for (const p of S.pakete) {
            const r = await K.baue(p.pk, p.an, S.alt, neu, { build: S.neuBuild, datum, tool: TOOL.revision });
            ergebnisse.push({ p, r });
        }
        const L = K.aenderungen(S.alt, neu);
        const R = S.an.root, d0 = ergebnisse[0].r.dateien, seitenNeu = {};
        ['hilfe.html', 'dokumentation.html'].forEach(f => { if (d0.has(R + f)) seitenNeu[f] = d0.get(R + f); });
        const log = protokoll(neu, L, ergebnisse.map(e => ({ name: e.p.pk.name, liste: [...e.r.dateien.keys()].map(x => '~ ' + x), hinweise: e.r.hinweise })), seitenNeu);
        const logName = 'PFLEGE-AENDERUNGEN_' + S.neuBuild + '.txt';
        const links = [];
        for (const { p, r } of ergebnisse) {
            const zip = new JSZip();
            for (const path of p.pk.paths) {
                if (/(^|\/)(\.DS_Store|Thumbs\.db)$/.test(path) || path.includes('__MACOSX/')) continue;
                const opt = { date: p.pk.datum(path) };
                if (r.dateien.has(path)) zip.file(path, r.dateien.get(path), { date: new Date() });
                else zip.file(path, await p.pk.bytes(path), opt);
            }
            if (p.an.root) zip.file(logName, log);
            const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 }, mimeType: 'application/zip' });
            let name = p.pk.name.replace(/ \(Ordner\)$/, '');
            name = name.includes(S.an.build) ? name.split(S.an.build).join(S.neuBuild) : name.replace(/\.zip$/i, '') + '-' + S.neuBuild;
            if (!/\.zip$/i.test(name)) name += '.zip';
            links.push({ name, url: URL.createObjectURL(blob), groesse: blob.size });
        }
        links.push({ name: logName, url: URL.createObjectURL(new Blob([log], { type: 'text/plain;charset=utf-8' })), groesse: log.length });
        S.ergebnis = { links, log };
        dl.innerHTML = `<div class="meldung ok">✓ Fertig. Bitte herunterladen:</div>` +
            links.map(l => `<a class="btn" href="${l.url}" download="${esc(l.name)}">⬇ ${esc(l.name)} <span class="muted klein">(${Math.round(l.groesse / 1024)} KB)</span></a>`).join('') +
            `<p class="klein muted">Die Änderungsliste liegt auch in jedem ZIP neben dem App-Ordner. Nach dem Herunterladen kann die Bearbeitung hier verworfen werden („Paket laden“ → „Alles verwerfen“).</p>`;
        $('.log').textContent = log;
        try { localStorage.removeItem(ENTWURF()); } catch (e) { /* egal */ }
    } catch (e) {
        console.error(e);
        dl.innerHTML = '<div class="meldung f">Fehler beim Erzeugen: ' + esc(e.message || e) + '</div>';
    }
}

    <h3>Regeln für Frage-IDs</h3>
    <ul>

// ---------------- Eingaben ----------------
function setze(pfad, wert, el) {
    const t = pfad.split('.');
    const k = S.cur.kats[S.kat];
    if (t[0] === 'k') {
        if (t[1] === 'optional') { k.optional = wert; if (wert && !k.optText) k.optText = 'Kein ' + k.name + ' im Markt vorhanden'; renderKatalog(); return; }
        if (t[1] === 'name' && (k.neu || !S.altKat[k.id]) && !k.idManuell) {
            k.id = K.slug(wert);
            const idEl = document.querySelector('[data-b="k.id"]'); if (idEl) idEl.value = k.id;
        }
        if (t[1] === 'id') k.idManuell = true;
        k[t[1]] = wert;
        const a = S.altKat[k.id];
        if (el && a && !k.neu && (t[1] === 'name' || t[1] === 'optText')) el.classList.toggle('geaendert', n(a[t[1]], wert));
        if (t[1] === 'name') { const b = document.querySelector('.katliste .kat.akt span:nth-child(2)'); if (b) b.textContent = wert || '(ohne Name)'; }
    } else if (t[0] === 'i') {
        const it = k.items[+t[1]];
        const a = it.neu ? null : S.altIdx[it.id];
        if (t[2] === 'm') { it.m[t[3]] = wert; if (el && a) el.classList.toggle('geaendert', n(a.m[t[3]], wert)); }
        else if (t[2] === 'group') { it.group = wert; if (el && a) el.classList.toggle('geaendert', n(a.group || '', wert)); }
        else { it[t[2]] = wert; if (el && a && t[2] === 'text') el.classList.toggle('geaendert', n(a.text, wert)); }
    } else if (t[0] === 's') {
        S.cur.standard[t[1]] = wert;
        if (el) el.classList.toggle('geaendert', n(S.alt.standard[t[1]], wert));
    } else if (t[0] === 'q') {
        S.cur.quellen[t[1]][+t[2]] = wert;
        if (el) el.classList.toggle('geaendert', !S.alt.quellen[t[1]].includes(K.normText(wert)));
    } else if (t[0] === 'd') {
        S.cur.doku.datum = wert;
        if (el) el.classList.toggle('geaendert', n(S.alt.doku.datum, wert));
    } else if (t[0] === 'g') {
        S.cur.doku.gruppen[+t[1]][t[2]] = wert;
    } else if (t[0] === 'r') {
        S.cur.doku.gruppen[+t[1]].zeilen[+t[2]][+t[3]] = wert;
    }
    merkeEntwurf();
}
main.addEventListener('input', e => {
    const el = e.target;
    if (!el.dataset.b || el.type === 'checkbox') return;
    setze(el.dataset.b, el.value, el);
});
main.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.b && el.type === 'checkbox') setze(el.dataset.b, el.checked, el);
    if (el.dataset.s != null || el.id === 's-gross') { sucheLesen(); sucheZeigen(); }
});
main.addEventListener('keydown', e => {
    if ((e.target.id === 's-q' || e.target.id === 's-r') && e.key === 'Enter') { sucheLesen(); sucheZeigen(); }
});

const tausch = (a, i, j) => { if (j < 0 || j >= a.length) return false; [a[i], a[j]] = [a[j], a[i]]; return true; };

main.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act, i = +b.dataset.i;
    const k = S.cur && S.cur.kats[S.kat];
    switch (act) {
        case 'tab': S.tab = b.dataset.tab; render(); break;
        case 'neu-laden':
            if (anzahlAenderungen() && !confirm('Alle Änderungen verwerfen?')) return;
            try { localStorage.removeItem(ENTWURF()); } catch (x) { /* egal */ }
            S.pakete = []; S.cur = null; S.an = null; S.entwurf = null; S.hilfeText = null; S.ergebnis = null;
            document.querySelectorAll('#tabs button').forEach(t => t.disabled = !['laden', 'anleitung'].includes(t.dataset.tab));
            render(); break;
        case 'entwurf-ja': S.cur = S.entwurf.cur; S.entwurf = null; render(); break;
        case 'entwurf-nein': try { localStorage.removeItem(ENTWURF()); } catch (x) { /* egal */ } S.entwurf = null; render(); break;

        case 'kat': S.kat = i; renderKatalog(); window.scrollTo(0, 0); break;
        case 'standard': S.kat = -1; renderKatalog(); break;
        case 'kat-neu': {
            const nr = K.naechsteKatNr(S.alt, S.cur);
            const kat = { id: '', name: 'Neue Kategorie', nr, optional: false, optText: '', neu: true, items: [] };
            kat.id = 'neue-kategorie-' + nr;
            kat.items.push({ id: nr + '.1', text: '', neu: true, m: { einfach: '', bghw: '', rechtlich: '' } });
            S.cur.kats.push(kat); S.kat = S.cur.kats.length - 1; merkeEntwurf(); renderKatalog();
            const f = document.querySelector('[data-b="k.name"]'); if (f) { f.focus(); f.select(); }
            break;
        }
        case 'kat-hoch': if (tausch(S.cur.kats, S.kat, S.kat - 1)) { S.kat--; merkeEntwurf(); renderKatalog(); } break;
        case 'kat-runter': if (tausch(S.cur.kats, S.kat, S.kat + 1)) { S.kat++; merkeEntwurf(); renderKatalog(); } break;
        case 'kat-weg':
            if (!confirm(`Kategorie „${k.name}“ mit ${k.items.length} Frage(n) entfernen?\n\nDie Frage-IDs werden stillgelegt. Alte Begehungen zeigen die Fragen danach als „nicht mehr im aktuellen Katalog“.`)) return;
            S.cur.kats.splice(S.kat, 1); S.kat = Math.max(0, S.kat - 1); merkeEntwurf(); renderKatalog(); break;
        case 'frage-neu': {
            const id = K.naechsteId(k, S.alt, S.cur);
            const letzte = k.items[k.items.length - 1];
            k.items.push({ id, text: '', group: letzte && letzte.group ? letzte.group : undefined, neu: true, m: { einfach: '', bghw: '', rechtlich: '' } });
            merkeEntwurf(); renderKatalog();
            const f = document.querySelector(`#frage-${k.items.length - 1} textarea`); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); }
            break;
        }
        case 'frage-hoch': if (tausch(k.items, i, i - 1)) { merkeEntwurf(); renderKatalog(); } break;
        case 'frage-runter': if (tausch(k.items, i, i + 1)) { merkeEntwurf(); renderKatalog(); } break;
        case 'frage-weg': {
            const it = k.items[i];
            if (!confirm(it.neu ? `Neue Frage ${it.id} wieder entfernen?` : `Frage ${it.id} entfernen?\n\n„${it.text}“\n\nDie ID ${it.id} wird stillgelegt und nie wieder vergeben. Alte Begehungen zeigen die Frage danach als „nicht mehr im aktuellen Katalog“.`)) return;
            k.items.splice(i, 1); merkeEntwurf(); renderKatalog(); break;
        }

        case 'q-neu': S.cur.quellen[b.dataset.l].push(''); merkeEntwurf(); renderQuellen(); { const t = document.querySelectorAll(`[data-b^="q.${b.dataset.l}."]`); t[t.length - 1].focus(); } break;
        case 'q-hoch': if (tausch(S.cur.quellen[b.dataset.l], i, i - 1)) { merkeEntwurf(); renderQuellen(); } break;
        case 'q-runter': if (tausch(S.cur.quellen[b.dataset.l], i, i + 1)) { merkeEntwurf(); renderQuellen(); } break;
        case 'q-weg': {
            const q = S.cur.quellen[b.dataset.l][i];
            const kt = K.kurztitel(q);
            const anz = kt.length >= 4 ? K.alleTexte(S.cur).join('\n').toLowerCase().split(kt.toLowerCase()).length - 1 : 0;
            if (!confirm(`Eintrag entfernen?\n\n${q}` + (anz ? `\n\n„${kt}“ wird noch ${anz}× in Fragen/Maßnahmentexten genannt. Danach „Suchen & Ersetzen“ nutzen.` : ''))) return;
            S.cur.quellen[b.dataset.l].splice(i, 1); merkeEntwurf(); renderQuellen(); break;
        }

        case 'datum-heute': S.cur.doku.datum = K.deDatum(); merkeEntwurf(); renderDoku(); break;
        case 'g-neu': S.cur.doku.gruppen.push({ titel: 'Neue Gruppe', spalte1: 'Quelle', spalte2: 'Bezug im Maßnahmenkatalog', zeilen: [['', '']] }); merkeEntwurf(); renderDoku(); break;
        case 'g-hoch': if (tausch(S.cur.doku.gruppen, i, i - 1)) { merkeEntwurf(); renderDoku(); } break;
        case 'g-runter': if (tausch(S.cur.doku.gruppen, i, i + 1)) { merkeEntwurf(); renderDoku(); } break;
        case 'g-weg': if (confirm(`Gruppe „${S.cur.doku.gruppen[i].titel}“ mit ${S.cur.doku.gruppen[i].zeilen.length} Zeile(n) entfernen?`)) { S.cur.doku.gruppen.splice(i, 1); merkeEntwurf(); renderDoku(); } break;
        case 'r-neu': { const g = +b.dataset.g; S.cur.doku.gruppen[g].zeilen.push(['', '']); merkeEntwurf(); renderDoku(); const t = document.querySelectorAll(`[data-b^="r.${g}."]`); t[t.length - 2].focus(); break; }
        case 'r-hoch': if (tausch(S.cur.doku.gruppen[+b.dataset.g].zeilen, i, i - 1)) { merkeEntwurf(); renderDoku(); } break;
        case 'r-runter': if (tausch(S.cur.doku.gruppen[+b.dataset.g].zeilen, i, i + 1)) { merkeEntwurf(); renderDoku(); } break;
        case 'r-weg': if (confirm('Zeile entfernen?')) { S.cur.doku.gruppen[+b.dataset.g].zeilen.splice(i, 1); merkeEntwurf(); renderDoku(); } break;

        case 's-such': sucheLesen(); sucheZeigen(); break;
        case 's-ersetz': {
            sucheLesen();
            const re = sucheRe(true);
            if (!re) return;
            const t = felder().filter(f => { re.lastIndex = 0; return re.test(f.get()); });
            let summe = 0; t.forEach(f => { summe += (f.get().match(re) || []).length; });
            if (!t.length) { sucheZeigen(); return; }
            if (!confirm(`${summe}× „${S.suche.q}“ in ${t.length} Feld(ern) ersetzen durch „${S.suche.r}“?`)) return;
            t.forEach(f => f.set(f.get().replace(re, () => S.suche.r)));
            merkeEntwurf(); sucheZeigen();
            break;
        }
        case 's-geh': {
            const f = S.sucheTreffer[i];
            if (f.tab) { S.tab = f.tab; render(); return; }
            S.tab = 'katalog';
            if (f.std) { S.kat = -1; render(); return; }
            S.kat = f.ki; render();
            const el = document.querySelector('#frage-' + f.ii);
            if (el) { el.querySelector('details').open = true; el.scrollIntoView({ block: 'center' }); el.style.outline = '3px solid #ffe08a'; setTimeout(() => el.style.outline = '', 1600); }
            break;
        }
        case 'export': exportiere(); break;
    }
});

// hilfe.html für die Hand-Prüfstellen merken
const altAnalyse = K.analysiere;
K.analysiere = async pk => {
    const an = await altAnalyse(pk);
    if (!S.hilfeText && pk.paths.includes(an.root + 'hilfe.html')) S.hilfeText = await pk.text(an.root + 'hilfe.html');
    return an;
};
window.addEventListener('beforeunload', e => { if (S.cur && anzahlAenderungen() && !S.ergebnis) { e.preventDefault(); e.returnValue = ''; } });

render();
})();
