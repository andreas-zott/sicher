<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ASiC Handel – Arbeitssicherheits-Check</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2226">
<script src="js/jspdf.umd.min.js"></script>
</head>
<body>

<header class="app-header">
    <div class="hazard-strip"></div>
    <div class="app-header-inner">
        <div class="brand">
            <span class="brand-title">ASiC Handel</span>
            <span class="brand-tag">Märkte</span>
            <span class="brand-subtitle">„Sicher geprüft. Sicher gehandelt.“</span>
        </div>
        <div class="header-controls">
            <div class="style-switch" id="style-switch">
                <button class="style-btn" data-style="einfach">Einfach</button>
                <button class="style-btn" data-style="bghw">BGHW</button>
                <button class="style-btn" data-style="rechtlich">Rechtlich</button>
            </div>
            <nav class="app-nav">
               <a href="index.html" class="active">Prüfkatalog</a>
                <a href="massnahmen.html">Aktionsplan</a>
                <a href="fotos.html">Fotos</a>
                <a href="verlauf.html">Verlauf</a>
            </nav>
        </div>
    </div>
</header>

<main class="page">

    <!-- Betriebsdaten -->
    <section class="card company-card">
        <div class="section-title">Betriebsdaten</div>
        <div class="company-grid">
            <div class="field">
                <label for="firma">Firma / Markt</label>
                <input type="text" id="firma" placeholder="Name des Marktes">
            </div>
            <div class="field">
                <label for="standort">Standort</label>
                <input type="text" id="standort" placeholder="Adresse oder Bereich">
            </div>
            <div class="field">
                <label for="datum">Datum</label>
                <input type="date" id="datum">
            </div>
            <div class="field">
                <label for="pruefername">Prüfer</label>
                <input type="text" id="pruefername" placeholder="Name des Prüfers">
            </div>
            <div class="field">
                <label for="marktleitung">Marktleitung</label>
                <input type="text" id="marktleitung" placeholder="Name der Marktleitung">
            </div>
            <div class="field">
                <label for="teilnehmer">Teilnehmer</label>
                <input type="text" id="teilnehmer" placeholder="Weitere Teilnehmer">
            </div>
        </div>
    </section>

    <!-- Fortschritt -->
    <section class="card progress-bar-card">
        <div class="progress-row">
            <span class="progress-label" id="progress-label">0 / 149 geprüft</span>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
        </div>
        <div class="stat-pills">
            <span class="stat-pill ok">✓ <span id="stat-ok">0</span> In Ordnung</span>
            <span class="stat-pill mangel">! <span id="stat-mangel">0</span> Mangel</span>
            <span class="stat-pill na">– <span id="stat-na">0</span> N.V.</span>
            <span class="stat-pill offen"><span id="stat-offen">149</span> Offen</span>
        </div>
    </section>

    <!-- Kategorien -->
    <div id="checklist-container"></div>

</main>

<footer class="app-footer">
    <div class="app-footer-meta">
        <span id="footer-version"></span>
        <span class="footer-copyright" id="footer-copyright"></span>
    </div>
    <div class="app-footer-links">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="dokumentation.html">Technische Dokumentation</a>
    </div>
</footer>

<div class="action-bar">
    <div class="action-bar-inner">
        <div class="action-bar-group">
            <div class="menu-dropdown">
                <button class="btn btn-secondary btn-small" id="file-menu-toggle">Datei ▾</button>
                <div class="menu-dropdown-panel" id="file-menu-panel">
                    <button class="menu-item" id="btn-save">💾 Speichern</button>
                    <div class="menu-divider"></div>
                    <button class="menu-item" id="btn-json-export">⬆️ JSON exportieren</button>
                    <label class="menu-item" for="json-import-input" style="cursor:pointer;">
                        ⬇️ JSON laden
                        <input type="file" id="json-import-input" accept="application/json" style="display:none;">
                    </label>
                    <div class="menu-divider"></div>
                    <button class="menu-item" id="btn-archive">📦 Begehung archivieren</button>
                    <button class="menu-item menu-item-danger" id="btn-reset">🗑️ Zurücksetzen</button>
                </div>
            </div>
        </div>
        <div class="action-bar-group">
            <div class="menu-dropdown">
                <button class="btn btn-primary btn-small" id="export-menu-toggle">Exportieren ▾</button>
                <div class="menu-dropdown-panel" id="export-menu-panel">
                    <div class="menu-mode-row">
                        <button class="mode-btn" data-mode="checkliste">Checkliste</button>
                        <button class="mode-btn" data-mode="massnahmen">Maßnahmen</button>
                        <button class="mode-btn" data-mode="fotos">Fotos</button>
                        <button class="mode-btn" data-mode="alle">Alles</button>
                    </div>
                    <div class="menu-divider"></div>
                    <button class="menu-item" data-action="print">🖨️ Drucken</button>
                    <button class="menu-item" data-action="share">📤 PDF teilen</button>
                    <button class="menu-item" data-action="mail">✉️ Mail vorbereiten</button>
                </div>
            </div>
            <a href="massnahmen.html" class="btn btn-primary">Weiter →</a>
        </div>
    </div>
</div>

<script src="js/audit-data.js"></script>
<script src="js/text.js"></script>
<script src="js/photos-store.js"></script>
<script src="js/archive-store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
