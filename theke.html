<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theke / Metzgerei — Arbeitssicherheit</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="lib/css/fontawesome.min.css">
<link rel="stylesheet" href="css/styles.css">

    @media print {
        .app-footer, .button-row, .back-button, .theme-toggle { display: none !important; }
        body { background: #fff; }
    }
</style>

<body>

<button class="theme-toggle" id="themeToggle" aria-label="Theme umschalten">🌙</button>

<section class="hero hero-compact">
    <div class="hero-icon"><i class="fas fa-cut"></i></div>
    <h1>Theke / Metzgerei</h1>
    <p>Arbeitssicherheit — Fleischverarbeitung, 70 Prüfpunkte</p>
</section>

<div class="container">

    <a href="l1.html" class="back-button"><i class="fas fa-arrow-left"></i> Zurück zu Checklisten</a>

    <div class="card">
        <div class="stammdaten-grid">
            <div>
                <label for="datum">Datum</label>
                <input type="date" id="datum">
            </div>
            <div>
                <label for="marktnummer">Marktnummer</label>
                <input type="text" id="marktnummer" placeholder="z. B. M123">
            </div>
            <div>
                <label for="name">Name</label>
                <input type="text" id="name">
            </div>
            <div>
                <label for="sifa">SiFa</label>
                <input type="text" id="sifa">
            </div>
        </div>
    </div>

    <div id="fragenContainer"></div>

    <div class="card">
        <h2 style="margin-top:0;">Unterschrift</h2>
        <canvas id="unterschriftCanvas" class="sign-canvas"></canvas>
        <div style="margin-top:10px;">
            <button type="button" class="btn btn-secondary" style="height:36px; padding:0 16px; font-size:0.85rem;" onclick="unterschriftLoeschen()">Löschen</button>
        </div>
    </div>

    <div class="button-row">
        <button type="button" class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Drucken</button>
    </div>

</div>

<footer class="app-footer">
    <nav class="app-footer-links">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="faq.html">FAQ</a>
        <a href="technische-beschreibung.html">Technik</a>
        <a href="welcome.html">Startseite</a>
    </nav>
    <p>© <span class="app-footer-jahr"></span> Andreas Zott — Alle Rechte vorbehalten</p>
    <p class="app-footer-version"></p>
</footer>

<script src="js/theke-daten.js"></script>
<script src="js/common.js"></script>
<script>
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str === undefined || str === null ? '' : String(str);
        return div.innerHTML;
    }

    function renderKategorien() {
        const container = document.getElementById('fragenContainer');
        container.innerHTML = THEKE_KATEGORIEN.map((kat, kIdx) => `
            <div class="kategorie-block">
                <h2 class="kategorie-titel">${escapeHtml(kat.titel)}</h2>
                <div class="fragen-liste">
                    ${kat.fragen.map((f, fIdx) => {
                        const name = f.name || `frage-${kIdx}-${fIdx}`;
                        return `
                        <div class="frage-zeile" data-name="${name}">
                            <div class="frage-text">${escapeHtml(f.frage)}</div>
                            <div class="antwort-optionen">
                                <label class="antwort-opt opt-ja"><input type="radio" name="${name}" value="ja"><span>Ja</span></label>
                                <label class="antwort-opt opt-nein"><input type="radio" name="${name}" value="nein"><span>Nein</span></label>
                                <label class="antwort-opt opt-nv"><input type="radio" name="${name}" value="nicht_vorhanden"><span>N/V</span></label>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
            </div>
        `).join('');

        container.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const zeile = radio.closest('.frage-zeile');
                zeile.classList.remove('hervorhebung-ja', 'hervorhebung-nein', 'hervorhebung-nv');
                if (radio.value === 'ja') zeile.classList.add('hervorhebung-ja');
                if (radio.value === 'nein') zeile.classList.add('hervorhebung-nein');
                if (radio.value === 'nicht_vorhanden') zeile.classList.add('hervorhebung-nv');
                speichereStand();
            });
        });
    }

    // ===== Unterschrift =====
    let canvas, ctx, malend = false;

    function initSignatur() {
        canvas = document.getElementById('unterschriftCanvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();

        function pos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x, y };
        }
        function start(e) { malend = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
        function zeichne(e) {
            if (!malend) return;
            const p = pos(e);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.stroke();
            e.preventDefault();
        }
        function stop() { if (!malend) return; malend = false; ctx.beginPath(); speichereStand(); }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', zeichne);
        canvas.addEventListener('mouseup', stop);
        canvas.addEventListener('mouseout', stop);
        canvas.addEventListener('touchstart', start, { passive: false });
        canvas.addEventListener('touchmove', zeichne, { passive: false });
        canvas.addEventListener('touchend', stop);
        window.addEventListener('resize', resizeCanvas);
    }

    function resizeCanvas() {
        const bild = istCanvasLeer() ? null : canvas.toDataURL('image/png');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        if (bild) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = bild;
        }
    }

    function istCanvasLeer() {
        if (!canvas || !ctx) return true;
        const daten = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 3; i < daten.length; i += 4) {
            if (daten[i] !== 0) return false;
        }
        return true;
    }

    function unterschriftLoeschen() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        speichereStand();
    }

    // ===== Speichern & Laden =====
    const STORAGE_KEY = 'theke_stand_v1';

    function speichereStand() {
        const antworten = {};
        document.querySelectorAll('.frage-zeile').forEach(zeile => {
            const checked = zeile.querySelector('input[type="radio"]:checked');
            if (checked) antworten[zeile.dataset.name] = checked.value;
        });
        const stand = {
            datum: document.getElementById('datum').value,
            marktnummer: document.getElementById('marktnummer').value,
            name: document.getElementById('name').value,
            sifa: document.getElementById('sifa').value,
            antworten,
            unterschrift: istCanvasLeer() ? null : canvas.toDataURL('image/png')
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stand)); } catch (e) {}
    }

    function ladeStand() {
        let gespeichert;
        try { gespeichert = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
        if (!gespeichert) return;
        let stand;
        try { stand = JSON.parse(gespeichert); } catch (e) { return; }

        ['datum', 'marktnummer', 'name', 'sifa'].forEach(id => {
            if (stand[id]) document.getElementById(id).value = stand[id];
        });
        Object.keys(stand.antworten || {}).forEach(name => {
            const radio = document.querySelector(`input[name="${name}"][value="${stand.antworten[name]}"]`);
            if (radio) {
                radio.checked = true;
                const zeile = radio.closest('.frage-zeile');
                zeile.classList.add('hervorhebung-' + (stand.antworten[name] === 'nicht_vorhanden' ? 'nv' : stand.antworten[name]));
            }
        });
        if (stand.unterschrift) {
            const img = new Image();
            img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            img.src = stand.unterschrift;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderKategorien();
        initSignatur();
        ladeStand();
        document.querySelectorAll('#datum, #marktnummer, #name, #sifa').forEach(el => {
            el.addEventListener('input', speichereStand);
        });
    });
</script>

</body>
</html>
