    /* === PRÄZISE DRUCKEINSTELLUNGEN GEGEN ÜBERLAUF UND LOCALHOST === */

<meta content="Auswertung von Arbeitssicherheitsmaßnahmen – Checkliste und PDF-Export." name="description"/></head>
<body>
<div class="container">

    <a href="index.html" class="btn-back">
        <span>&larr;</span> Zurück
    </a>
<h1>🛠️ Maßnahmen-Auswertung</h1>
<section aria-label="Metadaten" class="info" id="meta-info"></section>
<div class="btn-group">
<button onclick="druckMitFooterAusblenden()">📄 Drucken / PDF</button>
<button onclick="pdfTeilen()">📄 PDF generieren &amp; teilen 📤</button>
<button onclick="teilen()">🧾 Text teilen (iPad)</button>

</div>
<table id="maßnahmen-tabelle">
<caption style="display:none;">Liste der Maßnahmen</caption>
<thead>
<tr>
<th style="width: 50px;">Nr.</th>
<th style="width: 35%;">Frage</th>
<th>Beschreibung der Maßnahme</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
<script>
    let aktuelleDaten = null;

    // Meldet dem öffnenden Fenster (liste.html), dass diese Seite fertig
    // geladen ist und jetzt Nachrichten empfangen kann. Verhindert, dass
    // liste.html die Maßnahmen-Daten zu früh sendet und sie verloren gehen.
    if (window.opener) {
      window.opener.postMessage('massnahmen-bereit', '*');
    }

    function zeigeMassnahmen(data) {
      if (!data || typeof data !== 'object') return;
      aktuelleDaten = data;

      let datum = '—';
      if (data.datum) {
        if (/^\d{2}\.\d{2}\.\d{4}$/.test(data.datum)) {
          datum = data.datum;
        } else {
          const d = new Date(data.datum);
          if (!isNaN(d)) {
            datum = d.toLocaleDateString('de-DE', {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric'
            });
          }
        }
      }

      document.getElementById('meta-info').innerHTML = `
        <p><strong>📅 Datum:</strong> ${datum}</p>
        <p><strong>🏬 Marktnummer:</strong> ${data.markt || '—'}</p>
        <p><strong>👤 Marktleitung:</strong> ${data.marktleitung || '—'}</p>
        <p><strong>👤 Teilnehmer:</strong> ${data.name || '—'}</p>
        <p><strong>🛡️ SiFa:</strong> ${data.sifa || '—'}</p>
      `;

      const tbody = document.querySelector('#maßnahmen-tabelle tbody');
      tbody.innerHTML = '';

      if (!Array.isArray(data.maßnahmen) || data.maßnahmen.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="3" style="text-align:center;">🎉 Keine Maßnahmen erforderlich!</td></tr>';
      } else {
        data.maßnahmen.forEach((m, i) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${m.nr || (i + 1)}</td>
            <td>${m.frage || '—'}</td>
            <td>${m.beschreibung || '—'}</td>
          `;
          tbody.appendChild(row);
        });
      }
    }

    // Primärer Übertragungsweg: liste.html sendet die Daten per postMessage
    // direkt an dieses Fenster (siehe exportiereMassnahmen() in liste.html).
    window.addEventListener('message', (event) => {
      if (event.data && event.data !== 'massnahmen-bereit') {
        zeigeMassnahmen(event.data);
      }
    });

    // Rückfalloption für ältere Aufrufe/andere Seiten, die noch über
    // localStorage übergeben.
    document.addEventListener('DOMContentLoaded', () => {
      if (aktuelleDaten) return; // per postMessage schon erhalten
      try {
        const data = JSON.parse(localStorage.getItem('massnahmenDaten') || 'null');
        if (data) zeigeMassnahmen(data);
      } catch (e) {
        console.error('Fehler beim Laden aus localStorage:', e);
      }
    });

   function druckMitFooterAusblenden() {
  // Sucht und versteckt alle potenziellen Footer-Elemente im DOM vor dem Drucken
  const footerElemente = document.querySelectorAll('footer, [id*="footer"], .nav-buttons');
  footerElemente.forEach(el => el.style.display = 'none');

 // nativer Druckaufruf (Tauri öffnet hier den System-Dialog)
  window.print();

  // Blendet die Elemente nach dem Drucken für die App-Ansicht wieder ein
  footerElemente.forEach(el => el.style.display = '');
    }

    async function teilen() {
      if (!aktuelleDaten) {
        alert("❗ Noch keine Daten empfangen.");
        return;
      }

      const text = `Maßnahmenübersicht für Markt ${aktuelleDaten.markt} vom ${aktuelleDaten.datum}:\n\n` +
        aktuelleDaten.maßnahmen.map((m, i) => 
          `${m.nr || (i + 1)}. ${m.frage ? m.frage + '\n   ' : ''}${m.beschreibung}`
        ).join("\n\n") +
        `\n\nName: ${aktuelleDaten.name}\nSiFa: ${aktuelleDaten.sifa}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: `Checkliste ${aktuelleDaten.markt}`,
            text: text
          });
        } catch (err) {
          console.error("❌ Teilen fehlgeschlagen", err);
        }
      } else {
        alert("❌ Teilen wird auf diesem Gerät nicht unterstützt. Bitte Text manuell kopieren.");
      }
    }

    async function pdfTeilen() {
      if (!aktuelleDaten) {
        alert("❗ Noch keine Daten empfangen.");
        return;
      }

      const clone = document.body.cloneNode(true);
      clone.querySelector('.btn-group')?.remove();
      clone.querySelector('.nav-buttons')?.remove();
      clone.querySelector('footer')?.remove();

      const opt = {
        margin: 56.7,
        filename: `Maßnahmen-${aktuelleDaten.markt || 'markt'}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2.5, scrollY: 0 },
        jsPDF: { unit: 'pt', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
      };

      const blob = await html2pdf().set(opt).from(clone).output('blob');
      const file = new File([blob], opt.filename, { type: "application/pdf" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: "Maßnahmen-Auswertung",
            text: `PDF zur Checkliste vom ${aktuelleDaten.datum}`,
            files: [file]
          });
        } catch (err) {
          console.error("❌ Teilen fehlgeschlagen", err);
        }
      } else {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = opt.filename;
        link.click();
        alert("📥 PDF wurde heruntergeladen. Mailversand wird nicht unterstützt.");
      }
    }
  </script>
