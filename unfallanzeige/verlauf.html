<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Unfallanzeige – Archiv</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="brand-row">
      <div class="brand-title">Unfallanzeige</div>
      <div class="brand-form-id">U 1000 · 05/2024</div>
    </div>
    <div class="brand-tagline">Archiv aller erfassten Unfallanzeigen</div>
  </header>
  <nav class="app-nav">
    <a href="index.html">Formular</a>
    <a href="liste.html">Liste</a>
    <a href="verlauf.html" class="active">Archiv</a>
    <a href="auswertung.html">Auswertung</a>
    <a href="faq.html">FAQ</a>
  </nav>

  <main>
    <div class="stat-card" style="margin-bottom:16px;">
      <h3>Daten sichern</h3>
      <div class="stat-sub">Die App speichert ausschließlich lokal auf diesem Gerät. Für ein Backup oder eine Übertragung auf ein anderes Gerät hier exportieren/importieren.</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" class="btn secondary" id="btnExportAlle">Alle Daten exportieren (JSON)</button>
        <button type="button" class="btn ghost" id="btnImportOeffnen">Backup importieren (JSON)</button>
        <input type="file" id="importDatei" accept="application/json" style="display:none;">
      </div>
    </div>
    <div class="field-row" style="margin-bottom:16px;">
      <input type="text" id="suche" placeholder="Suche nach Name, Ort, Datum …">
    </div>
    <div id="liste"></div>
  </main>
  <footer id="app-footer" class="app-footer"></footer>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="js/template-pdf.js"></script>
<script src="js/pdf.js"></script>
<script src="js/version.js"></script>
<script src="js/verlauf.js"></script>
</body>
</html>
