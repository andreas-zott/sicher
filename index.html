<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arbeitssicherheit — Anmeldung</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2226">
<link rel="stylesheet" href="lib/css/fontawesome.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Theme umschalten">🌙</button>

<section class="hero">
    <div class="hero-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>Arbeitssicherheit</h1>
    <p>„Sicher geprüft. Sicher gehandelt."</p>
</section>

<div class="container container-narrow">

    <div class="card">
        <div style="text-align:center; font-size:0.95rem; margin-bottom:8px; color:var(--navy-bright); font-weight:600;">
            🔐 Passwortgeschützt
        </div>

        <form id="loginForm">
            <label for="username">Benutzername</label>
            <input type="text" id="username" autocomplete="username" required>

            <label for="password">Passwort</label>
            <input type="password" id="password" autocomplete="current-password" required>

            <div style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.88rem;">
                <input type="checkbox" id="togglePassword" style="width:auto;">
                <label for="togglePassword" style="margin:0; font-weight:400;">Passwort anzeigen</label>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:22px;">Anmelden</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

</div>

<footer class="app-footer">
    <nav class="app-footer-links">
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
        <a href="quellen.html">Quellen</a>
    </nav>
    <p>© <span class="app-footer-jahr"></span> Andreas Zott — Alle Rechte vorbehalten</p>
    <p class="app-footer-version"></p>
</footer>

<script src="js/common.js"></script>
<script>
    document.getElementById('togglePassword').addEventListener('change', function () {
        document.getElementById('password').type = this.checked ? 'text' : 'password';
    });

    // Zugangsdaten stehen NICHT mehr im Klartext im Quelltext (frueher waren
    // Benutzernamen und Passwoerter fuer jeden lesbar). Gespeichert ist nur
    // ein SHA-256-Hash aus "benutzer:passwort:salz".
    // WICHTIG: Das ist kein echter Zugriffsschutz - alle Seiten sind weiterhin
    // direkt aufrufbar, und kurze Zahlencodes lassen sich durchprobieren.
    // Echter Schutz geht nur serverseitig (z. B. Synology-Freigabe/Webserver-Login).
    // Neuen Zugang anlegen: Hash von "name:passwort:sicher-portal-v1" bilden
    // (z. B. in Python: hashlib.sha256("name:pw:sicher-portal-v1".encode()).hexdigest())
    // und unten eintragen.
    const ZUGANG_SALT = 'sicher-portal-v1';
    const ZUGANG_HASHES = [
        '096059915db0d357e70d93195dfb2c81948a57f24b4bef82a3a6e177041b5119',
        '8ba58190239e984e6edbad83e0f27f76cd069ea16e16c4ee260a20a93cbe938c',
        '15ea2a1adf5e252ae9ee1fab4ce04d65e27aa4686265b3582799230499319628',
        'a2ae2e17ccc144765f30da990739b98bfa3f52670d0cb23f8dbdea3576067ba8',
    ];

    // Kompakte SHA-256-Implementierung (funktioniert auch ohne HTTPS, wo
    // crypto.subtle nicht verfuegbar ist, z. B. bei Aufruf ueber die NAS-IP).
    function sha256Hex(text) {
        const bytes = new TextEncoder().encode(text);
        const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
        const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
        const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6;
        const m = new Uint8Array(n); m.set(bytes); m[l] = 0x80;
        const dv = new DataView(m.buffer);
        dv.setUint32(n - 4, (l * 8) >>> 0); dv.setUint32(n - 8, Math.floor(l / 0x20000000));
        const w = new Uint32Array(64);
        const r = (x, k) => (x >>> k) | (x << (32 - k));
        for (let o = 0; o < n; o += 64) {
            for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
            for (let i = 16; i < 64; i++) {
                const s0 = r(w[i-15], 7) ^ r(w[i-15], 18) ^ (w[i-15] >>> 3);
                const s1 = r(w[i-2], 17) ^ r(w[i-2], 19) ^ (w[i-2] >>> 10);
                w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
            }
            let [a, b, c, d, e, f, g, h] = H;
            for (let i = 0; i < 64; i++) {
                const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
                const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
                h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
            }
            H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
            H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
        }
        return H.map(x => x.toString(16).padStart(8, '0')).join('');
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value;

        if (ZUGANG_HASHES.includes(sha256Hex(`${u}:${p}:${ZUGANG_SALT}`))) {
            window.location.href = 'welcome.html';
        } else {
            document.getElementById('errorMsg').textContent = 'Falscher Benutzername oder Passwort!';
        }
    });
</script>

</body>
</html>
