name: SFTP-Deployment zur DS218play

on:
  push:
    branches:
      - main # Startet das Update bei jedem Push auf den Haupt-Branch

jobs:
  deploy:
    runs-on: ubuntu-latest # Läuft kostenlos auf GitHub-Servern

    steps:
      # 1. Holt den aktuellen Code aus Ihrem Repository
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. Kopiert die HTML/CSS-Dateien per SFTP auf die Synology
      - name: Dateien auf Synology hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USERNAME }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: 22
          protocol: sftp
          local-dir: ./ # Lädt den gesamten Projektordner hoch
          server-dir: /volume1/web/asic-handel/ # Zielordner auf der Synology
