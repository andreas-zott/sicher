<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arbeitssicherheit Foto Formular</title>
<link href="favicon.ico" rel="icon" type="image/x-icon"/>
<link href="manifest.json" rel="manifest"/>
<meta content="#C62828" name="theme-color"/>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/exif.js"></script>
  <style>
    :root {
      --rot: #C62828;
      --rot-dunkel: #A11F1F;
      --gruen: #2e7d32;
      --gruen-dunkel: #1b5e20;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #212529;
      --muted: #6b7280;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1rem;
      padding-bottom: 5.5rem; /* Platz für die fixierte Aktionsleiste */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      position: relative;
    }

    .container-box {
      background-color: var(--card);
      max-width: 820px;
      width: 100%;
      padding: 1.75rem 1.75rem 2rem 1.75rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border-radius: 20px;
      box-sizing: border-box;
    }

    .kopf {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .kopf .icon {
      font-size: 2rem;
      line-height: 1;
    }

    h1#titel {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
    }

    /* --- Formularfelder --- */
    .feld-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 1.5rem;
    }

    .feld {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .feld.voll { grid-column: 1 / -1; }

    .feld label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .feld input {
      border: 1.5px solid #dde1e6;
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 15px;
      font-family: inherit;
      background: #fbfbfc;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .feld input:focus {
      outline: none;
      border-color: var(--rot);
      background: white;
    }

    /* --- Foto-Auswahl: zwei große moderne Kacheln --- */
    .foto-quellen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .quelle-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 10px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 13.5px;
      color: white;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
    }

    .quelle-btn .emoji { font-size: 1.25rem; }

    .quelle-btn.kamera {
      background: linear-gradient(145deg, var(--rot), var(--rot-dunkel));
      box-shadow: 0 4px 14px rgba(198,40,40,0.28);
    }

    .quelle-btn.galerie {
      background: linear-gradient(145deg, #455a64, #2d3b41);
      box-shadow: 0 4px 14px rgba(45,59,65,0.28);
    }

    .quelle-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .quelle-btn:active { transform: translateY(0) scale(0.97); }

    #upload { display: none; }

    /* --- Foto-Vorschau --- */
    .vorschau-titel {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 6px 0 10px 2px;
    }

    #vorschauContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      margin-bottom: 1.75rem;
    }

    #vorschauContainer .leer-hinweis {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 30px 10px;
      border: 2px dashed #dde1e6;
      border-radius: 14px;
      font-size: 14px;
    }

    .img-wrapper {
      position: relative;
      background: #fafafa;
      border: 1px solid #e9ebee;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .img-wrapper .bild-flaeche {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #eceff1;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background-color: rgba(198,40,40,0.9);
      color: white;
      font-weight: bold;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      z-index: 10;
      border: none;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .delete-btn:hover { background-color: rgba(198,40,40,1); }

    .rotation-controls {
      position: absolute;
      bottom: 6px;
      left: 6px;
      right: 6px;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 10;
    }

    .rotate-btn {
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      border-radius: 8px;
      width: 30px;
      height: 30px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(2px);
    }

    .rotate-btn:hover { background: rgba(0,0,0,0.75); }

    #vorschauContainer textarea {
      width: 100%;
      resize: vertical;
      font-size: 13px;
      padding: 8px 9px;
      border: none;
      border-top: 1px solid #e9ebee;
      box-sizing: border-box;
      font-family: inherit;
      min-height: 46px;
      background: white;
    }

    #vorschauContainer textarea:focus {
      outline: none;
      background: #fffdf5;
    }

    /* --- Fixierte Aktionsleiste unten --- */
    .aktionsleiste {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      z-index: 500;
    }

    .aktions-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.12s ease, filter 0.15s ease;
      max-width: 360px;
      margin: 0 auto;
    }

    .aktions-btn.speichern { background: linear-gradient(145deg, var(--gruen), var(--gruen-dunkel)); }
    .aktions-btn.teilen { background: linear-gradient(145deg, var(--rot), var(--rot-dunkel)); }

    .aktions-btn:hover { filter: brightness(1.05); }
    .aktions-btn:active { transform: scale(0.97); }

    .aktions-btn.btn-loading {
      position: relative;
      pointer-events: none;
      color: transparent;
    }

    .aktions-btn.btn-loading::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      margin: auto;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      top: 0; left: 0; bottom: 0; right: 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    footer {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 1.75rem;
      text-align: center;
    }

    #formatHinweis {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      font-weight: 600;
      font-size: 13.5px;
      z-index: 2000;
      max-width: 90%;
      width: 460px;
      text-align: center;
      font-family: inherit;
      cursor: pointer;
      animation: fadeIn 0.4s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-14px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (max-width: 640px) {
      .feld-grid { grid-template-columns: 1fr; }
      .container-box { padding: 1.25rem 1rem 1.5rem 1rem; border-radius: 16px; }
      #vorschauContainer { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }

    /* --- Einheitlicher App-Footer (auf allen Seiten identisch) --- */
    .app-footer {
      margin-top: 40px;
      padding: 22px 16px calc(22px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    .app-footer .app-footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .app-footer .app-footer-links a {
      color: #C62828;
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      background: rgba(198, 40, 40, 0.08);
      transition: background 0.2s ease, color 0.2s ease;
    }
    .app-footer .app-footer-links a:hover {
      background: #C62828;
      color: #fff;
    }
    .app-footer p {
      margin: 2px 0;
    }
    .app-footer .app-footer-version {
      margin-top: 8px;
      font-size: 10.5px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
<div id="formatHinweis">
  🔄 Neue Funktion: Drehen Sie Fotos manuell in der Vorschau 📸.
  <br><small>Klick zum Schließen</small>
</div>

<div class="container-box">

<a href="welcome.html" style="display:inline-flex; align-items:center; gap:6px; color:var(--rot); text-decoration:none; font-weight:600; font-size:0.9rem; margin-bottom:14px;">← Übersicht</a>

<div class="kopf">
  <span class="icon">🦺</span>
  <h1 id="titel">Arbeitssicherheit Checkliste</h1>
</div>

<form id="formular">
  <div class="feld-grid">
    <div class="feld">
      <label for="datum">Datum</label>
      <input type="date" id="datum" name="datum" required />
    </div>
    <div class="feld">
      <label for="marktnummer">Marktnummer</label>
      <input type="text" id="marktnummer" name="marktnummer" placeholder="z.B. M123" required />
    </div>
    <div class="feld">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Ihr Name" required />
    </div>
    <div class="feld">
      <label for="sifa">SiFa</label>
      <input type="text" id="sifa" name="sifa" placeholder="Sicherheitsfachkraft" required />
    </div>
  </div>

  <div class="foto-quellen">
    <input type="file" id="foto" accept="image/*" capture="environment" multiple style="display:none;" />
    <button type="button" id="fotoBtn" class="quelle-btn kamera">
      <span class="emoji">📷</span> Foto aufnehmen
    </button>

    <label for="upload" class="quelle-btn galerie" style="margin:0;">
      <span class="emoji">🖼️</span> Aus Galerie wählen
    </label>
    <input type="file" id="upload" accept="image/*" multiple />
  </div>

  <div class="vorschau-titel">Fotos &amp; Kommentare</div>
  <div id="vorschauContainer"></div>
</form>

<footer class="app-footer">
  <nav class="app-footer-links">
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
    <a href="faq.html">FAQ</a>
    <a href="technische-beschreibung.html">Technik</a>
    <a href="welcome.html">Startseite</a>
  </nav>
  <p>© <span class="app-footer-jahr"></span> Andreas Zott – Alle Rechte vorbehalten</p>
  <p class="app-footer-sub">(SiFa) Arbeitssicherheit</p>
  <p class="app-footer-version">Version 2.0.0</p>
</footer>
</div>

<div class="aktionsleiste">
  <button type="button" id="pdfSpeichern" class="aktions-btn speichern" onclick="speichernAlsPDF()">💾 Als PDF speichern</button>
  <button type="button" id="pdfTeilen" class="aktions-btn teilen" onclick="pdfTeileniPad()">📤 PDF teilen</button>
</div>

<script>
  let bilder = [];

  function getRotatedImageDataURL(src, rotation, callback) {
    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const angle = (rotation % 360 + 360) % 360;
      if (angle === 90 || angle === 270) {
        canvas.width = img.height;
        canvas.height = img.width;
      } else {
        canvas.width = img.width;
        canvas.height = img.height;
      }
      ctx.save();
      switch (angle) {
        case 90: ctx.translate(canvas.width, 0); ctx.rotate(Math.PI / 2); break;
        case 180: ctx.translate(canvas.width, canvas.height); ctx.rotate(Math.PI); break;
        case 270: ctx.translate(0, canvas.height); ctx.rotate(3 * Math.PI / 2); break;
      }
      ctx.drawImage(img, 0, 0);
      ctx.restore();
      callback(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.onerror = () => callback(src);
    img.src = src;
  }

  function renderVorschau() {
    const vorschauContainer = document.getElementById("vorschauContainer");
    vorschauContainer.innerHTML = "";
    if (bilder.length === 0) {
      vorschauContainer.innerHTML = '<p class="leer-hinweis">Noch keine Bilder ausgewählt</p>';
      return;
    }
    bilder.forEach((bildObj, index) => {
      const wrapper = document.createElement("div");
      wrapper.className = "img-wrapper";

      const bildFlaeche = document.createElement("div");
      bildFlaeche.className = "bild-flaeche";

      const imgElement = document.createElement("img");
      imgElement.src = bildObj.src;
      imgElement.style.transform = `rotate(${bildObj.rotation || 0}deg)`;

      const rotateLeft = document.createElement("button");
      rotateLeft.textContent = "⟲";
      rotateLeft.type = "button";
      rotateLeft.className = "rotate-btn";
      rotateLeft.onclick = () => {
        bildObj.rotation = ((bildObj.rotation || 0) - 90 + 360) % 360;
        renderVorschau();
      };

      const rotateRight = document.createElement("button");
      rotateRight.textContent = "⟳";
      rotateRight.type = "button";
      rotateRight.className = "rotate-btn";
      rotateRight.onclick = () => {
        bildObj.rotation = ((bildObj.rotation || 0) + 90) % 360;
        renderVorschau();
      };

      const rotateContainer = document.createElement("div");
      rotateContainer.className = "rotation-controls";
      rotateContainer.appendChild(rotateLeft);
      rotateContainer.appendChild(rotateRight);

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "✖";
      deleteBtn.type = "button";
      deleteBtn.className = "delete-btn";
      deleteBtn.onclick = () => {
        if (confirm("Möchten Sie dieses Foto wirklich löschen?")) {
          bilder.splice(index, 1);
          renderVorschau();
        }
      };

      const kommentar = document.createElement("textarea");
      kommentar.value = bildObj.kommentar || "";
      kommentar.placeholder = "Kommentar hier eingeben...";
      kommentar.oninput = (e) => bildObj.kommentar = e.target.value;

      bildFlaeche.appendChild(imgElement);
      bildFlaeche.appendChild(deleteBtn);
      bildFlaeche.appendChild(rotateContainer);

      wrapper.appendChild(bildFlaeche);
      wrapper.appendChild(kommentar);
      vorschauContainer.appendChild(wrapper);
    });
  }

  async function createPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 40;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const cols = 2, rows = 2, imagesPerPage = cols * rows;
    const cellWidth = (pageWidth - margin * 2) / cols;
    const cellHeight = (pageHeight - margin * 2 - 60) / rows;

    const datumInput = document.getElementById("datum").value;
    const datumObj = new Date(datumInput);
    const datumDeutsch = datumObj.toLocaleDateString("de-DE", {
      day: "2-digit",
      month: "long",
      year: "numeric"
    });

    const marktnummer = document.getElementById("marktnummer").value;
    const name = document.getElementById("name").value;
    const sifa = document.getElementById("sifa").value;

    function drawHeader() {
      doc.setFontSize(18);
      doc.setFont(undefined, 'bold');
      doc.text("Arbeitssicherheit-Checkliste-2025", margin, margin + 20);
      doc.setFontSize(11);
      doc.setFont(undefined, 'normal');
      doc.text(`Datum: ${datumDeutsch}`, margin, margin + 45);
      doc.text(`Marktnummer: ${marktnummer}`, margin + 200, margin + 45);
      doc.text(`Name: ${name}`, margin, margin + 60);
      doc.text(`SiFa: ${sifa}`, margin + 200, margin + 60);
      doc.line(margin, margin + 70, pageWidth - margin, margin + 70);
    }

    let page = 0;
    for (let i = 0; i < bilder.length; i += imagesPerPage) {
      if (page > 0) doc.addPage();
      drawHeader();
      const bilderSeite = bilder.slice(i, i + imagesPerPage);
      for (let j = 0; j < bilderSeite.length; j++) {
        const bildObj = bilderSeite[j];
        const col = j % cols;
        const row = Math.floor(j / cols);
        const x = margin + col * cellWidth;
        const y = margin + 80 + row * cellHeight;
        const maxW = cellWidth * 0.9, maxH = cellHeight * 0.7;
        const rotatedSrc = await new Promise((resolve) => getRotatedImageDataURL(bildObj.src, bildObj.rotation || 0, resolve));
        const imgProps = doc.getImageProperties(rotatedSrc);
        let imgW = maxW, imgH = imgW / (imgProps.width / imgProps.height);
        if (imgH > maxH) { imgH = maxH; imgW = imgH * (imgProps.width / imgProps.height); }
        const offsetX = x + (cellWidth - imgW) / 2;
        const offsetY = y + 10;
        doc.addImage(rotatedSrc, "JPEG", offsetX, offsetY, imgW, imgH);
        if (bildObj.kommentar) {
          doc.setFontSize(9);
          doc.text(doc.splitTextToSize(bildObj.kommentar, cellWidth - 20), x + 10, offsetY + imgH + 15);
        }
      }
      page++;
    }
    return doc;
  }

  async function speichernAlsPDF() {
    if (!validateForm()) return;
    const btn = document.getElementById("pdfSpeichern");
    btn.classList.add("btn-loading"); btn.disabled = true;
    try {
      const doc = await createPDF();
      const datum = new Date(document.getElementById("datum").value);
      const datumDeutsch = datum.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });
      const marktnummer = document.getElementById("marktnummer").value;
      doc.save(`Arbeitssicherheit-Fotos-${datumDeutsch}-${marktnummer}.pdf`);
    } catch (e) {
      alert("Fehler beim Erstellen des PDFs");
    } finally {
      btn.classList.remove("btn-loading"); btn.disabled = false;
    }
  }

  async function pdfTeileniPad() {
    if (!validateForm()) return;
    const btn = document.getElementById("pdfTeilen");
    btn.classList.add("btn-loading"); btn.disabled = true;

    try {
      const doc = await createPDF();
      const datumInput = document.getElementById("datum").value;
      const datumObj = new Date(datumInput);
      const datumDeutsch = datumObj.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });
      const marktnummer = document.getElementById("marktnummer").value;
      const name = document.getElementById("name").value;
      const sifa = document.getElementById("sifa").value;

      const filename = `Arbeitssicherheit-Fotos-${datumDeutsch}-${marktnummer}.pdf`;
      const blob = doc.output("blob");
      const file = new File([blob], filename, { type: "application/pdf" });

      if (!navigator.canShare || !navigator.canShare({ files: [file] })) throw new Error();

      await navigator.share({
        title: `Begehungsliste ${marktnummer}`,
        text: `Sehr geehrte Damen und Herren,

anbei übermittle ich Ihnen die Fotos zur Begehungsliste für den Markt ${marktnummer} zur sachlichen Prüfung und weiteren Verwendung.
Für Rückfragen oder ergänzende Informationen stehe ich Ihnen jederzeit gerne zur Verfügung.

Ich danke Ihnen im Voraus für Ihre Aufmerksamkeit. PDF vom ${datumDeutsch}

Mit freundlichem Gruß
Fachkraft für Arbeitssicherheit (SiFa: ${sifa})`,
        files: [file]
      });

    } catch (e) {
      const doc = await createPDF();
      const blob = doc.output("blob");
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Fotos zur Checkliste.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("Teilen nicht möglich. PDF wurde heruntergeladen.");
    } finally {
      btn.classList.remove("btn-loading");
      btn.disabled = false;
    }
  }

  function validateForm() {
    const datum = document.getElementById("datum").value;
    const marktnummer = document.getElementById("marktnummer").value;
    const name = document.getElementById("name").value;
    const sifa = document.getElementById("sifa").value;
    if (!datum || !marktnummer || !name || !sifa) {
      alert("Bitte füllen Sie alle Pflichtfelder aus.");
      return false;
    }
    if (bilder.length === 0) {
      alert("Bitte fügen Sie mindestens ein Foto hinzu.");
      return false;
    }
    return true;
  }

  document.getElementById("fotoBtn").addEventListener("click", () => {
    document.getElementById("foto").click();
  });
  document.getElementById("foto").addEventListener("change", handleFile);
  document.getElementById("upload").addEventListener("change", handleFile);

  function handleFile(event) {
    const files = event.target.files;
    if (!files.length) return;
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          bilder.push({ src: e.target.result, kommentar: "", rotation: 0 });
          renderVorschau();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    event.target.value = "";
  }

  const hinweis = document.getElementById("formatHinweis");
  if (hinweis) {
    setTimeout(() => hinweis.style.display = "none", 5000);
    hinweis.addEventListener("click", () => hinweis.style.display = "none");
  }

  renderVorschau();

  document.getElementById("datum").value = new Date().toISOString().split("T")[0];
  document.querySelectorAll(".app-footer-jahr").forEach(el => el.textContent = new Date().getFullYear());

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sicher/service-worker.js')
        .catch(err => console.warn('Service Worker konnte nicht registriert werden:', err));
    });
  }

  const aktuellesJahr = new Date().getFullYear();
  const titel = document.getElementById('titel');
  titel.textContent = titel.textContent.replace(/\d{4}/, aktuellesJahr);

  function getQueryParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name) || '';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const marktnummer = getQueryParam('marktnummer');
    const name = getQueryParam('name');
    const sifa = getQueryParam('sifa');

    if (marktnummer) document.getElementById('marktnummer').value = marktnummer;
    if (name) document.getElementById('name').value = name;
    if (sifa) document.getElementById('sifa').value = sifa;
  });
</script>
</body>
</html>
